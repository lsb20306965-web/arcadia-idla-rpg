<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070912">
<title>아르카디아 기사단 키우기 II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{
  background:#05070d;color:#e9edf6;
  font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;overscroll-behavior:none;
}
:root{
  --gold:#f7cb77; --gold-d:#b8862f; --dia:#8fdcff; --line:#27324e; --line2:#38466a;
  --panel:#0d1220; --panel2:#111829; --hp:#ff5566; --hp2:#ff8a5c; --blue:#5aa8ff;
  --txt:#e9edf6; --dim:#93a1c0; --dim2:#6b7896;
  --shadow:0 18px 50px rgba(0,0,0,.65);
}
#app{
  position:relative;display:flex;width:100%;height:100dvh;overflow:hidden;
  background:#070912;box-shadow:0 0 0 1px rgba(120,150,220,.08);
}
/* ================= battle column ================= */
.battle-col{position:relative;flex:1 1 auto;min-width:0;overflow:hidden;background:#05070f}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.battle-col::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%,transparent 42%,rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply;
}
.overlay{position:absolute;inset:0;pointer-events:none;z-index:5}
.overlay > *{pointer-events:auto}

/* HUD */
.hud{
  position:absolute;top:0;left:0;right:0;z-index:9;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,rgba(6,9,17,.92),rgba(6,9,17,.55) 62%,rgba(6,9,17,0));
  pointer-events:none;
}
.hud > *{pointer-events:auto}
.hud-id{display:flex;align-items:center;gap:8px;min-width:0}
.crest{
  width:38px;height:38px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(160deg,#2b3b63,#141c30 70%);border:1px solid #47608f;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 18px rgba(110,160,255,.25);
}
.hud-title{font-family:"Black Han Sans",sans-serif;font-size:15px;letter-spacing:.01em;line-height:1.1;
  color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 16px rgba(120,170,255,.4);display:flex;align-items:center;gap:6px}
.tag-live{font-family:"Noto Sans KR",sans-serif;font-size:7.5px;font-weight:900;letter-spacing:.12em;color:#8ff5c8;
  border:1px solid rgba(90,225,165,.45);background:rgba(25,120,90,.28);border-radius:4px;padding:1px 4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.hud-sub{font-size:10.5px;color:#b9c6e2;margin-top:1px;white-space:nowrap}
.hud-sub b{color:var(--gold);font-variant-numeric:tabular-nums}
.hud-right{margin-left:auto;display:flex;align-items:center;gap:5px}
.cur{
  display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;
  background:rgba(9,13,24,.85);border:1px solid #2b3752;border-radius:20px;padding:4px 10px 4px 7px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);white-space:nowrap;
}
.coin{width:13px;height:13px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 35% 28%,#fff3c4,#eab340 58%,#94630f);box-shadow:inset 0 0 0 1.4px rgba(120,70,0,.4)}
.gem{width:11px;height:11px;flex:0 0 auto;margin:0 1px;transform:rotate(45deg);border-radius:2px;
  background:linear-gradient(160deg,#c9f1ff,#3ea6ff 55%,#1b5fc4);box-shadow:0 0 9px rgba(90,180,255,.7)}
#goldTxt{color:#f8dc9a} #diaTxt{color:#a7e5ff}
.ico-btn{
  width:30px;height:30px;border-radius:9px;border:1px solid #33405e;background:rgba(18,24,40,.9);
  color:#a8b6d4;font-size:13px;font-weight:800;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
  transition:transform .12s,background .2s,color .2s;
}
.ico-btn:active{transform:scale(.92)}
.ico-btn.on{color:#0c1120;background:linear-gradient(180deg,#ffd98a,#e0a740);border-color:#ffe0a0}
.ico-btn.speed{font-size:11px;width:38px}

/* combo */
.combo{position:absolute;left:50%;top:12%;transform:translate(-50%,0);z-index:8;text-align:center;opacity:0;
  transition:opacity .2s;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.55)}
.combo.on{opacity:1}
.combo b{font-family:"Black Han Sans",sans-serif;font-size:34px;color:#ffe066;line-height:1;
  -webkit-text-stroke:2px #7a3d00;text-shadow:0 0 20px rgba(255,180,50,.9)}
.combo i{display:block;font-style:normal;font-size:11px;font-weight:900;letter-spacing:.32em;color:#ffd68a}

/* boss */
.boss-wrap{position:absolute;left:50%;top:calc(92px + env(safe-area-inset-top));transform:translateX(-50%);
  width:min(64%,560px);z-index:8;display:none;pointer-events:none}
.boss-wrap.on{display:block;animation:bossIn .4s ease-out}
@keyframes bossIn{from{opacity:0;transform:translate(-50%,-14px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.boss-top{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:3px}
.boss-top span{font-family:"Black Han Sans",sans-serif;font-size:12.5px;color:#ffb0b0;letter-spacing:.06em;
  text-shadow:0 2px 0 #000,0 0 14px rgba(255,60,60,.8)}
.boss-bar{height:11px;border-radius:6px;background:rgba(10,5,10,.8);border:1px solid rgba(255,120,120,.4);
  overflow:hidden;box-shadow:0 0 18px rgba(255,60,60,.35)}
.boss-fill{height:100%;width:100%;background:linear-gradient(180deg,#ff8a6b,#e0203c 60%,#8c0a20);
  transition:width .12s;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

/* party */
.party{position:absolute;left:10px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;display:flex;gap:5px}
.pcard{
  width:47px;border-radius:8px;background:linear-gradient(180deg,rgba(16,22,38,.92),rgba(9,13,24,.92));
  border:1px solid #2b3750;padding:3px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 4px 14px rgba(0,0,0,.5);transition:border-color .2s,opacity .3s
}
.pcard.down{opacity:.42;filter:grayscale(.8)}
.pcard .pav{width:24px;height:24px;border-radius:6px;overflow:hidden;background:#0a0f1c;border:1px solid #38466a}
.pcard .pav img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.pcard .pnm{font-size:8px;font-weight:800;color:#cdd8ef;line-height:1}
.pcard .pbar{width:100%;height:3.5px;border-radius:2px;background:#241a22;overflow:hidden}
.pcard .pbar > i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b6b,#ffb36b);transition:width .2s}
.pcard.low .pbar > i{background:linear-gradient(90deg,#ff2f45,#c1122a)}

/* cut-in */
.cutin{position:absolute;inset:0;z-index:14;display:none;pointer-events:none;overflow:hidden}
.cutin.on{display:block}
.cutin .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:cutFlash .55s ease-out}
@keyframes cutFlash{0%{opacity:.5}30%{opacity:.08}100%{opacity:0}}
.cutin .band{
  position:absolute;left:-6%;right:-6%;top:50%;height:min(15%,124px);transform:translateY(-50%) skewX(-11deg);
  background:linear-gradient(90deg,rgba(10,14,26,0),var(--c1) 12%,var(--c2) 55%,rgba(10,14,26,0));
  border-top:2px solid rgba(255,255,255,.55);border-bottom:2px solid rgba(255,255,255,.25);
  box-shadow:0 0 40px var(--c2),inset 0 0 60px rgba(0,0,0,.45);
  animation:cutBand .95s cubic-bezier(.2,.9,.2,1) both;opacity:0
}
@keyframes cutBand{
  0%{transform:translateY(-50%) skewX(-11deg) scaleY(.05);opacity:0}
  16%{transform:translateY(-50%) skewX(-11deg) scaleY(1);opacity:1}
  78%{opacity:1}
  100%{transform:translateY(-50%) skewX(-11deg) scaleY(1) translateX(6%);opacity:0}
}
.cutin .inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transform:skewX(-11deg);animation:cutIn .95s ease-out both}
@keyframes cutIn{0%{opacity:0;transform:skewX(-11deg) translateX(-40px) scale(.9)}18%{opacity:1;transform:skewX(-11deg) translateX(0) scale(1)}80%{opacity:1}100%{opacity:0;transform:skewX(-11deg) translateX(20px) scale(1.02)}}
.cutin .ico{font-size:clamp(24px,4.6vh,44px);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));margin-right:12px}
.cutin .txt{display:flex;flex-direction:column;line-height:1.02}
.cutin .who{font-size:clamp(8px,1.25vh,11px);font-weight:900;letter-spacing:.34em;color:rgba(255,255,255,.92)}
.cutin .nm{font-family:"Black Han Sans",sans-serif;font-size:clamp(22px,5.2vh,50px);color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 22px rgba(255,255,255,.55)}
.cutin .rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0deg 4deg,transparent 4deg 16deg);
  animation:spin 9s linear infinite;opacity:.14;mix-blend-mode:screen}
@keyframes spin{to{transform:rotate(360deg)}}

/* mission bar */
.mission{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));
  width:min(94%,640px);z-index:9;display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,rgba(23,20,38,.96),rgba(12,12,24,.97));
  border:1px solid #4a4230;border-radius:12px;padding:7px 8px 7px 9px;
  box-shadow:0 10px 28px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,220,150,.16);
}
.mission .mico{width:30px;height:30px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;font-size:15px;
  background:linear-gradient(160deg,#3a2f1b,#241d12);border:1px solid #6b5730}
.mission .mbody{flex:1 1 auto;min-width:0}
.mission .mline{display:flex;align-items:baseline;gap:6px;min-width:0}
.mission .mtag{font-size:8px;font-weight:900;letter-spacing:.1em;color:#8a7650;flex:0 0 auto}
.mission .mtext{font-size:11.5px;font-weight:800;color:#f4e7c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mission .mtext em{font-style:normal;color:var(--gold)}
.mission .mprog{margin-top:4px;height:3px;border-radius:2px;background:#241f18;overflow:hidden}
.mission .mprog > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0b64a,#ffe9a8);transition:width .3s}
.mission .mrew{font-size:9.5px;font-weight:800;color:#ffd98a;flex:0 0 auto;white-space:nowrap}
.mission .mbtn{
  flex:0 0 auto;border:0;border-radius:8px;padding:7px 11px;font-family:"Noto Sans KR",sans-serif;
  font-size:10.5px;font-weight:900;color:#5a3d05;background:linear-gradient(180deg,#ffd98a,#e8b345);
  box-shadow:0 3px 0 #9a6f1c,inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer
}
.mission .mbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6f1c}
.mission .mbtn[disabled]{background:linear-gradient(180deg,#39405a,#262c40);color:#8794ad;box-shadow:none;cursor:default}
.mission.ready{border-color:#f0c063;animation:missionGlow 1.1s infinite}
@keyframes missionGlow{0%,100%{box-shadow:0 10px 28px rgba(0,0,0,.62),0 0 0 1px rgba(240,192,99,.4)}50%{box-shadow:0 10px 28px rgba(0,0,0,.62),0 0 22px rgba(240,192,99,.75)}}

/* stage clear banner */
.stageclear{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);z-index:12;
  text-align:center;opacity:0;visibility:hidden;pointer-events:none}
.stageclear.on{visibility:visible;animation:scBanner 1.7s ease-out both}
@keyframes scBanner{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
  22%{transform:translate(-50%,-50%) scale(1)}
  76%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-58%) scale(1)}
}
.stageclear .t1{font-family:"Black Han Sans",sans-serif;font-size:clamp(26px,6vh,52px);color:#fff;
  -webkit-text-stroke:2px rgba(20,30,60,.85);text-shadow:0 0 26px rgba(140,200,255,.9),0 4px 0 rgba(0,0,0,.4)}
.stageclear .t2{margin-top:2px;font-size:11px;font-weight:900;letter-spacing:.3em;color:#cfe4ff}

/* toast */
.toast{position:absolute;left:50%;bottom:calc(66px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:20;background:rgba(10,14,24,.94);border:1px solid #3d4a6c;border-radius:9px;padding:7px 14px;
  font-size:11.5px;font-weight:700;color:#e8eefc;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.6);max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ================= wall & wave HUD ================= */
.wallhud{position:absolute;left:10px;top:calc(50px + env(safe-area-inset-top));z-index:8;width:min(60%,430px);pointer-events:none}
.wh-top{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;color:#cfd9ee;
  text-shadow:0 1px 2px #000,0 0 8px #000}
.wh-ico{font-size:12px;filter:drop-shadow(0 1px 2px #000)}
.wh-lbl{letter-spacing:.02em;white-space:nowrap}
.wh-val{margin-left:auto;font-variant-numeric:tabular-nums;color:#dfe9ff;font-size:9.5px}
.wh-wave{font-family:"Black Han Sans",sans-serif;font-size:10px;color:#ffd98a;background:rgba(60,44,12,.78);
  border:1px solid #6d5620;border-radius:4px;padding:0 5px;letter-spacing:.04em;white-space:nowrap}
.wh-bar{position:relative;height:11px;margin-top:3px;border-radius:6px;background:rgba(8,11,20,.82);
  border:1px solid rgba(110,140,190,.45);overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.7),0 2px 10px rgba(0,0,0,.45)}
.wh-bar > i{display:block;height:100%;width:100%;border-radius:5px;
  background:linear-gradient(180deg,#8fe6b0,#3fb277 55%,#1d7a4a);transition:width .18s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.wh-bar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.20) 0 2px,transparent 2px 9px)}
.wallhud.low .wh-bar > i{background:linear-gradient(180deg,#ffb07a,#ff7043 55%,#c62b1f);animation:wallPulse .8s infinite}
.wallhud.low .wh-val{color:#ffb3b3}
@keyframes wallPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
.wh-tip{margin-top:2px;font-size:8px;color:#8fa0bd;opacity:.8}
.danger{position:absolute;inset:0;z-index:12;pointer-events:none;opacity:0;transition:opacity .35s;
  box-shadow:inset 0 0 50px 6px rgba(255,50,60,.55),inset 0 0 120px 24px rgba(150,0,20,.30)}
.danger.on{opacity:1;animation:dangerPulse .9s infinite}
@keyframes dangerPulse{0%,100%{opacity:.35}50%{opacity:1}}
.breakbanner,.wavebanner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.8);z-index:13;
  text-align:center;opacity:0;visibility:hidden;pointer-events:none;width:100%}
.breakbanner.on{visibility:visible;animation:breakIn 2.4s ease-out both}
@keyframes breakIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  18%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%) scale(1)}}
.breakbanner .t1{font-family:"Black Han Sans",sans-serif;font-size:clamp(24px,5.4vh,46px);color:#ff8a8a;
  -webkit-text-stroke:2px rgba(60,0,10,.8);text-shadow:0 0 26px rgba(255,60,60,.85),0 4px 0 rgba(0,0,0,.5)}
.breakbanner .t2{margin-top:3px;font-size:10.5px;font-weight:900;letter-spacing:.28em;color:#ffc9c9}
.wavebanner.on{visibility:visible;animation:waveIn 1.4s ease-out both}
@keyframes waveIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}14%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  76%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}}
.wavebanner b{display:block;font-family:"Black Han Sans",sans-serif;font-size:clamp(18px,3.6vh,30px);color:#fff;
  letter-spacing:.06em;text-shadow:0 0 18px rgba(140,200,255,.9),0 3px 0 rgba(0,0,0,.45)}
.wavebanner i{display:block;font-style:normal;font-size:9.5px;font-weight:900;letter-spacing:.28em;color:#ffd98a;margin-top:2px}
@media (max-width:720px){.wh-tip{display:none}.wallhud{width:min(66%,340px);top:calc(46px + env(safe-area-inset-top))}}

/* ================= side ================= */
.side-col{
  flex:0 0 clamp(330px,37%,600px);width:37%;min-width:330px;max-width:600px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0e1424,#080c16 70%);border-left:1px solid #1f2a44;min-height:0;
  box-shadow:-14px 0 36px rgba(0,0,0,.55);z-index:10
}
.side-head{
  flex:0 0 auto;padding:calc(9px + env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,#151d33,#101728);border-bottom:1px solid #24304c
}
.sh-row{display:flex;align-items:center;gap:7px}
.rank{
  font-family:"Black Han Sans",sans-serif;font-size:11.5px;color:#0d1020;padding:2px 8px;border-radius:5px;
  background:linear-gradient(180deg,#ffe6a8,#e6b44e);box-shadow:0 2px 0 #8f6720,inset 0 1px 0 rgba(255,255,255,.7);white-space:nowrap
}
.sh-title{font-size:11px;font-weight:800;color:#c3cfe8}
.sh-power{margin-left:auto;font-size:11px;font-weight:800;color:#98a7c6;white-space:nowrap}
.sh-power b{font-family:"Black Han Sans",sans-serif;color:#ffd88a;font-size:13px;letter-spacing:.02em}
.sh-stats{display:flex;gap:5px;margin-top:6px}
.sh-chip{
  flex:1;background:#0c1220;border:1px solid #222e4a;border-radius:6px;padding:3px 6px;font-size:9.5px;color:#8d9bb8;
  display:flex;justify-content:space-between;gap:3px
}
.sh-chip b{color:#dfe8f8;font-weight:800;font-variant-numeric:tabular-nums}

.tabs{flex:0 0 auto;display:flex;gap:4px;padding:7px 8px;background:#0b1020;border-bottom:1px solid #1d2740}
.tab{
  flex:1;position:relative;border:1px solid #26314e;background:linear-gradient(180deg,#141b2e,#0e1424);
  color:#8f9dba;font-family:"Noto Sans KR",sans-serif;font-size:11.5px;font-weight:800;padding:7px 0 6px;
  border-radius:8px;cursor:pointer;transition:all .18s;letter-spacing:-.01em
}
.tab:active{transform:scale(.97)}
.tab.on{
  color:#0e1320;background:linear-gradient(180deg,#ffe09b,#e9b64c);border-color:#ffe8b0;
  box-shadow:0 2px 0 #9c711f,0 0 16px rgba(240,190,90,.28)
}
.tab .dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:#ff5a6e;
  box-shadow:0 0 6px #ff5a6e;display:none}
.tab.has .dot{display:block}
.panel{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:9px 9px 26px;scrollbar-width:thin;
  scrollbar-color:#2b3752 transparent}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:#2b3752;border-radius:3px}
/* ================= panel widgets ================= */
.sec-h{display:flex;align-items:center;gap:6px;margin:10px 2px 6px}
.sec-h .si{font-size:12px}
.sec-h h3{margin:0;font-size:11.5px;font-weight:900;color:#dfe8f8;letter-spacing:.01em}
.sec-h .n{margin-left:auto;font-size:9.5px;color:#77859f}
.card{
  background:linear-gradient(180deg,#131a2b,#0d1320);border:1px solid #24304a;border-radius:10px;
  padding:8px;margin-bottom:6px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035)
}
.stat{display:flex;align-items:center;gap:8px}
.stat .si{
  width:34px;height:34px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;font-size:16px;
  background:linear-gradient(160deg,#26324f,#161d2f);border:1px solid #39486a
}
.stat .smain{flex:1 1 auto;min-width:0}
.stat .stop{display:flex;align-items:baseline;gap:5px}
.stat .sname{font-size:11.5px;font-weight:800;color:#e6edfa}
.stat .slv{font-family:"Black Han Sans",sans-serif;font-size:11px;color:#ffd98a;background:#2a2312;

.buyrow{display:flex;gap:5px;margin-top:6px}
.buy{
  flex:1;border:1px solid #3a4a6e;border-radius:7px;background:linear-gradient(180deg,#1d2942,#141b2c);

.buy.can{border-color:#c79a3c;background:linear-gradient(180deg,#3a2f16,#241d10);color:#ffe4a8}
.buy.can span{color:#e8c983}
.buy.max{opacity:.5;border-color:#4b4f5e;color:#a5adbe}
.buy.max span{color:#8c93a2}
.buy.maxed{background:linear-gradient(180deg,#2a2f42,#1b2030);border-color:#454f6b;color:#b9c4dc}

.equip{display:flex;gap:5px;margin-bottom:2px}
.eslot{
  flex:1;min-width:0;border:1px solid #26314c;border-radius:9px;background:linear-gradient(180deg,#121828,#0c111d);

}
.eslot:active{transform:scale(.97)}
.eslot .ei{font-size:16px;line-height:1.2}
.eslot .en{font-size:8.5px;font-weight:800;color:#c9d5ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.eslot .eg{font-size:7.5px;font-weight:900;letter-spacing:.04em}
.eslot .elv{position:absolute;top:3px;right:3px;font-size:7.5px;font-weight:900;color:#ffe6a8;background:rgba(0,0,0,.5);

.eslot.g1{border-color:#4a5468} .eslot.g2{border-color:#3f8f63;box-shadow:0 0 12px rgba(60,200,120,.14)}
.eslot.g3{border-color:#3f7fbf;box-shadow:0 0 12px rgba(70,150,255,.18)}
.eslot.g4{border-color:#8a5fd0;box-shadow:0 0 14px rgba(170,110,255,.22)}
.eslot.g5{border-color:#d9a043;box-shadow:0 0 16px rgba(255,180,60,.3)}
.eslot.g6{border-color:#e0535f;box-shadow:0 0 18px rgba(255,70,90,.35)}

/* gacha */
.gacha-hero{

  background:
    radial-gradient(80% 120% at 20% 0%,rgba(255,190,90,.22),transparent 60%),

.pity{display:flex;gap:5px;margin-top:7px}
.pity .p{flex:1;background:rgba(8,10,20,.6);border:1px solid #342c46;border-radius:7px;padding:4px 6px}
.pity .pl{font-size:8px;color:#9b8fb3;font-weight:700}

.gbtns{display:flex;gap:6px;margin-top:8px}

}
.gbig.alt{background:linear-gradient(180deg,#b791ff,#7c50e0);color:#fff;border-color:#c9b0ff;box-shadow:0 3px 0 #4f2c9c,inset 0 1px 0 rgba(255,255,255,.4)}

.gbig .gl{font-size:9px;font-weight:800;opacity:.85}
.gbig .gc{font-size:11.5px;font-weight:900;display:flex;align-items:center;gap:3px}

.ticketline{margin-top:6px;font-size:9.5px;color:#b9a9d4;display:flex;align-items:center;gap:5px}
.ticketline button{margin-left:auto;border:1px solid #5a4a86;background:#241b3e;color:#e6d8ff;border-radius:6px;

.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.rate{display:flex;align-items:center;gap:3px;font-size:9px;font-weight:700;background:#0e1424;border:1px solid #212b44;

.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}

}

.inv .il{font-size:7.5px;font-weight:800;color:#ffe6a8;position:absolute;top:2px;right:3px}

.inv.g5{border-color:#a97a26} .inv.g6{border-color:#a03a44} .inv.g4{border-color:#6a479e} .inv.g3{border-color:#356a9e}

/* dungeon */
.dgn{display:flex;align-items:center;gap:8px;cursor:pointer;transition:transform .14s}
.dgn:active{transform:scale(.985)}
.dgn .di{width:40px;height:40px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(160deg,#2a2233,#161a26);border:1px solid #463a52}
.dgn .dmain{flex:1 1 auto;min-width:0}
.dgn .dn{font-size:11.5px;font-weight:800;color:#eaf0fb;display:flex;align-items:center;gap:5px}
.dgn .dd{font-size:9px;color:#8390aa;margin-top:1px;line-height:1.35}
.dgn .dc{font-size:8.5px;font-weight:800;color:#8fe0b0;margin-top:2px}
.dgn .dgo{

}
.dgn .dgo[disabled]{border-color:#3a4155;background:#161c2a;color:#717d95}

/* shop */
.prod{display:flex;gap:8px;align-items:center;position:relative}
.prod .pi{width:42px;height:42px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(160deg,#2f2740,#171b2a);border:1px solid #4a3d5c}
.prod .pmain{flex:1 1 auto;min-width:0}
.prod .pname{font-size:11px;font-weight:900;color:#f0f4ff;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.prod .pbadge{font-size:7px;font-weight:900;letter-spacing:.04em;color:#0e1320;background:linear-gradient(180deg,#ffe6a8,#e3b34c);
  padding:1px 4px;border-radius:3px}
.prod .pbadge.purple{background:linear-gradient(180deg,#c6a8ff,#8f63e0);color:#fff}
.prod .pbadge.red{background:linear-gradient(180deg,#ff9a9a,#e04747);color:#fff}
.prod ul{margin:3px 0 0;padding-left:0;list-style:none}
.prod li{font-size:9px;color:#9fadc8;line-height:1.45;display:flex;gap:4px}
.prod li::before{content:"·";color:#c9a75a}
.prod .pbuy{
  flex:0 0 auto;border:1px solid #6a5220;border-radius:8px;background:linear-gradient(180deg,#ffdf9a,#e3ac3f);
  color:#4a3103;font-family:"Noto Sans KR",sans-serif;font-weight:900;padding:7px 8px;cursor:pointer;line-height:1.1;
  display:flex;flex-direction:column;align-items:center;gap:1px;min-width:58px
}
.prod .pbuy small{font-size:9px;font-weight:800;opacity:.8}
.prod .pbuy b{font-size:11px}
.prod .pbuy:active{transform:translateY(1px)}
.prod .pbuy.done{background:linear-gradient(180deg,#39405a,#262c40);color:#8794ad;border-color:#414a63}
.dias{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.diap{display:flex;align-items:center;gap:6px;border:1px solid #2b3651;border-radius:8px;background:#0e1424;padding:6px;
  cursor:pointer;position:relative;overflow:hidden}
.diap .gem{width:16px;height:16px}
.diap .dq{font-size:11px;font-weight:900;color:#d9ecff}
.diap .dq small{display:block;font-size:8px;color:#8fdcff;font-weight:800}
.diap .dp{margin-left:auto;font-size:10px;font-weight:900;color:#ffd98a}
.diap .db{position:absolute;top:0;right:0;font-size:7px;font-weight:900;background:#ff5a6e;color:#fff;padding:1px 4px;
  border-bottom-left-radius:5px}

/* modal */
.modal-back{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(3,5,10,.80);opacity:0;transition:opacity .2s
}
.modal-back.show{opacity:1}
.modal{
  width:min(92vw,560px);max-height:88dvh;overflow-y:auto;border-radius:14px;padding:14px;
  background:linear-gradient(180deg,#161d2f,#0b0f1b);border:1px solid #3a4a6e;
  box-shadow:0 30px 80px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08);
  transform:translateY(10px) scale(.97);transition:transform .22s
}
.modal-back.show .modal{transform:none}
.m-title{font-family:"Black Han Sans",sans-serif;font-size:17px;color:#fff;text-align:center;letter-spacing:.01em}
.m-sub{font-size:10.5px;color:#9fadc8;text-align:center;margin-top:3px;line-height:1.5}
.m-btns{display:flex;gap:7px;margin-top:12px}
.m-btns button{
  flex:1;border-radius:9px;border:1px solid #39466a;background:#1a2236;color:#d5e0f4;
  font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:800;padding:10px 0;cursor:pointer
}
.m-btns button.primary{
  border-color:#ffe0a0;background:linear-gradient(180deg,#ffdf9a,#e3ac3f);color:#4a3103;
  box-shadow:0 3px 0 #8f671c,inset 0 1px 0 rgba(255,255,255,.6)
}
.m-btns button:active{transform:translateY(1px)}
.gacha-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.gacha-grid.one{grid-template-columns:1fr;max-width:180px;margin-inline:auto}
.res-card{
  border:1px solid #2c3750;border-radius:9px;background:linear-gradient(180deg,#141b2c,#0c1120);
  padding:7px 3px;text-align:center;position:relative;opacity:0;animation:resIn .34s ease-out forwards;overflow:hidden
}
@keyframes resIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.res-card .rc-ico{font-size:21px;line-height:1.25}
.res-card .rc-name{font-size:8.5px;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-card .rc-g{font-size:7px;font-weight:800;opacity:.85}
.res-card .rc-tag{margin-top:4px;font-size:7.5px;font-weight:900;border-radius:3px;padding:1px 0;background:rgba(255,255,255,.08);color:#dfe8f8}
.res-card .rc-tag.new{background:#2a5a3a;color:#a8ffcf}
.res-card .rc-tag.up{background:#2a3f6a;color:#b6d6ff}
.res-card .rc-tag.gone{background:#3a2a2a;color:#ffc9c9}
.res-card.res-legend{box-shadow:0 0 22px rgba(255,180,60,.4),inset 0 0 20px rgba(255,180,60,.12)}
.res-card.res-myth{box-shadow:0 0 26px rgba(255,80,100,.5),inset 0 0 22px rgba(255,80,100,.16);animation:resIn .34s ease-out forwards,mythGlow 1.1s infinite .4s}
@keyframes mythGlow{0%,100%{box-shadow:0 0 22px rgba(255,80,100,.4)}50%{box-shadow:0 0 36px rgba(255,120,140,.8)}}
.res-card .rc-rainbow{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.22),transparent 40%);
  animation:spin 2.4s linear infinite;pointer-events:none}
.offline-hero{text-align:center;padding:6px 0 2px}
.offline-hero .oh-ico{font-size:40px;filter:drop-shadow(0 6px 16px rgba(120,160,255,.5))}
.offline-hero .oh-t{font-size:12.5px;font-weight:800;color:#dbe6fa;margin-top:6px;line-height:1.5}
.offline-hero .oh-gold{font-family:"Black Han Sans",sans-serif;font-size:26px;color:#ffd98a;margin-top:8px;text-shadow:0 0 20px rgba(255,190,80,.4)}
.offline-hero .oh-sub{font-size:10px;color:#93a1c0;margin-top:4px}
.paybox{text-align:center;padding:10px 0}
.paybox .spin{width:44px;height:44px;margin:6px auto 12px;border-radius:50%;
  border:3px solid #2b3752;border-top-color:#ffd98a;animation:spin .8s linear infinite}
.paybox .pt{font-size:12px;font-weight:800;color:#dfe8f8}
.paybox .ps{font-size:10px;color:#8fa0bd;margin-top:4px}
.help-list{margin:8px 0 0;padding:0;list-style:none}
.help-list li{font-size:10.5px;color:#b9c6de;line-height:1.6;display:flex;gap:6px;margin-bottom:5px}
.help-list li b{color:#ffd98a;flex:0 0 auto}

/* result rows (dungeon) */
.rewline{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#cfdaf0;
  padding:6px 8px;border-radius:7px;background:#0f1524;border:1px solid #222c44;margin-top:5px}
.rewline b{font-family:"Black Han Sans",sans-serif;color:#ffd98a;font-size:13px}
.dgn-timer{position:absolute;left:50%;top:calc(88px + env(safe-area-inset-top));transform:translateX(-50%);z-index:8;
  display:none;align-items:center;gap:6px;background:rgba(10,14,24,.86);border:1px solid #3d4a6c;border-radius:20px;
  padding:4px 12px;font-size:11px;font-weight:900;color:#ffe6a8}
.dgn-timer.on{display:flex}
.dgn-timer b{font-family:"Black Han Sans",sans-serif;font-size:14px;color:#fff}

/* 성벽 카드 */
.wallcard{background:linear-gradient(160deg,#1b2334,#0d1220);border-color:#3a4a66}
.wallcard .wc-top{display:flex;align-items:center;gap:7px}
.wallcard .wc-ico{width:32px;height:32px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;font-size:16px;
  background:linear-gradient(160deg,#2c3a52,#161e2c);border:1px solid #46587a}
.wallcard .wc-main{flex:1 1 auto;min-width:0}
.wallcard .wc-t{font-size:11.5px;font-weight:900;color:#e6edfa}
.wallcard .wc-s{font-size:9px;color:#8b9ab8;line-height:1.35;margin-top:1px}
.wallcard .wc-val{font-family:"Black Han Sans",sans-serif;font-size:15px;color:#8fe6b0;white-space:nowrap}
.wallcard .wc-bar{height:7px;border-radius:4px;background:#101724;border:1px solid #24304a;overflow:hidden;margin-top:7px}
.wallcard .wc-bar > i{display:block;height:100%;background:linear-gradient(90deg,#3fb277,#8fe6b0);transition:width .25s}

/* ================= responsive ================= */
@media (max-aspect-ratio: 16/10){
  .side-col{flex-basis:clamp(300px,42%,520px);width:42%;min-width:300px}
}
@media (max-aspect-ratio: 13/10){
  .side-col{position:absolute;right:0;top:0;bottom:0;width:min(58%,420px);min-width:0;
    transform:translateX(100%);transition:transform .26s;box-shadow:-10px 0 30px rgba(0,0,0,.6)}
  .side-col.open{transform:none}
  .side-open{display:grid !important}
}
.side-open{display:none;position:absolute;right:10px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:11;
  width:40px;height:40px;border-radius:11px;border:1px solid #4a5878;background:linear-gradient(180deg,#243052,#161d2f);
  color:#ffe0a0;font-size:17px;place-items:center;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.5)}
@media (max-height: 470px){
  .hud{padding-top:calc(5px + env(safe-area-inset-top))}
  .crest{width:30px;height:30px;font-size:16px;border-radius:9px}
  .hud-title{font-size:12px}
  .hud-sub{font-size:9px}
  .cur{padding:3px 7px 3px 6px;font-size:10px;min-width:0}
  .ico-btn{width:26px;height:26px;font-size:11px}
  .mission{padding:5px 6px;bottom:calc(5px + env(safe-area-inset-bottom));border-radius:10px}
  .mission .mico{width:25px;height:25px;font-size:12px}
  .mission .mtext{font-size:10px}
  .mission .mbtn{padding:6px 9px;font-size:9.5px}
  .mission .mrew{font-size:8.5px}
  .wallhud{top:calc(38px + env(safe-area-inset-top));width:min(56%,300px)}
  .wh-bar{height:9px}
  .wh-top{font-size:8.5px}
  .wh-tip{display:none}
  .boss-wrap{top:calc(70px + env(safe-area-inset-top))}
  .dgn-timer{top:calc(70px + env(safe-area-inset-top))}
  .party{display:none}
  .pcard{width:39px;padding:2px}
  .pcard .pav{width:19px;height:19px}
  .pcard .pnm{font-size:7px}
  .side-head{padding:calc(6px + env(safe-area-inset-top)) 9px 5px}
  .sh-chip{font-size:8.5px;padding:2px 4px}
  .tab{font-size:10.5px;padding:6px 0 5px}
  .panel{padding:7px 7px 20px}
  .toast{bottom:calc(54px + env(safe-area-inset-bottom));font-size:10.5px}
  .combo b{font-size:26px}
  .card{padding:7px}
  .stat .si{width:30px;height:30px;font-size:14px}
  .gacha-grid{grid-template-columns:repeat(6,1fr);gap:4px}
}
@media (max-width: 720px){
  .tag-live{display:none}
  .hud-title{font-size:11.5px}
  .crest{width:28px;height:28px;font-size:15px;border-radius:8px}
  .cur{font-size:10px;padding:3px 6px 3px 5px}
  .mission .mtag{display:none}
}
@media (max-width: 620px){
  .hud-sub{display:none}
  .combo b{font-size:26px}
  .mission .mtext{font-size:10.5px}
}
</style>

<body>
<div id="app">
  <div class="battle-col">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="hud-id">
        <div class="crest">🛡️</div>
        <div>
          <div class="hud-title">아르카디아 기사단 <span class="tag-live">LIVE</span></div>
          <div class="hud-sub"><b id="stageTxt">1</b> 스테이지 · <span id="stageName">달빛 초원</span> · <span id="killTxt">적 0마리</span></div>
        </div>
      </div>
      <div class="hud-right">
        <div class="cur"><span class="coin"></span><span id="goldTxt">0</span></div>
        <div class="cur"><span class="gem"></span><span id="diaTxt">0</span></div>
        <button class="ico-btn" id="speedBtn" title="배속">x1</button>
        <button class="ico-btn on" id="muteBtn" title="소리">🔊</button>
        <button class="ico-btn" id="helpBtn" title="도움말">?</button>
      </div>
    </div>

    <div class="wallhud" id="wallHud">
      <div class="wh-top">
        <span class="wh-ico">🏰</span>
        <span class="wh-lbl">성벽 내구도</span>
        <span class="wh-val" id="wallTxt">620 / 620</span>
        <span class="wh-wave" id="waveTxt">WAVE 1/3</span>
      </div>
      <div class="wh-bar"><i id="wallFill"></i></div>
      <div class="wh-tip">전열 붕괴 시 해당 스테이지 재도전</div>
    </div>
    <div class="danger" id="danger"></div>

    <div class="combo" id="combo"><b>0</b><i>COMBO</i></div>

const Audio2 = (() => {

    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    const f = ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp || 1200;

        case 'crit': noise(0.16, 0.6, 700); tone(320, 0.16, 'sawtooth', 0.14, 120); tone(900, 0.1, 'square', 0.08, 400, 0.02); break;

        case 'fire': noise(0.22, 0.4, 500); tone(140, 0.2, 'sawtooth', 0.12, 60); break;

        case 'coin': tone(1180, 0.08, 'square', 0.06); tone(1560, 0.1, 'square', 0.05, null, 0.06); break;
        case 'levelup': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'triangle', 0.1, null, i * 0.075)); break;
        case 'skill': tone(220, 0.3, 'sawtooth', 0.12, 660); noise(0.3, 0.35, 400); break;
        case 'gacha': [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'triangle', 0.08, null, i * 0.055)); break;
        case 'legend': [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.5, 'sine', 0.11, null, i * 0.09)); noise(0.5, 0.3, 3000, 0.1); break;
        case 'boss': tone(98, 0.9, 'sawtooth', 0.16, 60); tone(147, 0.9, 'square', 0.08, 90, 0.05); noise(0.6, 0.3, 200); break;
        case 'clear': [659, 784, 1046].forEach((f, i) => tone(f, 0.28, 'triangle', 0.1, null, i * 0.08)); break;

/* ============================================================

/* ---------- layout ---------- */
function resize() {

  WALL.x = clamp(W * 0.235, 64, 225);

/* 성벽 위 대형: 앞줄(기사·궁수) / 뒷줄(마법사·성직자) */
const FORMATION = [
  { fx: 0.74, fy: 1.00, s: 1.00 },
  { fx: 0.32, fy: 1.02, s: 0.97 },
  { fx: 0.78, fy: 0.66, s: 0.90 },

function layoutParty() {
  party.forEach((p, i) => {
    const f = FORMATION[i];
    p.x = WALL.x * f.fx;

    p.hh = heroH * 0.84 * f.s;

}
function buildCracks() {
  WALL.cracks = [];
  for (let i = 0; i < 3; i++) {
    const pts = [];
    let x = WALL.x * (0.30 + 0.20 * i);
    let y = WALL.top + WALL.h * (0.24 + i * 0.20);
    pts.push([x, y]);
    for (let s = 0; s < 6; s++) {
      x += rnd(-WALL.x * 0.15, WALL.x * 0.18);
      y += WALL.h * 0.09 + rnd(-8, 12);

const enemyH = e => e.isDgn ? heroH * 0.92 : heroH * (e.boss ? 1.45 : 1.0) * e.scale;

/* ---------- fx helpers ---------- */
function addNum(x, y, val, kind) {

function addFx(o) { B.fx.push(Object.assign({ life: 0.4, max: 0.4, t: 0 }, o)); }
function spark(x, y, n, color, spd, grav) {

/* ---------- enemy queries ---------- */
const aliveEnemies = () => B.enemies.filter(e => e.dying <= 0 && e.hp > 0);
function frontEnemies(n) {
  return aliveEnemies().sort((a, b) => a.x - b.x).slice(0, n);
}

  const list = aliveEnemies();
  if (!list.length) return null;
  let best = list[0], bestN = -1;
  for (const a of list) {
    let n = 0;
    for (const b of list) if (Math.hypot(a.x - b.x, a.y - b.y) < radius) n++;
    if (n > bestN) { bestN = n; best = a; }

/* ---------- enemies ---------- */
function makeEnemy(opt) {

  const depth = opt.depth === undefined ? Math.random() : opt.depth;

function spawnOne(desc) {

/* ---------- stage / wave director ---------- */
function startStage(st, heal) {
  B.mode = 'stage';
  B.dgn = null;
  B.enemies.length = 0;
  B.projs.length = 0;
  B.pending.length = 0;
  B.boss = null;
  B.breakT = 0;

  $('#dgnTimer').classList.remove('on');
  party.forEach(p => {
    p.down = 0; p.hurt = 0; p.anim = 0;
    p.hp = heal ? p.maxHp : Math.max(p.maxHp * 0.55, p.hp);
    p.atkT = rnd(0.2, 0.8);
  });
  const plan = wavePlan(st);
  B.wave = { idx: -1, total: plan.length, plan, spawnQ: [], state: 'intro', timer: 1.1, spawned: 0, killed: 0, totalCount: 0 };

}
function beginWave(i) {
  const w = B.wave, plan = w.plan[i];

  w.idx = i; w.state = 'spawn'; w.spawned = 0; w.killed = 0;
  const iv = clamp(0.30 - state.stage * 0.004, 0.14, 0.30);
  const q = [];
  if (plan.boss) {
    q.push({ t: 0.1, boss: true });
    for (let k = 0; k < plan.count; k++) q.push({ t: 1.2 + k * iv * 1.5 });
  } else {
    for (let k = 0; k < plan.count; k++) q.push({ t: k * iv });
  }

    w.timer -= dt;
    if (w.timer <= 0) beginWave(0);
    return;
  }
  if (w.state === 'spawn') {
    for (let i = w.spawnQ.length - 1; i >= 0; i--) {
      w.spawnQ[i].t -= dt;
      if (w.spawnQ[i].t <= 0) { spawnOne(w.spawnQ[i]); w.spawnQ.splice(i, 1); }
    }
    if (!w.spawnQ.length) w.state = 'fight';
  }
  if (w.state === 'rest') {
    w.timer -= dt;
    if (w.timer <= 0) {

    const tgt = near[0];
    addFx({
      type: 'slash', x: tgt.x - 14, y: tgt.y - enemyH(tgt) * 0.55,
      a: -0.55, len: 78, life: 0.24, max: 0.24, color: '#d6e9ff', w: 9
    });
    near.forEach((e, i) => at(i * 0.08, () => {
      hitEnemy(e, st.atk * p.mult * rnd(0.92, 1.1) * (i ? 0.55 : 1) * crit, {
        crit: i === 0 && critOK, sfx: 'hit', color: '#d6e9ff', height: 0
      });
    }));
    B.hitStop = Math.max(B.hitStop, 0.018);
  } else if (p.key === 'archer') {
    const targets = frontEnemies(3);
    if (!targets.length) { p.anim = 0; return; }
    targets.forEach((e, i) => at(i * 0.055, () => fireProjectile('arrow', p, st.atk * p.mult * rnd(0.92, 1.1) * crit, { target: e, crit: i === 0 && critOK })));
  } else if (p.key === 'mage') {
    const tgt = frontEnemies(1)[0];
    if (!tgt) { p.anim = 0; return; }
    fireProjectile('fire', p, st.atk * p.mult * rnd(0.92, 1.1) * crit, { target: tgt, crit: critOK, splash: 105, splashDmg: 0.52 });
  } else {
    const targets = frontEnemies(2);
    if (!targets.length) { p.anim = 0; return; }
    targets.forEach((e, i) => at(i * 0.07, () => fireProjectile('holy', p, st.atk * p.mult * rnd(0.92, 1.1) * crit, { target: e, crit: i === 0 && critOK })));
  }
}
function fireProjectile(type, p, dmg, opt) {
  opt = opt || {};
  const e = opt.target;
  if (!e || e.dying > 0) return;
  const sx = p.x + p.hh * 0.22, sy = p.y - p.hh * 0.58;
  const tx = e.x, ty = e.y - enemyH(e) * 0.55;
  const spd = type === 'arrow' ? 1450 : type === 'holy' ? 880 : 600;
  B.projs.push({
    type, sx, sy, tx, ty, x: sx, y: sy, dmg, crit: !!opt.crit, target: e,
    splash: opt.splash || 0, splashDmg: opt.splashDmg || 0.5,
    t: 0, dur: Math.max(0.1, Math.hypot(tx - sx, ty - sy) / spd),
    color: type === 'arrow' ? '#b6ff9e' : type === 'holy' ? '#ffe6a0' : '#ff9a4d'
  });
  sfx(type === 'arrow' ? 'arrow' : type === 'holy' ? 'holy' : 'fire', 0.05);
}
function projectileArrive(pr) {
  const e = pr.target;
  if (pr.splash) {
    const cx = e && e.dying <= 0 ? e.x : pr.tx;
    const cy = e && e.dying <= 0 ? e.y : pr.ty;
    addFx({ type: 'ring', x: cx, y: cy - 20, r0: 8, r1: pr.splash, life: 0.36, max: 0.36, color: '255,140,60' });
    spark(cx, cy - 30, 16, '#ffb066', 300);
    const list = aliveEnemies().filter(q => Math.hypot(q.x - cx, q.y - cy) < pr.splash);
    list.forEach((q, i) => at(i * 0.02, () => hitEnemy(q, pr.dmg * pr.splashDmg, { crit: i === 0 && pr.crit, sfx: 'fire', color: '#ff9a4d', small: i > 0 })));
    B.shake = Math.max(B.shake, 2.4);
    return;
  }
  if (!e || e.dying > 0) return;
  addFx({
    type: 'spark', x: e.x, y: e.y - enemyH(e) * 0.5, life: 0.16, max: 0.16,
    color: pr.type === 'holy' ? '255,230,160' : '180,255,150'
  });
  hitEnemy(e, pr.dmg, {
    crit: pr.crit, sfx: pr.type === 'holy' ? 'holy' : 'arrow',
    color: pr.type === 'holy' ? '#ffe6a0' : '#c8ffa8'
  });
}

function shieldBash(big) {

  list.forEach((e, i) => {
    e.kb = push * rnd(0.85, 1.1);
    e.kbT = 0;
    e.state = 'walk';
    at(i * 0.012, () => hitEnemy(e, st.atk * (big ? 1.55 : 0.55) * rnd(0.9, 1.1), {
      crit: Math.random() * 100 < st.crit * 0.5, sfx: 'hit', color: '#cfe4ff', small: !big ? list.length > 4 : false
    }));
  });

      })));

}
function fireBurst(big) {

function healPulse(big) {

      addFx({ type: 'ring', x: WALL.x, y: WALL.top + WALL.h * 0.4, r0: 10, r1: 330, life: 0.7, max: 0.7, color: '255,235,170' });

/* ---------- dungeons ---------- */
function startDungeon(type) {
  if (B.mode === 'dungeon') return;
  const d = state.dgn[type];
  if (d <= 0) { toast('오늘 입장 횟수를 모두 사용했습니다'); return; }
  state.dgn[type]--;
  B.mode = 'dungeon';
  B.dgn = { type, left: DUNGEONS[type].time, gold: 0, dia: 0, kills: 0, spawnT: 0.4, boss: null };
  B.enemies.length = 0;
  B.projs.length = 0;
  B.pending.length = 0;
  B.boss = null;
  B.breakT = 0;
  B.wave.state = 'idle';
  $('#dgnTimer').classList.add('on');
  $('#bossWrap').classList.remove('on');
  party.forEach(p => { p.hp = p.maxHp; p.down = 0; p.hurt = 0; p.atkT = rnd(0.2, 0.9); });
  WALL.hp = Math.max(WALL.hp, WALL.max * 0.6);
  if (type === 'promote') {
    const st = heroStats();
    const e = makeEnemy({
      spr: 'mob_darkknight', boss: true, name: '시련의 기사',
      hp: Math.max(700, st.dps * 15), atk: enemyAtk(state.stage) * 1.2, isDgn: true, depth: 0.5, x: W * 0.78
    });
    e.stopX = WALL.x + enemyH(e) * 0.30;
    B.enemies.push(e);
    B.boss = e; B.dgn.boss = e;
    $('#bossName').textContent = '시련의 기사';
    $('#bossWrap').classList.add('on');
    Audio2.play('boss');
  }
  cutin({
    who: 'DUNGEON', name: DUNGEONS[type].name, ico: DUNGEONS[type].icon,
    c1: 'rgba(10,16,30,.92)',
    c2: type === 'gold' ? 'rgba(200,150,40,.9)' : type === 'dia' ? 'rgba(60,150,220,.9)' : 'rgba(180,60,60,.9)'
  });
  toast(DUNGEONS[type].name + ' 입장!');
  updateHud(); save(); renderTab();
}
function spawnDgnEnemy() {
  const t = B.dgn.type;
  const st = state.stage;
  let e;
  if (t === 'gold') {
    e = makeEnemy({
      spr: 'mob_slime', isDgn: true, name: '황금 슬라임',

    });

      spr: 'mob_slime', isDgn: true, name: '수정 골렘',

    });

}
function dgnKill(e) {
  if (!B.dgn) return;
  B.dgn.kills++;
  if (e.gold) {
    B.dgn.gold += e.gold; state.gold += e.gold; state.stats.gold += e.gold;
    addNum(e.x, e.y - 60, e.gold, 'gold');

function endDungeon(success) {
  if (!B.dgn) return;
  const d = B.dgn;
  B.mode = 'stage';
  B.dgn = null;
  B.enemies.length = 0;
  B.projs.length = 0;
  B.boss = null;
  WALL.hp = WALL.max;
  $('#dgnTimer').classList.remove('on');
  $('#bossWrap').classList.remove('on');
  if (d.type === 'gold' && success) state.stats.dungeonGold = (state.stats.dungeonGold || 0) + 1;
  if (d.type === 'promote' && success) {
    if (state.rank < RANKS.length - 1) {
      state.rank++;
      Audio2.play('legend');
      toast('🏅 승급 성공! ' + josa(RANKS[state.rank], '이', '가') + ' 되었습니다');
    } else {
      toast('이미 최고 계급입니다');
    }
  }
  const rows = [];
  if (d.gold) rows.push(['🪙 획득 골드', '+' + fmtFull(d.gold) + ' G']);
  if (d.dia) rows.push(['💎 획득 다이아', '+' + fmtFull(d.dia)]);
  if (d.type === 'promote') rows.push([success ? '🏅 승급 성공' : '⏱ 시간 초과', success ? RANKS[state.rank] : '다시 도전하세요']);
  if (d.type === 'gold' || d.type === 'dia') rows.push(['💀 처치 수', d.kills + '마리']);
  openModal({
    title: success ? '던전 클리어!' : '던전 종료',
    sub: DUNGEONS[d.type].name + (success ? ' · 보상을 획득했습니다' : ' · 제한 시간이 끝났습니다'),
    body: rows.map(r => '<div class="rewline"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join(''),
    buttons: [{ label: '확인', primary: true }]
  });
  Audio2.play(success ? 'clear' : 'fail');
  startStage(state.stage, false);
  updateHud(); save(); renderTab();
}

/* ============================================================
   UPDATE
   ============================================================ */
function updateBattle(dt) {
  B.t += dt;
  for (let i = B.pending.length - 1; i >= 0; i--) {
    B.pending[i].t -= dt;
    if (B.pending[i].t <= 0) {
      const fn = B.pending[i].fn;
      B.pending.splice(i, 1);
      try { fn(); } catch (err) { console.warn(err); }
    }
  }
  if (B.hitStop > 0) { B.hitStop -= dt; dt *= 0.18; }
  B.shake *= Math.pow(0.0025, dt);
  if (B.shake < 0.2) B.shake = 0;
  B.sx = rnd(-1, 1) * B.shake;
  B.sy = rnd(-1, 1) * B.shake;
  B.stageFlash = Math.max(0, B.stageFlash - dt * 1.6);
  if (B.bgKick > 0) B.bgKick = Math.max(0, B.bgKick - dt * 1.3);
  B.comboT -= dt;
  if (B.comboT <= 0) B.combo = 0;
  WALL.glow = Math.max(0, WALL.glow - dt * 2.4);
  WALL.shake = Math.max(0, WALL.shake - dt * 26);
  WALL.torch += dt;

  if (B.breakT > 0) {
    B.breakT -= dt;
    if (B.breakT <= 0) retryStage();
  }

  if (B.mode === 'dungeon' && B.dgn) {
    B.dgn.left -= dt;
    const el = $('#dgnTime');
    if (el) el.textContent = Math.max(0, Math.ceil(B.dgn.left));
    if (B.dgn.type !== 'promote') {
      B.dgn.spawnT -= dt;
      if (B.dgn.spawnT <= 0 && aliveEnemies().length < 12) {
        B.dgn.spawnT = B.dgn.type === 'gold' ? 0.85 : 1.0;
        spawnDgnEnemy();
      }
    }
    if (B.dgn.left <= 0) endDungeon(true);
  }

  updateWave(dt);
  updateEnemies(dt);
  updateParty(dt);

  // 성직자 패시브: 파티 + 성벽 회복
  B.healT += dt;
  if (B.healT >= 3.4) {
    B.healT = 0;
    const pr = party[3];
    if (pr && !pr.down) healPulse(false);
  }

  // projectiles
  for (let i = B.projs.length - 1; i >= 0; i--) {
    const pr = B.projs[i];
    pr.t += dt;
    if (pr.type === 'enemy') {
      const tg = pr.target;
      if (tg && tg.down <= 0) { pr.tx = tg.x; pr.ty = tg.y - tg.hh * 0.55; }
      const k = Math.min(1, pr.t / pr.dur);
      pr.x = lerp(pr.sx, pr.tx, k);
      pr.y = lerp(pr.sy, pr.ty, k) - Math.sin(k * Math.PI) * 70;
      if (k >= 1) {
        B.projs.splice(i, 1);
        if (tg && tg.down <= 0) {
          tg.hp -= pr.dmg;
          tg.hurt = 0.35;
          addNum(tg.x, tg.y - tg.hh * 0.95, pr.dmg, 'hit');
          spark(tg.x, tg.y - tg.hh * 0.5, 7, '#ff9a9a', 220);
          B.shake = Math.max(B.shake, 3);
          sfx('hit', 0.1);
          if (tg.hp <= 0) {
            tg.hp = 0; tg.down = 5;
            toast(tg.name + ' 쓰러짐! 5초 후 부활합니다');
          }
        }
        continue;
      }
      continue;
    }
    const e2 = pr.target;
    if (e2 && e2.dying <= 0) { pr.tx = e2.x; pr.ty = e2.y - enemyH(e2) * 0.55; }
    const k = Math.min(1, pr.t / pr.dur);
    pr.x = lerp(pr.sx, pr.tx, k);
    pr.y = lerp(pr.sy, pr.ty, k) - Math.sin(k * Math.PI) * (pr.type === 'arrow' ? 22 : 14);
    if (k >= 1) { projectileArrive(pr); B.projs.splice(i, 1); }
  }

  for (let i = B.fx.length - 1; i >= 0; i--) {
    const f = B.fx[i]; f.t += dt; f.life -= dt;
    if (f.life <= 0) B.fx.splice(i, 1);
  }
  for (let i = B.parts.length - 1; i >= 0; i--) {
    const q = B.parts[i];
    q.life -= dt;
    q.vy += (q.grav || 620) * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.life <= 0) B.parts.splice(i, 1);
  }
  for (let i = B.hits.length - 1; i >= 0; i--) {
    const h = B.hits[i];
    h.life -= dt;
    h.x += h.vx * dt; h.y += h.vy * dt; h.vy += 250 * dt;
    if (h.life <= 0) B.hits.splice(i, 1);
  }

  if (!B.enemies.length) {
    party.forEach(p => {
      if (!p.down && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.03 * dt);
    });
  }

  if (party.every(p => p.down > 0) && B.wipeT <= 0) {
    B.wipeT = 3.2;
    toast('파티 전멸! 3초 후 재정비합니다');
    Audio2.play('fail');
  }
  if (B.wipeT > 0) {
    B.wipeT -= dt;
    if (B.wipeT <= 0) {
      party.forEach(p => { p.down = 0; p.hp = p.maxHp * 0.7; p.healGlow = 0.6; });
      addFx({ type: 'ring', x: WALL.x * 0.6, y: WALL.top, r0: 10, r1: 200, life: 0.8, max: 0.8, color: '255,255,255' });
    }
  }
}

function updateEnemies(dt) {
  const list = B.enemies;
  for (let i = list.length - 1; i >= 0; i--) {
    const e = list[i];
    e.t += dt;
    if (e.spawnIn > 0) e.spawnIn -= dt;
    e.hurt = Math.max(0, e.hurt - dt);
    e.anim = Math.max(0, e.anim - dt * 3.4);
    if (e.dying > 0) {
      e.dying -= dt;
      if (e.dying <= 0) list.splice(i, 1);
      continue;
    }
    e.stopX = WALL.x + enemyH(e) * 0.30 + e.depth * 12;
    if (e.kb > 0) {
      e.kbT += dt;
      e.x += e.kb * dt;
      e.kb -= 1150 * dt;
      if (e.kb <= 0) { e.kb = 0; e.kbT = 0; }
      if (e.x > W + 300) { e.x = W + 300; e.kb = 0; e.kbT = 0; }
    } else if (e.state === 'walk') {
      e.x -= e.spd * dt * (e.spawnIn > 0 ? 0.35 : 1);
      if (e.x <= e.stopX) { e.x = e.stopX; e.state = 'attack'; e.atkT = rnd(0.35, 1.2); }
    } else if (e.state === 'attack') {
      e.atkT -= dt;
      if (e.atkT <= 0) {
        e.atkT = rnd(1.5, 2.2) * (e.boss ? 1.35 : 1);
        e.anim = 1;
        enemyHitWall(e);
      }
    }
    if (e.thrower && B.breakT <= 0) {
      e.throwT -= dt;
      if (e.throwT <= 0) {
        e.throwT = rnd(4.5, 8.5);
        throwAtParty(e);
      }
    }
  }
}

function updateParty(dt) {
  party.forEach(p => {
    p.anim = Math.max(0, p.anim - dt / (p.animDur || 0.34));
    p.hurt = Math.max(0, p.hurt - dt);
    p.healGlow = Math.max(0, p.healGlow - dt);
    if (p.down > 0) {
      p.down -= dt;
      if (p.down <= 0) {
        p.down = 0;
        p.hp = p.maxHp * 0.5;
        p.healGlow = 0.9;
        addNum(p.x, p.y - p.hh * 0.9, Math.round(p.maxHp * 0.5), 'heal');
      }
      return;
    }
    const foes = aliveEnemies();
    if (!foes.length || B.breakT > 0) return;
    const nearWall = foes.some(f => f.x < WALL.x + 210);
    p.atkT -= dt;
    if (p.atkT <= 0) {
      p.atkT = p.cd * rnd(0.92, 1.08) * (p.key === 'knight' && !nearWall ? 1.9 : 1);
      partyAttack(p);
    }
    p.skillT -= dt;
    if (p.skillT <= 0) {
      p.skillT = rnd(6.0, 8.5);
      if (p.key === 'priest') p.skillT = rnd(4.5, 6.0);
      castSignature(p);
    }
    p.ultT -= dt;
    if (p.ultT <= 0 && B.t - B.lastUlt > 5.5) {
      p.ultT = rnd(12, 16);
      B.lastUlt = B.t;
      castUltimate(p);
    }
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function drawActor(key, x, yb, h, o) {
  const img = IMG[key];
  o = o || {};
  const w = img ? (img.width / img.height) * h : h * 0.62;
  ctx.save();
  ctx.translate(x, yb);
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale(o.sx === undefined ? 1 : o.sx, o.sy === undefined ? 1 : o.sy);
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  if (o.tint === 'gold') ctx.filter = 'sepia(1) saturate(3.4) hue-rotate(-12deg) brightness(1.12)';
  else if (o.tint === 'crystal') ctx.filter = 'hue-rotate(150deg) saturate(1.7) brightness(1.15)';
  else if (o.gray) ctx.filter = 'grayscale(.85) brightness(.78)';
  if (!img) {
    ctx.fillStyle = o.fallback || '#5a6b93';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(-w / 2, -h, w, h, 10) : ctx.rect(-w / 2, -h, w, h);
    ctx.fill();
  } else {
    ctx.drawImage(img, -w / 2, -h, w, h);
    if (o.flash) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.filter = 'none';
      ctx.globalAlpha = (o.alpha === undefined ? 1 : o.alpha) * 0.6;
      ctx.drawImage(img, -w / 2, -h, w, h);
    }
  }
  ctx.restore();
}
function drawShadow(x, y, w, a) {
  if (w <= 0.5) return;
  ctx.save();
  const g = ctx.createRadialGradient(x, y, 2, x, y, w);
  g.addColorStop(0, 'rgba(0,0,0,' + (a || 0.5) + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(x, y, w, w * 0.30, 0, 0, 6.283);
  ctx.fill();
  ctx.restore();
}

const hash2 = (a, b) => {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
};

function drawWall() {
  const x1 = WALL.x, top = WALL.top, bot = groundY + 34;
  const dmg = 1 - clamp(WALL.hp / WALL.max, 0, 1);
  const shx = WALL.shake > 0 ? rnd(-1, 1) * WALL.shake * 0.5 : 0;
  ctx.save();
  ctx.translate(shx, 0);

  // ---- 성벽 본체 ----
  const g = ctx.createLinearGradient(0, WALL.backTop, 0, bot);
  g.addColorStop(0, '#55637d');
  g.addColorStop(0.30, '#3b465d');
  g.addColorStop(0.72, '#242c3d');
  g.addColorStop(1, '#12171f');
  ctx.fillStyle = g;
  ctx.fillRect(-12, WALL.backTop, x1 + 12, bot - WALL.backTop);

  // ---- 돌 블록 ----
  const bh = Math.max(13, WALL.h * 0.105);
  const bw = Math.max(22, x1 * 0.30);
  ctx.save();
  for (let r = 0; r * bh < bot - WALL.top; r++) {
    const off = (r % 2) ? -bw * 0.5 : 0;
    for (let c = -1; c * bw + off < x1 + 12; c++) {
      const bx = -12 + c * bw + off;
      const by = WALL.top + r * bh;
      if (by > bot) break;
      const h1 = hash2(r, c);
      const h2v = hash2(c, r + 7);
      ctx.fillStyle = 'rgba(' + ((58 + h1 * 46) | 0) + ',' + ((70 + h1 * 46) | 0) + ',' + ((94 + h1 * 52) | 0) + ',0.92)';
      ctx.fillRect(bx + 1.2, by + 1.2, bw - 2.4, bh - 2.4);
      ctx.fillStyle = 'rgba(190,214,246,' + (0.03 + h2v * 0.06) + ')';
      ctx.fillRect(bx + 1.2, by + 1.2, bw - 2.4, 1.5);
      if (h2v > 0.86) {
        ctx.fillStyle = 'rgba(20,26,38,.5)';
        ctx.fillRect(bx + 3, by + bh * 0.5, bw * 0.4, 1.2);
      }
    }
  }
  ctx.restore();

  // ---- 성벽 위 통로(뒷면) ----
  const walk = ctx.createLinearGradient(0, WALL.backTop, 0, WALL.top);
  walk.addColorStop(0, 'rgba(96,112,140,.95)');
  walk.addColorStop(1, 'rgba(72,86,110,.98)');
  ctx.fillStyle = walk;
  ctx.fillRect(-12, WALL.backTop, x1 + 12, WALL.top - WALL.backTop + 1);

  // ---- 앞쪽 흉벽(크레넬) ----
  const mw = clamp(x1 * 0.17, 12, 26), gap = mw * 0.82;
  for (let mx = -8; mx < x1; mx += mw + gap) {
    ctx.fillStyle = '#4a5772';
    ctx.fillRect(mx, top - mw * 0.62, mw, mw * 0.66);
    ctx.fillStyle = 'rgba(180,205,240,.16)';
    ctx.fillRect(mx, top - mw * 0.62, mw, 2);
  }
  ctx.fillStyle = 'rgba(150,180,220,.20)';
  ctx.fillRect(-12, top - 2, x1 + 12, 2.4);

  // ---- 성문 ----
  const gw = Math.min(x1 * 0.52, 74), gh = WALL.h * 0.42;
  const gx = x1 * 0.24, gy = bot - gh;
  ctx.save();
  ctx.fillStyle = 'rgba(8,11,18,.92)';
  ctx.beginPath();
  ctx.moveTo(gx, gy);
  ctx.lineTo(gx, gy + gh * 0.35);
  ctx.quadraticCurveTo(gx + gw / 2, gy - gh * 0.16, gx + gw, gy + gh * 0.35);
  ctx.lineTo(gx + gw, gy + gh);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,70,44,.85)';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(gx + (gw / 4) * i, gy + gh * 0.24);
    ctx.lineTo(gx + (gw / 4) * i, gy + gh);
    ctx.stroke();
  }
  ctx.restore();

  // ---- 횃불 ----
  const flick = 0.72 + 0.28 * Math.sin(WALL.torch * 9) * Math.sin(WALL.torch * 3.7);
  const fx2 = x1 * 0.80, fy2 = WALL.top + WALL.h * 0.42;
  const fg = ctx.createRadialGradient(fx2, fy2, 2, fx2, fy2, 46 * flick);
  fg.addColorStop(0, 'rgba(255,200,110,' + (0.5 * flick) + ')');
  fg.addColorStop(1, 'rgba(255,140,40,0)');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.arc(fx2, fy2, 46 * flick, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#ffd27a';
  ctx.beginPath(); ctx.ellipse(fx2, fy2, 3, 6 * flick, 0, 0, 6.283); ctx.fill();

  // ---- 깨진 금 ----
  const nCrack = Math.floor(clamp(dmg, 0, 1) * 3.99);
  ctx.save();
  ctx.strokeStyle = 'rgba(12,16,24,.85)';
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  for (let i = 0; i < nCrack && i < WALL.cracks.length; i++) {
    const pts = WALL.cracks[i];
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,90,90,.28)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(12,16,24,.85)';
    ctx.lineWidth = 1.8;
  }
  ctx.restore();

  // ---- 피격 붉은 경고 ----
  if (WALL.glow > 0.01) {
    const wg = ctx.createLinearGradient(0, WALL.top, 0, bot);
    wg.addColorStop(0, 'rgba(255,60,70,' + (0.30 * WALL.glow) + ')');
    wg.addColorStop(1, 'rgba(255,30,50,' + (0.12 * WALL.glow) + ')');
    ctx.fillStyle = wg;
    ctx.fillRect(-12, WALL.top, x1 + 12, bot - WALL.top);
    ctx.strokeStyle = 'rgba(255,120,120,' + (0.55 * WALL.glow) + ')';
    ctx.lineWidth = 2.4;
    ctx.strokeRect(-11, WALL.top, x1 + 10, bot - WALL.top);
  }

  // ---- 모서리 하이라이트 ----
  ctx.fillStyle = 'rgba(180,210,255,.10)';
  ctx.fillRect(x1 - 3, WALL.top, 3, bot - WALL.top);
  ctx.restore();
}
/* 성벽 앞 흉벽(캐릭터 발을 살짝 가림) */
function drawParapetFront() {
  const x1 = WALL.x, top = WALL.top;

  ctx.save();
  for (let mx = -8; mx < x1; mx += mw + gap) {

function drawBG() {
  const ch = Math.floor((state.stage - 1) / 10);
  const key = ch % 2 === 0 ? 'bg_forest' : 'bg_castle';
  const img = IMG[key];
  if (img) {
    const scale = Math.max(W / img.width, (H * 1.06) / img.height);
    const dw = img.width * scale, dh = img.height * scale;
    const over = Math.max(0, dw - W);
    const kick = B.bgKick > 0 ? -Math.pow(B.bgKick, 1.6) * W * 0.22 : 0;
    const x0 = clamp(-over * 0.5 + Math.sin(B.t * 0.07) * over * 0.36 + kick, -over, 0);
    const y0 = H - dh;
    ctx.drawImage(img, x0, y0, dw, dh);
    if (B.mode === 'dungeon') {
      ctx.fillStyle = B.dgn && B.dgn.type === 'gold' ? 'rgba(90,60,0,.34)'
        : B.dgn && B.dgn.type === 'dia' ? 'rgba(0,40,90,.34)' : 'rgba(80,0,0,.28)';
      ctx.fillRect(0, 0, W, H);
    }
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#101b33'); g.addColorStop(1, '#050810');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const amb = ch % 2 === 0 ? 'rgba(160,235,255,' : 'rgba(255,180,90,';
  for (let i = 0; i < 26; i++) {
    const sp = 10 + (i % 5) * 6;
    const x = ((i * 137 + B.t * sp) % (W + 60)) - 30;
    const y = H * 0.18 + ((i * 91 + Math.sin(B.t * 0.7 + i) * 30) % (H * 0.62));
    const a = 0.18 + 0.22 * (0.5 + 0.5 * Math.sin(B.t * 2 + i));
    ctx.fillStyle = amb + a + ')';
    ctx.beginPath();
    ctx.arc(x, y, ch % 2 === 0 ? 1.8 : 1.5, 0, 6.283);
    ctx.fill();
  }
}

/* ---------- 몬스터 떼 ---------- */
function drawEnemies() {
  const list = B.enemies.slice().sort((a, b) => (a.y - b.y) || (a.x - b.x));
  const t = B.t;
  list.forEach(e => {
    const h = enemyH(e);
    let hop = 0, tilt = 0, sx = 1, sy = 1, dx = 0, alpha = 1, rot = 0;

    if (e.dying > 0) {
      const k = clamp(e.dying / 0.55, 0, 1);
      alpha = k;
      rot = (1 - k) * 1.5;
      sy = 0.9 + (1 - k) * 0.1;
      hop = -6 * (1 - k);
    } else if (e.kb > 0) {
      const k = clamp(e.kbT / 0.55, 0, 1);
      hop = Math.sin(k * Math.PI) * h * 0.38;
      rot = -k * 1.25;
      sx = 1 + 0.06 * Math.sin(k * Math.PI);
      sy = 1 - 0.05 * Math.sin(k * Math.PI);
    } else if (e.state === 'walk') {
      const ph = e.t * 3.6 + e.hop;
      const bounce = Math.abs(Math.sin(ph));
      hop = bounce * h * 0.075;
      const land = Math.max(0, 1 - bounce * 2.4);
      sy = 1 + 0.055 * Math.sin(ph * 2) - 0.05 * land;
      sx = 1 - 0.045 * Math.sin(ph * 2) + 0.05 * land;
      tilt = Math.sin(ph) * 0.055 + 0.03;
      dx = -Math.sin(ph) * 1.5;
    } else if (e.state === 'attack') {
      const wind = clamp((e.atkT - 1.1) / 0.35, 0, 1);
      const hit = e.anim;
      hop = Math.abs(Math.sin(e.t * 2.2 + e.hop)) * h * 0.02;
      tilt = -0.06 * wind + 0.20 * Math.sin(hit * Math.PI);
      dx = -4 * wind + 12 * Math.sin(hit * Math.PI);
      sy = 1 + 0.03 * Math.sin(hit * Math.PI);
    }
    if (e.hurt > 0) {
      const k = clamp(e.hurt / 0.2, 0, 1);
      sy *= 1 - 0.20 * k;
      sx *= 1 + 0.18 * k;
      dx += rnd(-2, 2) * k;
    }
    if (e.spawnIn > 0) alpha = clamp(1 - e.spawnIn / 0.34, 0, 1);

    const bob = Math.sin(t * 1.9 + e.wob) * 2.0;
    const yb = e.y + bob - hop;
    const x = e.x + dx;

    const liftRatio = clamp(hop / (h * 0.4), 0, 1);
    drawShadow(x, e.y + 7, h * (e.boss ? 0.40 : 0.28) * (1 - liftRatio * 0.35), (e.boss ? 0.55 : 0.42) * (1 - liftRatio * 0.4) * alpha);

    if (e.boss) {
      const col = e.spr === 'mob_dragon' ? '255,90,60' : e.spr === 'mob_darkknight' ? '160,80,255' : '255,190,90';
      const gg = ctx.createRadialGradient(x, yb - h * 0.42, 10, x, yb - h * 0.42, h * 0.75);
      gg.addColorStop(0, 'rgba(' + col + ',.26)');
      gg.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(x, yb - h * 0.42, h * 0.75, 0, 6.283); ctx.fill();
    }
    drawActor(e.spr, x, yb, h, {
      rot, sx, sy, alpha, flash: e.hurt > 0.02 && e.dying <= 0,
      tint: e.tint, gray: e.dying > 0
    });

    if (e.hp > 0 && e.dying <= 0) {
      const bw = clamp(h * (e.boss ? 0.8 : 0.52), 18, 96), bh = e.boss ? 5 : 3;
      const bx = x - bw / 2, by = yb - h - (e.boss ? 13 : 8);
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = '#3a1520';
      ctx.fillRect(bx, by, bw, bh);
      const rr = clamp(e.hp / e.maxHp, 0, 1);
      const g2 = ctx.createLinearGradient(bx, by, bx + bw, by);
      if (e.boss) { g2.addColorStop(0, '#ff9a6b'); g2.addColorStop(1, '#c01030'); }
      else { g2.addColorStop(0, '#ff8a5c'); g2.addColorStop(1, '#e0203c'); }
      ctx.fillStyle = g2;
      ctx.fillRect(bx, by, bw * rr, bh);
    }
  });
}

/* ---------- 아군 파티 ---------- */
function drawParty() {
  const list = party.slice().sort((a, b) => (a.y - b.y) || (a.x - b.x));
  const t = B.t;
  list.forEach(p => {
    const hh = p.hh;
    let dx = 0, dy = 0, tilt = 0, sx = 1, sy = 1, lift = 0;

    // 숨쉬기 (squash & stretch)
    const breath = Math.sin(t * 1.9 + p.phase);
    sy += 0.032 * breath;
    sx -= 0.024 * breath;
    dy += Math.sin(t * 1.7 + p.phase) * 0.9;

    // 부유 (마법사/성직자)
    if (p.key === 'mage' || p.key === 'priest') {
      const fl = Math.sin(t * 1.35 + p.phase);
      dy -= 2.2 + fl * 1.8;
      lift = 2.2 + fl * 1.8;
      tilt += fl * 0.012;
    }

    const a = p.anim;
    if (p.down <= 0 && a > 0) {
      const k = 1 - a; // 0 → 1
      if (p.key === 'knight') {
        if (k < 0.26) {
          const q = k / 0.26;
          dx = -11 * easeOut(q);
          tilt = -0.09 * q;
          sy *= 1 - 0.05 * q;
          sx *= 1 + 0.04 * q;
        } else if (k < 0.58) {
          const q = (k - 0.26) / 0.32;
          dx = lerp(-11, 36, easeOut(q));
          tilt = lerp(-0.09, 0.24, q);
          sy *= 1 + 0.06 * Math.sin(q * Math.PI);
          sx *= 1 - 0.03 * Math.sin(q * Math.PI);
        } else {
          const q = (k - 0.58) / 0.42;
          dx = lerp(36, 0, q * q);
          tilt = lerp(0.24, 0, easeOut(q));
          sy *= 1 - 0.03 * Math.sin(q * Math.PI);
        }
      } else if (p.key === 'archer') {
        const q = k;
        const rec = Math.sin(q * Math.PI);
        dx = -5 * rec;
        dy -= 4.5 * Math.abs(Math.sin(q * Math.PI * 1.3));
        tilt = 0.07 * Math.sin(q * Math.PI * 2);
        sy *= 1 + 0.03 * rec;
      } else if (p.key === 'mage') {
        const q = k;
        const rec = Math.sin(q * Math.PI);
        dx = -9 * rec;
        dy -= 5 * rec;
        sy *= 1 + 0.07 * rec;
        sx *= 1 - 0.04 * rec;
        tilt = -0.06 * rec;
        lift += 5 * rec;
      } else {
        const q = k;
        const rec = Math.sin(q * Math.PI);
        dx = 3 * rec;
        dy -= 3.5 * rec;
        sy *= 1 + 0.04 * rec;
        tilt = 0.03 * rec;
      }
    }

    // 피격 경직
    if (p.hurt > 0) {
      const k = p.hurt / 0.35;
      dx += Math.sin(p.hurt * 62) * 5 * k;
      tilt += Math.sin(p.hurt * 47) * 0.09 * k;
      sx *= 1 + 0.05 * k;
      sy *= 1 - 0.04 * k;
    }

    const x = p.x + dx;
    const yb = p.y + dy;

    // 그림자
    if (p.down > 0) {
      drawShadow(x, p.y + 3, hh * 0.26, 0.3);
      drawActor(p.img, x, p.y + 2, hh * 0.62, { rot: -1.42, alpha: 0.42, gray: true, sx: 1, sy: 1 });
      ctx.save();
      ctx.font = '900 10px "Noto Sans KR",sans-serif';
      ctx.fillStyle = 'rgba(255,140,150,.95)';
      ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(p.down) + '초', x, p.y - 8);
      ctx.restore();
      return;
    }
    drawShadow(x, p.y + 3, hh * 0.27 * (1 - clamp(lift / 26, 0, 0.3)), 0.42);

    // 힐 발광
    if (p.healGlow > 0) {
      ctx.save();
      const gg = ctx.createRadialGradient(x, yb - hh * 0.45, 4, x, yb - hh * 0.45, hh * 0.66);
      gg.addColorStop(0, 'rgba(255,230,150,' + (0.30 * p.healGlow) + ')');
      gg.addColorStop(1, 'rgba(255,230,150,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(x, yb - hh * 0.45, hh * 0.66, 0, 6.283); ctx.fill();
      ctx.restore();
    }

    drawActor(p.img, x, yb, hh, { rot: tilt, sx, sy, flash: p.hurt > 0.2 });

    // 이름표
    ctx.save();
    ctx.font = '800 9px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    const tw = ctx.measureText(p.name).width;
    ctx.fillStyle = 'rgba(6,10,20,.62)';
    ctx.beginPath();
    (ctx.roundRect ? ctx.roundRect(x - tw / 2 - 6, yb + 2, tw + 12, 13, 6) : ctx.rect(x - tw / 2 - 6, yb + 2, tw + 12, 13));
    ctx.fill();
    ctx.fillStyle = p.color;
    ctx.fillText(p.name, x, yb + 11.5);
    ctx.restore();

    // 체력바
    const bw = Math.min(44, hh * 0.46), bh = 3;
    const bx = x - bw / 2, by = yb + 16;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(bx, by, bw, bh);
    const ratio = clamp(p.hp / p.maxHp, 0, 1);
    ctx.fillStyle = ratio > 0.45 ? '#5ee08a' : ratio > 0.2 ? '#ffc94a' : '#ff5566';
    ctx.fillRect(bx, by, bw * ratio, bh);
  });
}

function drawProjectiles() {
  B.projs.forEach(pr => {
    ctx.save();
    if (pr.type === 'arrow') {
      const ang = Math.atan2(pr.ty - pr.sy, pr.tx - pr.sx);
      ctx.translate(pr.x, pr.y);
      ctx.rotate(ang);
      const g = ctx.createLinearGradient(-26, 0, 8, 0);
      g.addColorStop(0, 'rgba(150,255,140,0)');
      g.addColorStop(1, 'rgba(200,255,180,.95)');
      ctx.strokeStyle = g; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(6, 0); ctx.stroke();
      ctx.fillStyle = '#eaffd8';
      ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(2, -3.4); ctx.lineTo(2, 3.4); ctx.closePath(); ctx.fill();
    } else if (pr.type === 'enemy') {
      ctx.translate(pr.x, pr.y);
      ctx.rotate(B.t * 14);
      if (pr.spr === 'mob_dragon') {
        const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 16);
        g.addColorStop(0, 'rgba(255,255,210,1)');
        g.addColorStop(0.45, 'rgba(255,150,60,.9)');
        g.addColorStop(1, 'rgba(255,60,20,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, 16, 0, 6.283); ctx.fill();
      } else {
        ctx.fillStyle = '#cfd8ea';
        ctx.beginPath();
        ctx.moveTo(-2, -9); ctx.lineTo(9, 0); ctx.lineTo(-2, 9); ctx.lineTo(-6, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(30,40,60,.9)'; ctx.lineWidth = 1.4; ctx.stroke();
      }
    } else if (pr.type === 'fire') {
      const r = 10 + Math.sin(B.t * 26) * 2;
      const g = ctx.createRadialGradient(pr.x, pr.y, 1, pr.x, pr.y, r * 2.6);
      g.addColorStop(0, 'rgba(255,255,220,.98)');
      g.addColorStop(0.35, 'rgba(255,180,80,.9)');
      g.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, r * 2.6, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,235,.95)';
      ctx.beginPath(); ctx.arc(pr.x, pr.y, r * 0.55, 0, 6.283); ctx.fill();
    } else {
      const g = ctx.createRadialGradient(pr.x, pr.y, 1, pr.x, pr.y, 18);
      g.addColorStop(0, 'rgba(255,255,240,1)');
      g.addColorStop(0.4, 'rgba(255,226,150,.85)');
      g.addColorStop(1, 'rgba(255,200,80,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, 18, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,190,.75)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, 9, 0, 6.283); ctx.stroke();
    }
    ctx.restore();
  });
}

function drawFx() {
  B.fx.forEach(f => {
    const k = 1 - f.life / f.max;
    ctx.save();
    if (f.type === 'slash') {
      ctx.globalAlpha = (1 - k) * 0.95;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = (f.w || 8) * (1 - k * 0.6);
      ctx.lineCap = 'round';
      ctx.shadowColor = f.color; ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.len * (0.4 + k * 0.7), f.a - 0.9, f.a + 0.9);
      ctx.stroke();
      ctx.globalAlpha *= 0.6;
      ctx.lineWidth *= 0.4;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.len * (0.55 + k * 0.9), f.a - 0.7, f.a + 0.5);
      ctx.stroke();
    } else if (f.type === 'ring') {
      const r = lerp(f.r0, f.r1, easeOut(k));
      ctx.globalAlpha = (1 - k) * 0.9;
      ctx.strokeStyle = 'rgba(' + f.color + ',1)';
      ctx.lineWidth = 3 * (1 - k) + 0.6;
      ctx.shadowColor = 'rgba(' + f.color + ',.9)'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.ellipse(f.x, f.y, r, r * 0.55, 0, 0, 6.283); ctx.stroke();
    } else if (f.type === 'spark') {
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = 'rgba(' + f.color + ',1)';
      ctx.beginPath(); ctx.arc(f.x, f.y, 16 * (1 - k) + 3, 0, 6.283); ctx.fill();
    } else if (f.type === 'rush') {
      // 방패 밀치기 충격파
      ctx.globalAlpha = (1 - k) * 0.9;
      const w = (f.w || 30) * (1 - k * 0.4);
      for (let i = 0; i < 3; i++) {
        const x = f.x + easeOut(k) * 260 + i * 40;
        const g = ctx.createLinearGradient(x, 0, x + 90, 0);
        g.addColorStop(0, 'rgba(200,230,255,.65)');
        g.addColorStop(1, 'rgba(200,230,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(x, f.y, 26 * (1 - k * 0.3), w, 0, 0, 6.283);
        ctx.fill();
      }
      ctx.strokeStyle = 'rgba(220,240,255,' + (1 - k) * 0.8 + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y, 40 + easeOut(k) * 300, (40 + easeOut(k) * 300) * 0.5, 0, 0, 6.283);
      ctx.stroke();
    } else if (f.type === 'meteor') {
      const y = lerp(-90, f.y, Math.min(1, k / 0.42));
      ctx.globalAlpha = k < 0.9 ? 1 : (1 - k) * 8;
      const g = ctx.createRadialGradient(f.x, y - 40, 4, f.x, y, 54);
      g.addColorStop(0, 'rgba(255,255,230,1)');
      g.addColorStop(0.4, 'rgba(255,160,60,.92)');
      g.addColorStop(1, 'rgba(255,60,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(f.x, y, 54, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(255,140,60,.55)'; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(f.x + 18, y - 80); ctx.lineTo(f.x, y); ctx.stroke();
    } else if (f.type === 'holyaura') {
      ctx.globalAlpha = (1 - k) * 0.8;
      for (let i = 0; i < 3; i++) {
        const rr = (k * 120 + i * 30) % 120;
        ctx.strokeStyle = 'rgba(255,235,170,' + ((1 - k) * 0.6) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(f.x, f.y, rr, rr * 0.6, 0, 0, 6.283); ctx.stroke();
      }
      const g = ctx.createLinearGradient(f.x, f.y - 140, f.x, f.y);
      g.addColorStop(0, 'rgba(255,240,190,0)');
      g.addColorStop(0.55, 'rgba(255,225,140,' + (0.26 * (1 - k)) + ')');
      g.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = g;
      ctx.fillRect(f.x - 60, f.y - 150, 120, 150);
    }
    ctx.restore();
  });
}

function drawParticles() {
  B.parts.forEach(q => {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (0.5 + a * 0.7), 0, 6.283); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawHits() {
  B.hits.forEach(h => {
    const k = clamp(h.life / h.max, 0, 1);
    const scale = h.scale * (0.86 + Math.min(0.14, (1 - k) * 0.9));
    ctx.save();
    ctx.globalAlpha = k > 0.35 ? 1 : k / 0.35;
    ctx.translate(h.x, h.y);
    ctx.scale(scale, scale);
    const big = h.crit || h.kind === 'gold';
    let fs = big ? clamp(H * 0.031, 19, 31) : clamp(H * 0.024, 15, 24);
    if (h.kind === 'mini') fs = clamp(H * 0.018, 11, 17);
    ctx.font = '900 ' + fs + 'px "Black Han Sans","Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    if (h.kind === 'heal') { ctx.fillStyle = '#8dffb0'; ctx.strokeStyle = 'rgba(4,30,14,.9)'; }
    else if (h.kind === 'gold') { ctx.fillStyle = '#ffe066'; ctx.strokeStyle = 'rgba(80,50,0,.95)'; }
    else if (h.kind === 'dia') { ctx.fillStyle = '#9be8ff'; ctx.strokeStyle = 'rgba(0,40,70,.95)'; }
    else if (h.kind === 'wall') { ctx.fillStyle = '#ff8a8a'; ctx.strokeStyle = 'rgba(50,0,8,.95)'; }
    else if (h.kind === 'hit') { ctx.fillStyle = '#ff9a9a'; ctx.strokeStyle = 'rgba(60,0,10,.95)'; }
    else if (h.crit) { ctx.fillStyle = '#fff1a8'; ctx.strokeStyle = 'rgba(120,40,0,.95)'; }
    else { ctx.fillStyle = '#ffffff'; ctx.strokeStyle = 'rgba(10,16,32,.92)'; }
    if (h.crit) {
      ctx.shadowColor = 'rgba(255,190,60,.9)';
      ctx.shadowBlur = 16;
    }
    if (h.kind === 'mini') {
      ctx.shadowColor = 'rgba(0,0,0,.9)';
      ctx.shadowBlur = 3;
      ctx.fillText(h.txt, 0, 0);
    } else {
      ctx.lineWidth = 4;
      ctx.strokeText(h.txt, 0, 0);
      ctx.fillText(h.txt, 0, 0);
    }
    if (h.crit) {
      ctx.globalAlpha *= 0.9;
      ctx.font = '900 ' + Math.max(8, fs * 0.4) + 'px "Noto Sans KR",sans-serif';
      ctx.fillStyle = '#ff9a3d';
      ctx.strokeStyle = 'rgba(60,20,0,.9)';
      ctx.lineWidth = 2.5;
      ctx.strokeText('CRITICAL', 0, fs * 0.52);
      ctx.fillText('CRITICAL', 0, fs * 0.52);
    }
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

function drawForeground() {
  const sway = B.t * 0.8;
  ctx.save();
  ctx.strokeStyle = 'rgba(3,6,12,.92)';
  ctx.lineCap = 'round';
  for (let i = 0; i < 40; i++) {
    const x = WALL.x + (i * 47 + 12) % (W - WALL.x + 40) - 20;
    const base = H + 4;
    const hgt = 14 + ((i * 37) % 26);
    const lean = Math.sin(sway + i * 0.7) * 5;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(x, base);
    ctx.quadraticCurveTo(x + lean * 0.4, base - hgt * 0.6, x + lean, base - hgt);
    ctx.stroke();
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.moveTo(x + 6, base);
    ctx.quadraticCurveTo(x + 6 + lean * 0.6, base - hgt * 0.45, x + 8 + lean * 1.3, base - hgt * 0.7);
    ctx.stroke();
  }
  ctx.restore();
}

function drawStageFlash() {
  if (B.stageFlash <= 0) return;
  ctx.save();
  ctx.globalAlpha = B.stageFlash * 0.8;
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, 'rgba(120,200,255,0)');
  g.addColorStop(0.5, 'rgba(200,235,255,.55)');
  g.addColorStop(1, 'rgba(120,200,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(B.sx, B.sy);
  drawBG();
  drawGround();
  drawWall();
  drawEnemies();
  drawParty();
  drawParapetFront();
  drawProjectiles();
  drawFx();
  drawParticles();
  drawHits();
  drawForeground();
  drawStageFlash();
  ctx.restore();
}
