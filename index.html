<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070912">
<title>아르카디아 기사단 키우기 II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{
  background:#05070d;color:#e9edf6;
  font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;overscroll-behavior:none;
}
:root{
  --gold:#f7cb77; --gold-d:#b8862f; --dia:#8fdcff; --line:#27324e; --line2:#38466a;
  --panel:#0d1220; --panel2:#111829; --hp:#ff5566; --hp2:#ff8a5c; --blue:#5aa8ff;
  --txt:#e9edf6; --dim:#93a1c0; --dim2:#6b7896;
  --shadow:0 18px 50px rgba(0,0,0,.65);
}
#app{
  position:relative;display:flex;width:100%;height:100dvh;overflow:hidden;
  background:#070912;box-shadow:0 0 0 1px rgba(120,150,220,.08);
}
/* ================= battle column ================= */
.battle-col{position:relative;flex:1 1 auto;min-width:0;overflow:hidden;background:#05070f}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.battle-col::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%,transparent 42%,rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply;
}
.overlay{position:absolute;inset:0;pointer-events:none;z-index:5}
.overlay > *{pointer-events:auto}

/* HUD */
.hud{
  position:absolute;top:0;left:0;right:0;z-index:9;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,rgba(6,9,17,.92),rgba(6,9,17,.55) 62%,rgba(6,9,17,0));
  pointer-events:none;
}
.hud > *{pointer-events:auto}
.hud-id{display:flex;align-items:center;gap:8px;min-width:0}
.crest{
  width:38px;height:38px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(160deg,#2b3b63,#141c30 70%);border:1px solid #47608f;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 18px rgba(110,160,255,.25);
}
.hud-title{font-family:"Black Han Sans",sans-serif;font-size:15px;letter-spacing:.01em;line-height:1.1;
  color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 16px rgba(120,170,255,.4);display:flex;align-items:center;gap:6px}
.tag-live{font-family:"Noto Sans KR",sans-serif;font-size:7.5px;font-weight:900;letter-spacing:.12em;color:#8ff5c8;
  border:1px solid rgba(90,225,165,.45);background:rgba(25,120,90,.28);border-radius:4px;padding:1px 4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.hud-sub{font-size:10.5px;color:#b9c6e2;margin-top:1px;white-space:nowrap}
.hud-sub b{color:var(--gold);font-variant-numeric:tabular-nums}
.hud-right{margin-left:auto;display:flex;align-items:center;gap:5px}
.cur{
  display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;
  background:rgba(9,13,24,.85);border:1px solid #2b3752;border-radius:20px;padding:4px 10px 4px 7px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);white-space:nowrap;
}
.coin{width:13px;height:13px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 35% 28%,#fff3c4,#eab340 58%,#94630f);box-shadow:inset 0 0 0 1.4px rgba(120,70,0,.4)}
.gem{width:11px;height:11px;flex:0 0 auto;margin:0 1px;transform:rotate(45deg);border-radius:2px;
  background:linear-gradient(160deg,#c9f1ff,#3ea6ff 55%,#1b5fc4);box-shadow:0 0 9px rgba(90,180,255,.7)}
#goldTxt{color:#f8dc9a} #diaTxt{color:#a7e5ff}
.ico-btn{
  width:30px;height:30px;border-radius:9px;border:1px solid #33405e;background:rgba(18,24,40,.9);
  color:#a8b6d4;font-size:13px;font-weight:800;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
  transition:transform .12s,background .2s,color .2s;
}
.ico-btn:active{transform:scale(.92)}
.ico-btn.on{color:#0c1120;background:linear-gradient(180deg,#ffd98a,#e0a740);border-color:#ffe0a0}
.ico-btn.speed{font-size:11px;width:38px}

/* combo */
.combo{position:absolute;left:50%;top:12%;transform:translate(-50%,0);z-index:8;text-align:center;opacity:0;
  transition:opacity .2s;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.55)}
.combo.on{opacity:1}
.combo b{font-family:"Black Han Sans",sans-serif;font-size:34px;color:#ffe066;line-height:1;
  -webkit-text-stroke:2px #7a3d00;text-shadow:0 0 20px rgba(255,180,50,.9)}
.combo i{display:block;font-style:normal;font-size:11px;font-weight:900;letter-spacing:.32em;color:#ffd68a}

/* boss */
.boss-wrap{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);
  width:min(64%,560px);z-index:8;display:none;pointer-events:none}
.boss-wrap.on{display:block;animation:bossIn .4s ease-out}
@keyframes bossIn{from{opacity:0;transform:translate(-50%,-14px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.boss-top{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:3px}
.boss-top span{font-family:"Black Han Sans",sans-serif;font-size:12.5px;color:#ffb0b0;letter-spacing:.06em;
  text-shadow:0 2px 0 #000,0 0 14px rgba(255,60,60,.8)}
.boss-bar{height:11px;border-radius:6px;background:rgba(10,5,10,.8);border:1px solid rgba(255,120,120,.4);
  overflow:hidden;box-shadow:0 0 18px rgba(255,60,60,.35)}
.boss-fill{height:100%;width:100%;background:linear-gradient(180deg,#ff8a6b,#e0203c 60%,#8c0a20);
  transition:width .12s;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

/* party */
.party{position:absolute;left:10px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;display:flex;gap:5px}
.pcard{
  width:47px;border-radius:8px;background:linear-gradient(180deg,rgba(16,22,38,.92),rgba(9,13,24,.92));
  border:1px solid #2b3750;padding:3px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 4px 14px rgba(0,0,0,.5);transition:border-color .2s,opacity .3s
}
.pcard.down{opacity:.42;filter:grayscale(.8)}
.pcard .pav{width:24px;height:24px;border-radius:6px;overflow:hidden;background:#0a0f1c;border:1px solid #38466a}
.pcard .pav img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.pcard .pnm{font-size:8px;font-weight:800;color:#cdd8ef;line-height:1}
.pcard .pbar{width:100%;height:3.5px;border-radius:2px;background:#241a22;overflow:hidden}
.pcard .pbar > i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b6b,#ffb36b);transition:width .2s}
.pcard.low .pbar > i{background:linear-gradient(90deg,#ff2f45,#c1122a)}

/* cut-in */
.cutin{position:absolute;inset:0;z-index:14;display:none;pointer-events:none;overflow:hidden}
.cutin.on{display:block}
.cutin .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:cutFlash .55s ease-out}
@keyframes cutFlash{0%{opacity:.5}30%{opacity:.08}100%{opacity:0}}
.cutin .band{
  position:absolute;left:-6%;right:-6%;top:50%;height:min(15%,124px);transform:translateY(-50%) skewX(-11deg);
  background:linear-gradient(90deg,rgba(10,14,26,0),var(--c1) 12%,var(--c2) 55%,rgba(10,14,26,0));
  border-top:2px solid rgba(255,255,255,.55);border-bottom:2px solid rgba(255,255,255,.25);
  box-shadow:0 0 40px var(--c2),inset 0 0 60px rgba(0,0,0,.45);
  animation:cutBand .95s cubic-bezier(.2,.9,.2,1) both;opacity:0
}
@keyframes cutBand{
  0%{transform:translateY(-50%) skewX(-11deg) scaleY(.05);opacity:0}
  16%{transform:translateY(-50%) skewX(-11deg) scaleY(1);opacity:1}
  78%{opacity:1}
  100%{transform:translateY(-50%) skewX(-11deg) scaleY(1) translateX(6%);opacity:0}
}
.cutin .inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transform:skewX(-11deg);animation:cutIn .95s ease-out both}
@keyframes cutIn{0%{opacity:0;transform:skewX(-11deg) translateX(-40px) scale(.9)}18%{opacity:1;transform:skewX(-11deg) translateX(0) scale(1)}80%{opacity:1}100%{opacity:0;transform:skewX(-11deg) translateX(20px) scale(1.02)}}
.cutin .ico{font-size:clamp(24px,4.6vh,44px);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));margin-right:12px}
.cutin .txt{display:flex;flex-direction:column;line-height:1.02}
.cutin .who{font-size:clamp(8px,1.25vh,11px);font-weight:900;letter-spacing:.34em;color:rgba(255,255,255,.92)}
.cutin .nm{font-family:"Black Han Sans",sans-serif;font-size:clamp(22px,5.2vh,50px);color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 22px rgba(255,255,255,.55)}
.cutin .rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0deg 4deg,transparent 4deg 16deg);
  animation:spin 9s linear infinite;opacity:.14;mix-blend-mode:screen}
@keyframes spin{to{transform:rotate(360deg)}}

/* mission bar */
.mission{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));
  width:min(94%,640px);z-index:9;display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,rgba(23,20,38,.96),rgba(12,12,24,.97));
  border:1px solid #4a4230;border-radius:12px;padding:7px 8px 7px 9px;
  box-shadow:0 10px 28px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,220,150,.16);
}
.mission .mico{width:30px;height:30px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;font-size:15px;
  background:linear-gradient(160deg,#3a2f1b,#241d12);border:1px solid #6b5730}
.mission .mbody{flex:1 1 auto;min-width:0}
.mission .mline{display:flex;align-items:baseline;gap:6px;min-width:0}
.mission .mtag{font-size:8px;font-weight:900;letter-spacing:.1em;color:#8a7650;flex:0 0 auto}
.mission .mtext{font-size:11.5px;font-weight:800;color:#f4e7c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mission .mtext em{font-style:normal;color:var(--gold)}
.mission .mprog{margin-top:4px;height:3px;border-radius:2px;background:#241f18;overflow:hidden}
.mission .mprog > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0b64a,#ffe9a8);transition:width .3s}
.mission .mrew{font-size:9.5px;font-weight:800;color:#ffd98a;flex:0 0 auto;white-space:nowrap}
.mission .mbtn{
  flex:0 0 auto;border:0;border-radius:8px;padding:7px 11px;font-family:"Noto Sans KR",sans-serif;
  font-size:10.5px;font-weight:900;color:#5a3d05;background:linear-gradient(180deg,#ffd98a,#e8b345);
  box-shadow:0 3px 0 #9a6f1c,inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer
}
.mission .mbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6f1c}
.mission .mbtn[disabled]{background:linear-gradient(180deg,#39405a,#262c40);color:#8794ad;box-shadow:none;cursor:default}
.mission.ready{border-color:#f0c063;animation:missionGlow 1.1s infinite}
@keyframes missionGlow{0%,100%{box-shadow:0 10px 28px rgba(0,0,0,.62),0 0 0 1px rgba(240,192,99,.4)}50%{box-shadow:0 10px 28px rgba(0,0,0,.62),0 0 22px rgba(240,192,99,.75)}}

/* stage clear banner */
.stageclear{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);z-index:12;
  text-align:center;opacity:0;pointer-events:none}
.stageclear.on{animation:scBanner 1.7s ease-out both}
@keyframes scBanner{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
  22%{transform:translate(-50%,-50%) scale(1)}
  76%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-58%) scale(1)}
}
.stageclear .t1{font-family:"Black Han Sans",sans-serif;font-size:clamp(26px,6vh,52px);color:#fff;
  -webkit-text-stroke:2px rgba(20,30,60,.85);text-shadow:0 0 26px rgba(140,200,255,.9),0 4px 0 rgba(0,0,0,.4)}
.stageclear .t2{margin-top:2px;font-size:11px;font-weight:900;letter-spacing:.3em;color:#cfe4ff}

/* toast */
.toast{position:absolute;left:50%;bottom:calc(66px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:20;background:rgba(10,14,24,.94);border:1px solid #3d4a6c;border-radius:9px;padding:7px 14px;
  font-size:11.5px;font-weight:700;color:#e8eefc;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.6);max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ================= side ================= */
.side-col{
  flex:0 0 clamp(330px,37%,600px);width:37%;min-width:330px;max-width:600px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0e1424,#080c16 70%);border-left:1px solid #1f2a44;min-height:0;
  box-shadow:-14px 0 36px rgba(0,0,0,.55);z-index:10
}
.side-head{
  flex:0 0 auto;padding:calc(9px + env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,#151d33,#101728);border-bottom:1px solid #24304c
}
.sh-row{display:flex;align-items:center;gap:7px}
.rank{
  font-family:"Black Han Sans",sans-serif;font-size:11.5px;color:#0d1020;padding:2px 8px;border-radius:5px;
  background:linear-gradient(180deg,#ffe6a8,#e6b44e);box-shadow:0 2px 0 #8f6720,inset 0 1px 0 rgba(255,255,255,.7);white-space:nowrap
}
.sh-title{font-size:11px;font-weight:800;color:#c3cfe8}
.sh-power{margin-left:auto;font-size:11px;font-weight:800;color:#98a7c6;white-space:nowrap}
.sh-power b{font-family:"Black Han Sans",sans-serif;color:#ffd88a;font-size:13px;letter-spacing:.02em}
.sh-stats{display:flex;gap:5px;margin-top:6px}
.sh-chip{
  flex:1;background:#0c1220;border:1px solid #222e4a;border-radius:6px;padding:3px 6px;font-size:9.5px;color:#8d9bb8;
  display:flex;justify-content:space-between;gap:3px
}
.sh-chip b{color:#dfe8f8;font-weight:800;font-variant-numeric:tabular-nums}

.tabs{flex:0 0 auto;display:flex;gap:4px;padding:7px 8px;background:#0b1020;border-bottom:1px solid #1d2740}
.tab{
  flex:1;position:relative;border:1px solid #26314e;background:linear-gradient(180deg,#141b2e,#0e1424);
  color:#8f9dba;font-family:"Noto Sans KR",sans-serif;font-size:11.5px;font-weight:800;padding:7px 0 6px;
  border-radius:8px;cursor:pointer;transition:all .18s;letter-spacing:-.01em
}
.tab:active{transform:scale(.97)}
.tab.on{
  color:#0e1320;background:linear-gradient(180deg,#ffe09b,#e9b64c);border-color:#ffe8b0;
  box-shadow:0 2px 0 #9c711f,0 0 16px rgba(240,190,90,.28)
}
.tab .dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:#ff5a6e;
  box-shadow:0 0 6px #ff5a6e;display:none}
.tab.has .dot{display:block}
.panel{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:9px 9px 26px;scrollbar-width:thin;
  scrollbar-color:#2b3752 transparent}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:#2b3752;border-radius:3px}
/* ================= panel widgets ================= */
.sec-h{display:flex;align-items:center;gap:6px;margin:10px 2px 6px}
.sec-h .si{font-size:12px}
.sec-h h3{margin:0;font-size:11.5px;font-weight:900;color:#dfe8f8;letter-spacing:.01em}
.sec-h .n{margin-left:auto;font-size:9.5px;color:#77859f}
.card{
  background:linear-gradient(180deg,#131a2b,#0d1320);border:1px solid #24304a;border-radius:10px;
  padding:8px;margin-bottom:6px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035)
}
.stat{display:flex;align-items:center;gap:8px}
.stat .si{
  width:34px;height:34px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;font-size:16px;
  background:linear-gradient(160deg,#26324f,#161d2f);border:1px solid #39486a
}
.stat .smain{flex:1 1 auto;min-width:0}
.stat .stop{display:flex;align-items:baseline;gap:5px}
.stat .sname{font-size:11.5px;font-weight:800;color:#e6edfa}
.stat .slv{font-family:"Black Han Sans",sans-serif;font-size:11px;color:#ffd98a;background:#2a2312;
  border:1px solid #564720;border-radius:4px;padding:0 4px}
.stat .sval{margin-left:auto;font-size:11px;font-weight:800;color:#9fe0b0;font-variant-numeric:tabular-nums}
.stat .sdesc{font-size:9.5px;color:#7d8ba6;margin-top:2px}
.stat .sbar{height:4px;border-radius:2px;background:#1b2233;overflow:hidden;margin-top:5px}
.stat .sbar > i{display:block;height:100%;background:linear-gradient(90deg,#5f9cff,#a8e0ff);transition:width .25s}
.buyrow{display:flex;gap:5px;margin-top:6px}
.buy{
  flex:1;border:1px solid #3a4a6e;border-radius:7px;background:linear-gradient(180deg,#1d2942,#141b2c);
  color:#d7e3f8;font-family:"Noto Sans KR",sans-serif;font-size:10px;font-weight:800;padding:5px 0 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .14s;line-height:1.15
}
.buy span{font-size:8.5px;font-weight:700;color:#9fb0cc;display:flex;align-items:center;gap:2px}
.buy span .coin{width:8px;height:8px}
.buy:active{transform:translateY(1px)}
.buy.can{border-color:#c79a3c;background:linear-gradient(180deg,#3a2f16,#241d10);color:#ffe4a8}
.buy.can span{color:#e8c983}
.buy.max{opacity:.5;border-color:#4b4f5e;color:#a5adbe}
.buy.max span{color:#8c93a2}
.buy.maxed{background:linear-gradient(180deg,#2a2f42,#1b2030);border-color:#454f6b;color:#b9c4dc}

.equip{display:flex;gap:5px;margin-bottom:2px}
.eslot{
  flex:1;min-width:0;border:1px solid #26314c;border-radius:9px;background:linear-gradient(180deg,#121828,#0c111d);
  padding:6px 5px;text-align:center;cursor:pointer;position:relative;transition:transform .15s
}
.eslot:active{transform:scale(.97)}
.eslot .ei{font-size:16px;line-height:1.2}
.eslot .en{font-size:8.5px;font-weight:800;color:#c9d5ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.eslot .eg{font-size:7.5px;font-weight:900;letter-spacing:.04em}
.eslot .elv{position:absolute;top:3px;right:3px;font-size:7.5px;font-weight:900;color:#ffe6a8;background:rgba(0,0,0,.5);
  border-radius:3px;padding:0 3px}
.eslot.empty{opacity:.62;border-style:dashed}
.eslot.g1{border-color:#4a5468} .eslot.g2{border-color:#3f8f63;box-shadow:0 0 12px rgba(60,200,120,.14)}
.eslot.g3{border-color:#3f7fbf;box-shadow:0 0 12px rgba(70,150,255,.18)}
.eslot.g4{border-color:#8a5fd0;box-shadow:0 0 14px rgba(170,110,255,.22)}
.eslot.g5{border-color:#d9a043;box-shadow:0 0 16px rgba(255,180,60,.3)}
.eslot.g6{border-color:#e0535f;box-shadow:0 0 18px rgba(255,70,90,.35)}

/* gacha */
.gacha-hero{
  position:relative;border-radius:12px;overflow:hidden;border:1px solid #3d3242;
  background:
    radial-gradient(80% 120% at 20% 0%,rgba(255,190,90,.22),transparent 60%),
    radial-gradient(90% 120% at 85% 100%,rgba(150,80,255,.28),transparent 60%),
    linear-gradient(160deg,#1b1630,#0c0d1c);
  padding:10px;margin-bottom:7px
}
.gacha-hero .gh-t{font-family:"Black Han Sans",sans-serif;font-size:15px;color:#ffe6ac;line-height:1.15;
  text-shadow:0 0 18px rgba(255,190,80,.5)}
.gacha-hero .gh-s{font-size:9.5px;color:#b6a9c8;margin-top:2px;line-height:1.45}
.gacha-hero .gh-s b{color:#ffd98a}
.pity{display:flex;gap:5px;margin-top:7px}
.pity .p{flex:1;background:rgba(8,10,20,.6);border:1px solid #342c46;border-radius:7px;padding:4px 6px}

.rewline{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#cfdaf0;

  .side-head{padding:calc(6px + env(safe-area-inset-top)) 9px 5px}
  .sh-chip{font-size:8.5px;padding:2px 4px}
  .tab{font-size:10.5px;padding:6px 0 5px}

    if (!d || typeof d !== 'object') return false;
    const base = defaultState();
    for (const k in base) if (d[k] === undefined) d[k] = base[k];
    ['lv', 'equip', 'gacha', 'own', 'dgn', 'stats', 'mission'].forEach(k => {
      for (const kk in base[k]) if (d[k][kk] === undefined) d[k][kk] = base[k][kk];

    if (!Array.isArray(d.inv)) d.inv = [];
    d.inv = d.inv.filter(it => it && ITEM[it.id]);
    for (const slot in d.equip) {
      const u = d.equip[slot];
      if (u && !d.inv.some(it => it.uid === u)) d.equip[slot] = null;
    }
    if (!d.own.pass) d.speed = 1;
    state = d;
    return true;
  } catch (e) { console.warn('load failed', e); return false; }

    { t: '영웅 등급 장비 획득', rew: 1500, prog: () => [state.inv.some(it => ITEM[it.id].grade >= 4) ? 1 : 0, 1] },
    { t: '스테이지 20 도달', rew: 2200, prog: () => [state.best, 20] }
  ];
  if (i < pool.length) return Object.assign({ id: i }, pool[i]);
  // infinite chain
  const n = i - pool.length;
  const cycle = n % 4;
  const tier = Math.floor(n / 4);
  if (cycle === 0) {
    const need = 12 + tier * 6;
    return { id: i, t: '공격력 Lv.' + need + ' 달성', rew: 1800 + tier * 900, prog: () => [state.lv.atk, need] };
  }
  if (cycle === 1) {
    const need = 25 + tier * 5;
    return { id: i, t: '스테이지 ' + need + ' 도달', rew: 2400 + tier * 1100, prog: () => [state.best, need] };
  }
  if (cycle === 2) {
    const need = 40 + tier * 20;
    return { id: i, t: '소환 ' + need + '회 진행', rew: 2000 + tier * 1000, prog: () => [state.stats.pulls, need] };
  }
  const need = 2 + tier;
  return { id: i, t: '보스 ' + need + '회 처치', rew: 3000 + tier * 1200, prog: () => [state.stats.boss, need] };
}

/* ---------- audio (WebAudio synth) ---------- */
const Audio2 = (() => {
  let ctx = null, master = null, muted = false, noiseBuf = null;
  function init() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.34;
    master.connect(ctx.destination);
    const len = Math.floor(ctx.sampleRate * 0.5);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }
  function tone(freq, dur, type, vol, slideTo, delay) {
    if (muted || !ctx) return;
    const t0 = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, hp, delay) {
    if (muted || !ctx || !noiseBuf) return;
    const t0 = ctx.currentTime + (delay || 0);
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp || 1200;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0 + dur + 0.02);
  }
  const api = {
    init,
    setMuted(v) { muted = v; if (master) master.gain.value = v ? 0 : 0.34; },
    isMuted() { return muted; },
    play(name) {
      if (!ctx || muted) return;
      switch (name) {
        case 'hit': noise(0.09, 0.5, 900); tone(180, 0.09, 'square', 0.10, 90); break;
        case 'crit': noise(0.16, 0.6, 700); tone(320, 0.16, 'sawtooth', 0.14, 120); tone(900, 0.1, 'square', 0.08, 400, 0.02); break;
        case 'arrow': noise(0.06, 0.28, 2600); tone(1200, 0.06, 'triangle', 0.05, 600); break;
        case 'fire': noise(0.22, 0.4, 500); tone(140, 0.2, 'sawtooth', 0.12, 60); break;
        case 'holy': tone(880, 0.25, 'sine', 0.08, 1320); tone(1320, 0.3, 'sine', 0.06, 1760, 0.05); break;
        case 'coin': tone(1180, 0.08, 'square', 0.06); tone(1560, 0.1, 'square', 0.05, null, 0.06); break;
        case 'levelup': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'triangle', 0.1, null, i * 0.075)); break;
        case 'skill': tone(220, 0.3, 'sawtooth', 0.12, 660); noise(0.3, 0.35, 400); break;
        case 'gacha': [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'triangle', 0.08, null, i * 0.055)); break;
        case 'legend': [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.5, 'sine', 0.11, null, i * 0.09)); noise(0.5, 0.3, 3000, 0.1); break;
        case 'boss': tone(98, 0.9, 'sawtooth', 0.16, 60); tone(147, 0.9, 'square', 0.08, 90, 0.05); noise(0.6, 0.3, 200); break;
        case 'clear': [659, 784, 1046].forEach((f, i) => tone(f, 0.28, 'triangle', 0.1, null, i * 0.08)); break;
        case 'click': tone(660, 0.05, 'square', 0.05); break;
        case 'buy': tone(523, 0.1, 'triangle', 0.09); tone(784, 0.14, 'triangle', 0.08, null, 0.08); break;
        case 'fail': tone(300, 0.25, 'sawtooth', 0.1, 130); break;
      }
    }
  };
  return api;
})();

  const st = state.stage;
  if (isBossStage(st)) {
    B.enemy = makeEnemy({ boss: true });
    Audio2.play('boss');
    B.shake = 10;
    setTimeout(() => cutin({ who: 'BOSS', name: B.enemy.name.replace('보스 · ', ''), ico: '☠️', c1: 'rgba(120,10,20,.85)', c2: 'rgba(230,40,60,.85)' }), 120);
    $('#bossWrap').classList.add('on');
    $('#bossName').textContent = B.enemy.name;
  } else {
    B.enemy = makeEnemy({});
    $('#bossWrap').classList.remove('on');
  }
}

/* ---------- damage ---------- */
function hitEnemy(dmg, opt) {
  const e = B.enemy;
  if (!e || e.dying) return;
  opt = opt || {};
  const crit = !!opt.crit;
  const real = Math.max(1, Math.round(dmg));
  e.hp -= real;
  e.hurt = crit ? 0.09 : 0.045;
  B.combo++; B.comboT = 1.35;
  addNum(e.x + rnd(-6, 6), e.y - spriteH(e) * 0.62, real, crit ? 'crit' : 'dmg');
  if (crit) {
    Audio2.play('crit');
    spark(e.x, e.y - spriteH(e) * 0.5, 9, '#ffe066', 320);
    B.shake = Math.max(B.shake, 7);
    B.hitStop = Math.max(B.hitStop, 0.045);
  } else {
    Audio2.play(opt.sfx || 'hit');
    spark(e.x, e.y - spriteH(e) * 0.5, 4, opt.color || '#fff0b8', 190);
    B.shake = Math.max(B.shake, 2.2);
  }
  if (e.boss) $('#bossFill').style.width = clamp(e.hp / e.maxHp, 0, 1) * 100 + '%';
  if (e.hp <= 0) killEnemy();
}
function spriteH(e) {
  const base = heroH;
  if (e.isDgn && !e.boss) return base * 0.86;
  return base * (e.boss ? 1.02 : 1.04) * e.scale;
}
function killEnemy() {
  const e = B.enemy;
  if (!e || e.dying) return;
  e.dying = 0.52;
  e.hp = 0;
  spark(e.x, e.y - spriteH(e) * 0.5, e.boss ? 26 : 14, e.boss ? '#ffd98a' : '#ffffff', e.boss ? 420 : 300);
  addFx({ type: 'ring', x: e.x, y: e.y - spriteH(e) * 0.4, r0: 10, r1: e.boss ? 150 : 80, life: 0.5, max: 0.5, color: e.boss ? '255,215,140' : '255,255,255' });
  $('#bossWrap').classList.remove('on');
  onEnemyKilled(e);
}

function onEnemyKilled(e) {
  const st = state.stage;
  if (B.mode === 'dungeon') { dgnKill(e); return; }
  state.stats.kills++;
  let gold = Math.round(goldPerKill(st) * (e.boss ? 22 : 1));
  state.gold += gold; state.stats.gold += gold;
  addNum(e.x, e.y - spriteH(e) * 0.9, gold, 'gold');
  if (Math.random() < 0.10) {
    const d = 2 + Math.floor(st / 5);
    state.dia += d; addNum(e.x + 20, e.y - spriteH(e) * 0.9 - 18, d, 'dia');
  }
  if (e.boss) {
    state.stats.boss++;
    const dg = 60 + st * 4;
    state.dia += dg;
    setTimeout(() => toast('👑 보스 처치! 다이아 +' + fmtFull(dg)), 300);
    B.shake = 16;
    setTimeout(() => cutin({ who: 'BOSS DOWN', name: '승리의 함성!', ico: '🏆', c1: 'rgba(120,80,10,.9)', c2: 'rgba(255,200,90,.9)' }), 180);
    Audio2.play('legend');
  }
  if (!e.boss) {
    state.kills++;
    if (state.kills >= KILLS_PER_STAGE) {
      state.kills = 0;
      advanceStage();
    }
  } else {
    state.kills = 0;
    advanceStage();
  }
  updateHud();
  save();
}
function advanceStage() {
  state.stage++;
  state.best = Math.max(state.best, state.stage);
  B.stageFlash = 0.55;
  B.bgKick = 1;
  party.forEach(p => { if (!p.down) p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.22); });
  showStageClear(state.stage);
  Audio2.play('clear');
  updateHud(); save();
  B.spawnT = 0.85;
}

/* ---------- party actions ---------- */
function partyAttack(p) {
  const e = B.enemy;
  if (!e || e.dying || p.down) return;
  p.anim = 1;
  const st = heroStats();
  const dmgBase = st.atk * p.mult * rnd(0.92, 1.1);
  const critOK = Math.random() * 100 < st.crit;
  const crit = critOK ? st.cdmg / 100 : 1;
  const mult = crit * (p.buff > 0 ? 1.12 : 1);

  if (p.key === 'knight') {
    addFx({ type: 'slash', x: e.x - 26, y: e.y - heroH * 0.5, a: -0.5, len: 90, life: 0.22, max: 0.22, color: '#cfe4ff', w: 9 });
    for (let i = 0; i < p.hits; i++) {
      at(i * 0.09, () => hitEnemy(dmgBase * mult, { crit: i === 0 && critOK, sfx: 'hit' }));
    }
    B.hitStop = Math.max(B.hitStop, 0.02);
  } else if (p.key === 'archer') {
    for (let i = 0; i < p.hits; i++) {
      at(i * 0.07, () => fireProjectile('arrow', p, dmgBase * mult, { crit: i === 0 && critOK }));
    }
  } else if (p.key === 'mage') {
    fireProjectile('fire', p, dmgBase, { crit: critOK, hits: p.hits, mult });
  } else {
    for (let i = 0; i < p.hits; i++) {
      at(i * 0.1, () => fireProjectile('holy', p, dmgBase * mult, { crit: i === 0 && critOK }));
    }
  }
}
function fireProjectile(type, p, dmg, opt) {
  opt = opt || {};
  const e = B.enemy;
  if (!e || e.dying) return;
  const sx = p.x + heroH * 0.18, sy = (p.y || groundY) - heroH * 0.52;
  const tx = e.x, ty = e.y - spriteH(e) * 0.5;
  const spd = type === 'arrow' ? 1500 : type === 'holy' ? 900 : 620;
  B.projs.push({
    type, sx, sy, tx, ty, x: sx, y: sy, dmg, crit: !!opt.crit, hits: opt.hits || 1, mult: opt.mult || 1,
    t: 0, dur: Math.max(0.12, Math.hypot(tx - sx, ty - sy) / spd), color: type === 'arrow' ? '#b6ff9e' : type === 'holy' ? '#ffe6a0' : '#ff9a4d'
  });
  Audio2.play(type === 'arrow' ? 'arrow' : type === 'holy' ? 'holy' : 'fire');
}
function projectileArrive(pr) {
  const e = B.enemy;
  if (!e || e.dying) return;
  if (pr.type === 'fire') {
    addFx({ type: 'ring', x: e.x, y: e.y - spriteH(e) * 0.45, r0: 8, r1: 84, life: 0.34, max: 0.34, color: '255,140,60' });
    spark(e.x, e.y - spriteH(e) * 0.45, 14, '#ffb066', 300);
    for (let i = 0; i < (pr.hits || 3); i++) {
      at(i * 0.055, () => hitEnemy(pr.dmg * pr.mult * rnd(0.95, 1.06), { crit: i === 0 && pr.crit, sfx: 'fire', color: '#ff9a4d' }));
    }
  } else {
    addFx({ type: 'spark', x: e.x, y: e.y - spriteH(e) * 0.5, life: 0.16, max: 0.16, color: pr.type === 'holy' ? '255,230,160' : '180,255,150' });
    hitEnemy(pr.dmg, { crit: pr.crit, sfx: pr.type === 'holy' ? 'holy' : 'arrow', color: pr.type === 'holy' ? '#ffe6a0' : '#c8ffa8' });
  }
}

/* ultimate skill with cut-in */
function castUltimate(p) {
  const e = B.enemy;
  if (!e || e.dying || p.down) return;
  const st = heroStats();
  const mult = (1.6 + st.skill.mult * 1.3) * rnd(0.95, 1.1);
  p.anim = 1;
  B.hitStop = Math.max(B.hitStop, 0.09);
  B.shake = Math.max(B.shake, 12);
  cutin({ who: p.name, name: p.skill, ico: p.icon, c1: 'rgba(8,12,24,.9)', c2: p.c2 });
  setTimeout(() => Audio2.play('skill'), 60);

  if (p.key === 'knight') {
    addFx({ type: 'beam', x1: p.x + 40, y1: groundY - heroH * 0.6, x2: e.x, y2: groundY - heroH * 0.45, life: 0.55, max: 0.55, color: '200,230,255', w: 26 });
    for (let i = 0; i < 6; i++) at(0.08 * i, () => hitEnemy(st.atk * mult * 0.9, { crit: Math.random() * 100 < st.crit + 20, sfx: 'hit', color: '#d6e9ff' }));
    at(0.52, () => { spark(e.x, e.y - heroH * 0.5, 22, '#ffffff', 420); B.shake = 14; });
  } else if (p.key === 'archer') {
    for (let i = 0; i < 8; i++) at(0.055 * i, () => fireProjectile('arrow', p, st.atk * mult * 0.52, { crit: Math.random() < 0.35 }));
    B.shake = 8;
  } else if (p.key === 'mage') {
    addFx({ type: 'meteor', x: e.x + 40, y: groundY, life: 0.75, max: 0.75 });
    at(0.34, () => {
      addFx({ type: 'ring', x: e.x, y: groundY - 10, r0: 20, r1: 210, life: 0.55, max: 0.55, color: '255,170,80' });
      spark(e.x, groundY - 20, 30, '#ffb066', 480);
      B.shake = 18;
      for (let i = 0; i < 7; i++) hitEnemy(st.atk * mult * 0.72, { crit: Math.random() * 100 < st.crit + 15, sfx: 'fire', color: '#ffb066' });
    });
  } else {
    party.forEach(q => { if (!q.down) { q.hp = Math.min(q.maxHp, q.hp + q.maxHp * 0.30); q.healGlow = 0.8; addNum(q.x, q.y - heroH * 0.95, Math.round(q.maxHp * 0.3), 'heal'); } });
    addFx({ type: 'holyaura', x: p.x, y: groundY - heroH * 0.5, life: 0.9, max: 0.9 });
    for (let i = 0; i < 5; i++) at(0.07 * i, () => hitEnemy(st.atk * mult * 0.55, { crit: false, sfx: 'holy', color: '#ffe6a0' }));
    Audio2.play('levelup');
  }
}
function cutin(o) {
  const el = $('#cutin');
  el.style.setProperty('--c1', o.c1 || 'rgba(10,14,26,.9)');
  el.style.setProperty('--c2', o.c2 || 'rgba(120,160,255,.9)');
  $('#cutIco').textContent = o.ico || '⚔️';
  $('#cutWho').textContent = o.who || '';
  $('#cutName').textContent = o.name || '';
  el.classList.remove('on');
  void el.offsetWidth;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 1000);
}

/* ---------- dungeons ---------- */
function startDungeon(type) {
  if (B.mode === 'dungeon') return;
  const d = state.dgn[type];
  if (d <= 0) { toast('오늘 입장 횟수를 모두 사용했습니다'); return; }
  state.dgn[type]--;
  B.mode = 'dungeon';
  B.dgn = { type, left: DUNGEONS[type].time, gold: 0, dia: 0, kills: 0, boss: null };
  B.queue.length = 0;
  $('#dgnTimer').classList.add('on');
  $('#bossWrap').classList.remove('on');
  party.forEach(p => { p.hp = p.maxHp; p.down = 0; p.atkT = rnd(0.2, 0.9); });
  if (type === 'promote') {
    const st = heroStats();
    B.enemy = makeEnemy({ spr: 'mob_darkknight', boss: true, name: '시련의 기사', hp: Math.max(600, st.dps * 19), atk: enemyAtk(state.stage) * 1.3, isDgn: true });
    B.enemy.scale = 1.35;
    $('#bossName').textContent = '시련의 기사';
    $('#bossWrap').classList.add('on');
    Audio2.play('boss');
  } else {
    spawnDgnEnemy();
  }
  cutin({ who: 'DUNGEON', name: DUNGEONS[type].name, ico: DUNGEONS[type].icon, c1: 'rgba(10,16,30,.92)', c2: type === 'gold' ? 'rgba(200,150,40,.9)' : type === 'dia' ? 'rgba(60,150,220,.9)' : 'rgba(180,60,60,.9)' });
  toast(DUNGEONS[type].name + ' 입장!');
  updateHud(); save(); renderTab();
}
function spawnDgnEnemy() {
  if (B.mode !== 'dungeon' || !B.dgn) return;
  if (B.dgn.type === 'gold') {
    B.enemy = makeEnemy({ spr: 'mob_slime', isDgn: true, gold: Math.round(goldPerKill(state.stage) * 8), scale: 0.9, hp: enemyHp(state.stage) * 1.15, name: '황금 슬라임', tint: 'gold' });
  } else if (B.dgn.type === 'dia') {
    B.enemy = makeEnemy({ spr: 'mob_slime', isDgn: true, dia: 2 + Math.floor(state.stage / 8), scale: 0.9, hp: enemyHp(state.stage) * 1.3, name: '수정 골렘', tint: 'crystal' });
  }
}
function dgnKill(e) {
  if (!B.dgn) return;
  B.dgn.kills++;
  if (B.dgn.type === 'gold') {
    const g = e.gold || Math.round(goldPerKill(state.stage) * 7);
    B.dgn.gold += g;
    state.gold += g; state.stats.gold += g;
    addNum(e.x, e.y - 60, g, 'gold');
    Audio2.play('coin');
    B.spawnT = 0.3;
  } else if (B.dgn.type === 'dia') {
    const d = e.dia || 2;
    B.dgn.dia += d;
    state.dia += d;
    addNum(e.x, e.y - 60, d, 'dia');
    Audio2.play('coin');
    B.spawnT = 0.32;
  } else if (B.dgn.type === 'promote') {
    endDungeon(true);
  }
  updateHud();
}
function endDungeon(success) {
  if (!B.dgn) return;
  const d = B.dgn;
  B.mode = 'stage'; B.dgn = null;
  B.enemy = null; B.queue.length = 0;
  $('#dgnTimer').classList.remove('on');
  $('#bossWrap').classList.remove('on');
  if (d.type === 'gold' && success) state.stats.dungeonGold = (state.stats.dungeonGold || 0) + 1;
  if (d.type === 'promote' && success) {
    if (state.rank < RANKS.length - 1) {
      state.rank++;
      Audio2.play('legend');
      toast('🏅 승급 성공! ' + josa(RANKS[state.rank], '이', '가') + ' 되었습니다');
    } else {
      toast('이미 최고 계급입니다');
    }
  }
  const rows = [];
  if (d.gold) rows.push(['🪙 획득 골드', '+' + fmtFull(d.gold) + ' G']);
  if (d.dia) rows.push(['💎 획득 다이아', '+' + fmtFull(d.dia)]);
  if (d.type === 'promote') rows.push([success ? '🏅 승급 성공' : '⏱ 시간 초과', success ? RANKS[state.rank] : '다시 도전하세요']);
  if (d.type === 'gold' || d.type === 'dia') rows.push(['💀 처치 수', d.kills + '마리']);
  openModal({
    title: success ? '던전 클리어!' : '던전 종료',
    sub: DUNGEONS[d.type].name + (success ? ' · 보상을 획득했습니다' : ' · 제한 시간이 끝났습니다'),
    body: rows.map(r => '<div class="rewline"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join(''),
    buttons: [{ label: '확인', primary: true }]
  });
  Audio2.play(success ? 'clear' : 'fail');
  B.spawnT = 1.2;
  updateHud(); save(); renderTab();
}

/* ---------- update ---------- */
function updateBattle(dt) {
  B.t += dt;
  // pending timers
  for (let i = B.pending.length - 1; i >= 0; i--) {
    B.pending[i].t -= dt;
    if (B.pending[i].t <= 0) { const fn = B.pending[i].fn; B.pending.splice(i, 1); try { fn(); } catch (e) { console.warn(e); } }
  }
  // hit stop freezes combat motion briefly for punch
  if (B.hitStop > 0) { B.hitStop -= dt; dt *= 0.15; }
  B.shake *= Math.pow(0.0025, dt);
  if (B.shake < 0.2) B.shake = 0;
  B.sx = rnd(-1, 1) * B.shake; B.sy = rnd(-1, 1) * B.shake;
  B.stageFlash = Math.max(0, B.stageFlash - dt * 1.6);
  if (B.bgKick > 0) B.bgKick = Math.max(0, B.bgKick - dt * 1.3);
  B.comboT -= dt;
  if (B.comboT <= 0) B.combo = 0;
  B.ultT -= dt;

  // dungeon timer
  if (B.mode === 'dungeon' && B.dgn) {
    B.dgn.left -= dt;
    const el = $('#dgnTime');
    if (el) el.textContent = Math.max(0, Math.ceil(B.dgn.left));
    if (B.dgn.left <= 0) endDungeon(B.dgn.type === 'promote' ? false : true);
  }

  // stage spawn queue
  if (!B.enemy && B.spawnT > 0) {
    B.spawnT -= dt;
    if (B.spawnT <= 0) {
      if (B.mode === 'stage') spawnStageEnemy();
      else if (B.dgn && B.dgn.type !== 'promote') spawnDgnEnemy();
      B.spawnT = 0;
    }
  }

  // enemy logic
  const e = B.enemy;
  if (e) {
    e.spawnT = Math.min(1, e.spawnT + dt * 3);
    e.hurt = Math.max(0, e.hurt - dt);
    if (e.dying > 0) {
      e.dying -= dt;
      if (e.dying <= 0) {
        B.enemy = null;
        if (B.mode === 'stage' && B.spawnT <= 0) B.spawnT = 0.55;
        else if (B.dgn && B.dgn.type !== 'promote' && B.spawnT <= 0) B.spawnT = 0.2;
      }
    } else if (e.hp > 0) {
      e.anim = Math.max(0, e.anim - dt * 2.2);
      e.atkT -= dt;
      if (e.atkT <= 0.42 && e.atkT + dt > 0.42) {
        // wind up
        e.anim = 1;
      }
      if (e.atkT <= 0) {
        e.atkT = e.boss ? rnd(3.0, 3.8) : rnd(2.2, 3.0);
        enemyStrike(e);
      }
    }
  }

  // party logic
  party.forEach(p => {
    p.anim = Math.max(0, p.anim - dt * 4.2);
    p.hurt = Math.max(0, p.hurt - dt);
    p.healGlow = Math.max(0, p.healGlow - dt);
    if (p.down > 0) {
      p.down -= dt;
      if (p.down <= 0) { p.down = 0; p.hp = p.maxHp * 0.5; p.healGlow = 0.9; addNum(p.x, p.y - heroH * 0.9, Math.round(p.maxHp * 0.5), 'heal'); }
      return;
    }
    if (e && !e.dying && e.hp > 0 && e.spawnT > 0.3) {
      p.atkT -= dt;
      if (p.atkT <= 0) { p.atkT = p.cd * rnd(0.92, 1.08); partyAttack(p); }
    }
    p.ultT -= dt;
    if (p.ultT <= 0 && e && !e.dying && e.hp > 0 && B.t - (B.lastUlt || 0) > 7.5) {
      p.ultT = rnd(9, 13);
      B.lastUlt = B.t;
      castUltimate(p);
    }
  });

  // priest passive heal
  B.healT = (B.healT || 0) + dt;
  if (B.healT >= 3.4) {
    B.healT = 0;
    const pr = party[3];
    if (pr && !pr.down) {
      party.forEach(q => {
        if (!q.down && q.hp < q.maxHp) {
          const heal = Math.round(q.maxHp * 0.10);
          q.hp = Math.min(q.maxHp, q.hp + heal);
          if (Math.random() < 0.5) addNum(q.x, q.y - heroH * 0.9, heal, 'heal');
        }
      });
      addFx({ type: 'ring', x: pr.x, y: groundY - 6, r0: 6, r1: 90, life: 0.5, max: 0.5, color: '255,225,150' });
    }
  }

  // projectiles
  for (let i = B.projs.length - 1; i >= 0; i--) {
    const pr = B.projs[i];
    pr.t += dt;
    const k = Math.min(1, pr.t / pr.dur);
    const e2 = B.enemy;
    if (e2) { pr.tx = e2.x; pr.ty = e2.y - spriteH(e2) * 0.5; }
    pr.x = lerp(pr.sx, pr.tx, k);
    pr.y = lerp(pr.sy, pr.ty, k) - Math.sin(k * Math.PI) * (pr.type === 'arrow' ? 26 : 12);
    if (k >= 1) { projectileArrive(pr); B.projs.splice(i, 1); }
  }

  // fx
  for (let i = B.fx.length - 1; i >= 0; i--) {
    const f = B.fx[i]; f.t += dt; f.life -= dt;
    if (f.life <= 0) B.fx.splice(i, 1);
  }
  // particles
  for (let i = B.parts.length - 1; i >= 0; i--) {
    const q = B.parts[i];
    q.life -= dt;
    q.vy += (q.grav || 620) * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.life <= 0) B.parts.splice(i, 1);
  }
  // numbers
  for (let i = B.hits.length - 1; i >= 0; i--) {
    const h = B.hits[i];
    h.life -= dt;
    h.x += h.vx * dt; h.y += h.vy * dt; h.vy += 250 * dt;
    if (h.life <= 0) B.hits.splice(i, 1);
  }

  // out-of-combat regeneration
  if (!B.enemy) {
    party.forEach(p => {
      if (!p.down && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.03 * dt);
    });
  }

  // party wipe handling
  if (party.every(p => p.down > 0) && B.wipeT <= 0) {
    B.wipeT = 3.2;
    toast('파티 전멸! 3초 후 재정비합니다');
    Audio2.play('fail');
  }
  if (B.wipeT > 0) {
    B.wipeT -= dt;
    if (B.wipeT <= 0) {
      party.forEach(p => { p.down = 0; p.hp = p.maxHp * 0.7; p.healGlow = 0.6; });
      addFx({ type: 'ring', x: W * 0.3, y: groundY - 10, r0: 10, r1: 200, life: 0.8, max: 0.8, color: '255,255,255' });
    }
  }
}

function enemyStrike(e) {
  const alive = party.filter(p => !p.down);
  if (!alive.length) return;
  const tank = alive.find(p => p.key === 'knight');
  const target = (tank && Math.random() < 0.45) ? tank : pick(alive);
  e.anim = 1;
  const dmg = Math.round(e.atk * rnd(0.85, 1.15));
  at(0.16, () => {
    if (target.down) return;
    target.hp -= dmg;
    target.hurt = 0.35;
    addNum(target.x, target.y - heroH * 0.95, dmg, 'hit');
    spark(target.x, target.y - heroH * 0.5, 6, '#ff8a8a', 200);
    B.shake = Math.max(B.shake, e.boss ? 7 : 3.4);
    Audio2.play('hit');
    if (target.hp <= 0) {
      target.hp = 0; target.down = 5;
      toast(target.name + ' 쓰러짐! 5초 후 부활합니다');
    }
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function drawSprite(key, x, yBase, h, opt) {
  const img = IMG[key];
  opt = opt || {};
  if (!img) {
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = opt.fallback || '#5a6b93';
    const w = h * 0.62;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x - w / 2, yBase - h, w, h, 10) : ctx.rect(x - w / 2, yBase - h, w, h);
    ctx.fill();
    ctx.restore();
    return;
  }
  const w = img.width / img.height * h;
  ctx.save();
  if (opt.flash) ctx.filter = 'brightness(1.85) saturate(.55)';
  else if (opt.tint === 'gold') ctx.filter = 'sepia(1) saturate(3.4) hue-rotate(-12deg) brightness(1.12)';
  else if (opt.tint === 'crystal') ctx.filter = 'hue-rotate(150deg) saturate(1.7) brightness(1.15)';
  else if (opt.gray) ctx.filter = 'grayscale(.85) brightness(.8)';
  if (opt.rot) {
    ctx.translate(x, yBase - h * 0.35);
    ctx.rotate(opt.rot);
    ctx.globalAlpha = opt.alpha === undefined ? 1 : opt.alpha;
    ctx.drawImage(img, -w / 2, -h * 0.5, w, h);
  } else {
    ctx.globalAlpha = opt.alpha === undefined ? 1 : opt.alpha;
    ctx.drawImage(img, x - w / 2, yBase - h, w, h);
  }
  ctx.restore();
}

function drawBG() {
  const ch = Math.floor((state.stage - 1) / 10);
  const key = ch % 2 === 0 ? 'bg_forest' : 'bg_castle';
  const img = IMG[key];
  if (img) {
    // cover the canvas, panning slowly inside the overflow so edges never repeat
    const scale = Math.max(W / img.width, (H * 1.06) / img.height);
    const dw = img.width * scale, dh = img.height * scale;
    const over = Math.max(0, dw - W);
    const kick = B.bgKick > 0 ? -Math.pow(B.bgKick, 1.6) * W * 0.22 : 0;
    const x0 = clamp(-over * 0.5 + Math.sin(B.t * 0.07) * over * 0.36 + kick, -over, 0);
    const y0 = H - dh;
    ctx.save();
    ctx.drawImage(img, x0, y0, dw, dh);
    ctx.restore();
    if (B.mode === 'dungeon') {
      ctx.save();
      ctx.fillStyle = B.dgn && B.dgn.type === 'gold' ? 'rgba(90,60,0,.34)' : B.dgn && B.dgn.type === 'dia' ? 'rgba(0,40,90,.34)' : 'rgba(80,0,0,.28)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#101b33'); g.addColorStop(1, '#050810');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // ambient particles
  const amb = ch % 2 === 0 ? 'rgba(160,235,255,' : 'rgba(255,180,90,';
  for (let i = 0; i < 26; i++) {
    const sp = 10 + (i % 5) * 6;
    const x = ((i * 137 + B.t * sp) % (W + 60)) - 30;
    const y = H * 0.18 + ((i * 91 + Math.sin(B.t * 0.7 + i) * 30) % (H * 0.62));
    const a = 0.18 + 0.22 * (0.5 + 0.5 * Math.sin(B.t * 2 + i));
    ctx.fillStyle = amb + a + ')';
    ctx.beginPath();
    ctx.arc(x, y, ch % 2 === 0 ? 1.8 : 1.5, 0, 6.283);
    ctx.fill();
  }
}

function drawGround() {
  // light pool on the fighting floor
  ctx.save();
  const pool = ctx.createRadialGradient(W * 0.45, groundY + 10, 20, W * 0.45, groundY + 10, W * 0.46);
  pool.addColorStop(0, 'rgba(120,190,255,.16)');
  pool.addColorStop(0.6, 'rgba(90,150,220,.05)');
  pool.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = pool;
  ctx.beginPath();
  ctx.ellipse(W * 0.45, groundY + 18, W * 0.46, H * 0.13, 0, 0, 6.283);
  ctx.fill();
  ctx.restore();

  const g = ctx.createLinearGradient(0, groundY - 6, 0, H);
  g.addColorStop(0, 'rgba(8,14,26,.08)');
  g.addColorStop(0.18, 'rgba(6,10,20,.55)');
  g.addColorStop(0.55, 'rgba(4,7,14,.82)');
  g.addColorStop(1, 'rgba(2,4,9,.96)');
  ctx.fillStyle = g;
  ctx.fillRect(0, groundY - 6, W, H - groundY + 6);

  // glowing floor line
  const lg = ctx.createLinearGradient(0, 0, W, 0);
  lg.addColorStop(0, 'rgba(120,190,255,0)');
  lg.addColorStop(0.25, 'rgba(150,210,255,.30)');
  lg.addColorStop(0.6, 'rgba(255,210,140,.20)');
  lg.addColorStop(1, 'rgba(120,190,255,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(0, groundY - 1.5, W, 1.8);

  // floor tiles / sparkles
  for (let i = 0; i < 26; i++) {
    const x = ((i * 89 + B.t * 12) % (W + 60)) - 30;
    const y = groundY + 10 + (i % 7) * ((H - groundY) / 8);
    const a = 0.035 + (i % 4) * 0.022;
    ctx.fillStyle = 'rgba(150,200,255,' + a + ')';
    ctx.fillRect(x, y, 22 + (i % 3) * 14, 1.1);
  }
  // distant fog band
  const fog = ctx.createLinearGradient(0, groundY - H * 0.05, 0, groundY + 2);
  fog.addColorStop(0, 'rgba(120,180,255,0)');
  fog.addColorStop(1, 'rgba(130,190,255,.10)');
  ctx.fillStyle = fog;
  ctx.fillRect(0, groundY - H * 0.05, W, H * 0.05 + 2);
}

function drawForeground() {
  const sway = B.t * 0.8;
  ctx.save();
  ctx.strokeStyle = 'rgba(3,6,12,.92)';
  ctx.lineCap = 'round';
  for (let i = 0; i < 40; i++) {
    const x = (i * 47 + 12) % (W + 40) - 20;
    const base = H + 4;
    const hgt = 14 + ((i * 37) % 26);
    const lean = Math.sin(sway + i * 0.7) * 5;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(x, base);
    ctx.quadraticCurveTo(x + lean * 0.4, base - hgt * 0.6, x + lean, base - hgt);
    ctx.stroke();
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.moveTo(x + 6, base);
    ctx.quadraticCurveTo(x + 6 + lean * 0.6, base - hgt * 0.45, x + 8 + lean * 1.3, base - hgt * 0.7);
    ctx.stroke();
  }
  ctx.restore();
}

function drawShadow(x, y, w, a) {
  ctx.save();
  const g = ctx.createRadialGradient(x, y, 2, x, y, w);
  g.addColorStop(0, 'rgba(0,0,0,' + (a || 0.5) + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(x, y, w, w * 0.28, 0, 0, 6.283);
  ctx.fill();
  ctx.restore();
}

function drawParty() {
  party.forEach((p, i) => {
    const lunge = easeOut(Math.min(1, p.anim)) * (p.reach ? 30 : 6);
    const bob = Math.sin(B.t * 2.2 + p.bob) * 2.4;
    const x = p.x + lunge * (p.key === 'knight' ? 1 : 0.35);
    const yb = groundY + 4 + bob;
    const hh = heroH * (p.key === 'knight' ? 1.0 : 0.94);
    if (p.down > 0) {
      drawShadow(x, groundY + 4, hh * 0.30, 0.35);
      drawSprite(p.img, x, groundY + 2, hh * 0.7, { rot: -1.35, alpha: 0.42, gray: true });
      ctx.save();
      ctx.font = '900 10px "Noto Sans KR",sans-serif';
      ctx.fillStyle = 'rgba(255,140,150,.9)';
      ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(p.down) + '초', x, groundY - 6);
      ctx.restore();
      return;
    }
    drawShadow(x, groundY + 4, hh * 0.34, 0.5);
    // heal glow
    if (p.healGlow > 0) {
      ctx.save();
      const g = ctx.createRadialGradient(x, yb - hh * 0.45, 4, x, yb - hh * 0.45, hh * 0.62);
      g.addColorStop(0, 'rgba(255,230,150,' + (0.28 * p.healGlow) + ')');
      g.addColorStop(1, 'rgba(255,230,150,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, yb - hh * 0.45, hh * 0.62, 0, 6.283); ctx.fill();
      ctx.restore();
    }
    drawSprite(p.img, x, yb, hh, { flash: p.hurt > 0.22 });
    // name tag
    ctx.save();
    ctx.font = '800 9px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    const label = p.name;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(6,10,20,.62)';
    ctx.beginPath();
    (ctx.roundRect ? ctx.roundRect(x - tw / 2 - 6, yb + 2, tw + 12, 13, 6) : ctx.rect(x - tw / 2 - 6, yb + 2, tw + 12, 13));
    ctx.fill();
    ctx.fillStyle = p.color;
    ctx.fillText(label, x, yb + 11.5);
    ctx.restore();
    // hp bar
    const bw = Math.min(46, hh * 0.42), bh = 3;
    const bx = x - bw / 2, by = yb + 17;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(bx, by, bw, bh);
    const ratio = clamp(p.hp / p.maxHp, 0, 1);
    ctx.fillStyle = ratio > 0.45 ? '#5ee08a' : ratio > 0.2 ? '#ffc94a' : '#ff5566';
    ctx.fillRect(bx, by, bw * ratio, bh);
  });
}

function drawEnemy() {
  const e = B.enemy;
  if (!e) return;
  const h = spriteH(e);
  const lunge = e.anim > 0 && e.atkT < 0.45 ? -22 * Math.sin(e.anim * Math.PI) : 0;
  const x = e.x + lunge;
  const bob = e.boss ? Math.sin(B.t * 1.6) * 3 : Math.sin(B.t * 2 + e.wander) * 2.2;
  const yb = groundY + 4 + bob;
  const dyingK = e.dying > 0 ? clamp(e.dying / 0.52, 0, 1) : 1;
  drawShadow(x, groundY + 4, h * (e.boss ? 0.44 : 0.34), 0.55 * dyingK);
  if (e.boss) {
    ctx.save();
    const g = ctx.createRadialGradient(x, groundY - h * 0.42, 10, x, groundY - h * 0.42, h * 0.75);
    const col = e.spr === 'mob_dragon' ? '255,90,60' : e.spr === 'mob_darkknight' ? '160,80,255' : '255,190,90';
    g.addColorStop(0, 'rgba(' + col + ',.30)');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, groundY - h * 0.42, h * 0.75, 0, 6.283); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  if (dyingK < 1) ctx.globalAlpha = dyingK;
  const scaleY = 1 + (1 - dyingK) * 0.12;
  ctx.translate(x, yb);
  ctx.scale(1, scaleY);
  ctx.translate(-x, -yb);
  drawSprite(e.spr, x, yb, h * (0.96 + 0.04 * dyingK), {
    flash: e.hurt > 0, tint: e.tint, rot: e.dying > 0 ? (1 - dyingK) * 0.5 : 0,
    alpha: dyingK < 1 ? dyingK : 1
  });
  ctx.restore();
  if (!e.boss && e.hp > 0 && e.dying <= 0) {
    const bw = Math.min(70, h * 0.7), bh = 4;
    const bx = x - bw / 2, by = yb - h - 9;
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    ctx.fillStyle = '#3a1520';
    ctx.fillRect(bx, by, bw, bh);
    const rr = clamp(e.hp / e.maxHp, 0, 1);
    const g2 = ctx.createLinearGradient(bx, by, bx + bw, by);
    g2.addColorStop(0, '#ff8a5c'); g2.addColorStop(1, '#e0203c');
    ctx.fillStyle = g2;
    ctx.fillRect(bx, by, bw * rr, bh);
    ctx.font = '800 8px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,220,220,.9)';
    ctx.fillText(e.name, x, by - 4);
  }
}

function drawProjectiles() {
  B.projs.forEach(pr => {
    ctx.save();
    if (pr.type === 'arrow') {
      const ang = Math.atan2(pr.ty - pr.sy, pr.tx - pr.sx);
      ctx.translate(pr.x, pr.y);
      ctx.rotate(ang);
      const g = ctx.createLinearGradient(-26, 0, 8, 0);
      g.addColorStop(0, 'rgba(150,255,140,0)');
      g.addColorStop(1, 'rgba(200,255,180,.95)');
      ctx.strokeStyle = g; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(6, 0); ctx.stroke();
      ctx.fillStyle = '#eaffd8';
      ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(2, -3.4); ctx.lineTo(2, 3.4); ctx.closePath(); ctx.fill();
    } else if (pr.type === 'fire') {
      const r = 11 + Math.sin(B.t * 26) * 2;
      const g = ctx.createRadialGradient(pr.x, pr.y, 1, pr.x, pr.y, r * 2.6);
      g.addColorStop(0, 'rgba(255,255,220,.98)');
      g.addColorStop(0.35, 'rgba(255,180,80,.9)');
      g.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, r * 2.6, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,235,.95)';
      ctx.beginPath(); ctx.arc(pr.x, pr.y, r * 0.55, 0, 6.283); ctx.fill();
    } else {
      const g = ctx.createRadialGradient(pr.x, pr.y, 1, pr.x, pr.y, 18);
      g.addColorStop(0, 'rgba(255,255,240,1)');
      g.addColorStop(0.4, 'rgba(255,226,150,.85)');
      g.addColorStop(1, 'rgba(255,200,80,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, 18, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,190,.75)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, 9, 0, 6.283); ctx.stroke();
    }
    ctx.restore();
  });
}

function drawFx() {
  B.fx.forEach(f => {
    const k = 1 - f.life / f.max;
    ctx.save();
    if (f.type === 'slash') {
      ctx.globalAlpha = (1 - k) * 0.95;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = f.w * (1 - k * 0.6);
      ctx.lineCap = 'round';
      ctx.shadowColor = f.color; ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.len * (0.4 + k * 0.7), f.a - 0.9, f.a + 0.9);
      ctx.stroke();
      ctx.globalAlpha *= 0.6;
      ctx.lineWidth *= 0.4;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.len * (0.55 + k * 0.9), f.a - 0.7, f.a + 0.5);
      ctx.stroke();
    } else if (f.type === 'ring') {
      const r = lerp(f.r0, f.r1, easeOut(k));
      ctx.globalAlpha = (1 - k) * 0.9;
      ctx.strokeStyle = 'rgba(' + f.color + ',1)';
      ctx.lineWidth = 3 * (1 - k) + 0.6;
      ctx.shadowColor = 'rgba(' + f.color + ',.9)'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.ellipse(f.x, f.y, r, r * 0.55, 0, 0, 6.283); ctx.stroke();
    } else if (f.type === 'spark') {
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = 'rgba(' + f.color + ',1)';
      ctx.beginPath(); ctx.arc(f.x, f.y, 16 * (1 - k) + 3, 0, 6.283); ctx.fill();
    } else if (f.type === 'beam') {
      ctx.globalAlpha = (1 - k) * 0.95;
      ctx.strokeStyle = 'rgba(' + f.color + ',1)';
      ctx.lineWidth = f.w * (1 - k * 0.7);
      ctx.shadowColor = 'rgba(' + f.color + ',1)'; ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.moveTo(f.x1, f.y1);
      const steps = 8;
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        ctx.lineTo(lerp(f.x1, f.x2, t), lerp(f.y1, f.y2, t) + Math.sin(t * 12 + B.t * 40) * 7 * (1 - t));
      }
      ctx.stroke();
    } else if (f.type === 'meteor') {
      const y = lerp(-80, f.y, Math.min(1, k / 0.45));
      ctx.globalAlpha = k < 0.9 ? 1 : (1 - k) * 6;
      const g = ctx.createRadialGradient(f.x, y, 4, f.x, y, 46);
      g.addColorStop(0, 'rgba(255,255,220,1)');
      g.addColorStop(0.4, 'rgba(255,160,60,.9)');
      g.addColorStop(1, 'rgba(255,60,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(f.x, y, 46, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(255,140,60,.6)'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(f.x + 14, y - 60); ctx.lineTo(f.x, y); ctx.stroke();
    } else if (f.type === 'holyaura') {
      ctx.globalAlpha = (1 - k) * 0.8;
      for (let i = 0; i < 3; i++) {
        const rr = (k * 120 + i * 30) % 120;
        ctx.strokeStyle = 'rgba(255,235,170,' + ((1 - k) * 0.6) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(f.x, f.y, rr, rr * 0.6, 0, 0, 6.283); ctx.stroke();
      }
      const g = ctx.createLinearGradient(f.x, f.y - 120, f.x, f.y);
      g.addColorStop(0, 'rgba(255,240,190,0)');
      g.addColorStop(0.55, 'rgba(255,225,140,' + (0.26 * (1 - k)) + ')');
      g.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = g;
      ctx.fillRect(f.x - 55, f.y - 130, 110, 130);
    }
    ctx.restore();
  });
}

function drawParticles() {
  B.parts.forEach(q => {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (0.5 + a * 0.7), 0, 6.283); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawHits() {
  B.hits.forEach(h => {
    const k = clamp(h.life / h.max, 0, 1);
    const pop = h.life > h.max - 0.09 ? 1 + (1 - (h.max - h.life) / 0.09) * 0.0 : 1;
    const scale = h.scale * (0.86 + Math.min(0.14, (1 - k) * 0.9));
    ctx.save();
    ctx.globalAlpha = k > 0.35 ? 1 : k / 0.35;
    ctx.translate(h.x, h.y);
    ctx.scale(scale, scale);
    const big = h.crit || h.kind === 'gold';
    const fs = big ? clamp(H * 0.031, 19, 31) : clamp(H * 0.024, 15, 24);
    ctx.font = '900 ' + fs + 'px "Black Han Sans","Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    if (h.kind === 'heal') {
      ctx.fillStyle = '#8dffb0';
      ctx.strokeStyle = 'rgba(4,30,14,.9)';
    } else if (h.kind === 'gold') {
      ctx.fillStyle = '#ffe066';
      ctx.strokeStyle = 'rgba(80,50,0,.95)';
    } else if (h.kind === 'dia') {
      ctx.fillStyle = '#9be8ff';
      ctx.strokeStyle = 'rgba(0,40,70,.95)';
    } else if (h.kind === 'hit') {
      ctx.fillStyle = '#ff9a9a';
      ctx.strokeStyle = 'rgba(60,0,10,.95)';
    } else if (h.crit) {
      ctx.fillStyle = '#fff1a8';
      ctx.strokeStyle = 'rgba(120,40,0,.95)';
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = 'rgba(10,16,32,.92)';
    }
    if (h.crit) {
      ctx.shadowColor = 'rgba(255,190,60,.9)';
      ctx.shadowBlur = 16;
    }
    ctx.lineWidth = 4;
    ctx.strokeText(h.txt, 0, 0);
    ctx.fillText(h.txt, 0, 0);
    if (h.crit) {
      ctx.globalAlpha *= 0.9;
      ctx.font = '900 ' + Math.max(8, fs * 0.4) + 'px "Noto Sans KR",sans-serif';
      ctx.fillStyle = '#ff9a3d';
      ctx.strokeStyle = 'rgba(60,20,0,.9)';
      ctx.lineWidth = 2.5;
      ctx.strokeText('CRITICAL', 0, fs * 0.52);
      ctx.fillText('CRITICAL', 0, fs * 0.52);
    }
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

function drawStageFlash() {
  if (B.stageFlash <= 0) return;
  ctx.save();
  ctx.globalAlpha = B.stageFlash * 0.8;
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, 'rgba(120,200,255,0)');
  g.addColorStop(0.5, 'rgba(200,235,255,.55)');
  g.addColorStop(1, 'rgba(120,200,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(B.sx, B.sy);
  drawBG();

let uiTab = 'grow';

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2100);
}

function openModal(o) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  const btns = (o.buttons || [{ label: '닫기' }]).map((b, i) =>
    '<button class="' + (b.primary ? 'primary' : '') + '" data-b="' + i + '">' + b.label + '</button>').join('');
  back.innerHTML =
    '<div class="modal">' +
    '<div class="m-title">' + o.title + '</div>' +
    (o.sub ? '<div class="m-sub">' + o.sub + '</div>' : '') +
    (o.body || '') +
    '<div class="m-btns">' + btns + '</div>' +
    '</div>';
  document.body.appendChild(back);
  requestAnimationFrame(() => back.classList.add('show'));
  const close = () => {
    back.classList.remove('show');
    setTimeout(() => back.remove(), 220);
  };
  $$('[data-b]', back).forEach(btn => {
    btn.addEventListener('click', () => {
      const b = (o.buttons || [{ label: '닫기' }])[+btn.dataset.b];
      Audio2.play('click');
      if (b && b.onClick) { if (b.onClick(close) === false) return; }
      close();
    });
  });
  if (o.autoClose) setTimeout(close, o.autoClose);
  return { close, el: back };
}

/* ---------- HUD ---------- */

  const c = $('#combo');
  if (B.combo >= 8 && B.comboT > 0) { c.classList.add('on'); c.querySelector('b').textContent = B.combo; }
  else c.classList.remove('on');

  else $('#dgnTimer').classList.remove('on');
  // tab dots
  $$('.tab').forEach(t => {

    if (k === 'gacha') has = state.dia >= 300 || state.legendTickets > 0;
    if (k === 'shop') has = !state.own.starter;

  });
}

/* ---------- party hp sync ---------- */
function syncParty(initial) {
  const st = heroStats();
  party.forEach(p => {
    const nmax = Math.round(st.hp * p.hpf);
    if (initial || !p.maxHp) { p.maxHp = nmax; p.hp = nmax; }
    else {
      const r = clamp(p.hp / p.maxHp, 0, 1);
      p.maxHp = nmax;
      p.hp = Math.max(1, Math.round(nmax * r));
    }
  });
  renderPartyCards();
}

function renderPartyCards() {
  const wrap = $('#party');
  if (!wrap || wrap.children.length !== party.length) {
    wrap.innerHTML = party.map(p =>
      '<div class="pcard" data-k="' + p.key + '">' +
      '<div class="pav"><img src="' + ASSETS[p.img] + '" alt=""></div>' +
      '<div class="pnm">' + p.name.slice(0, 2) + '</div>' +
      '<div class="pbar"><i></i></div>' +
      '</div>').join('');
  }
  party.forEach(p => {
    const el = wrap.querySelector('[data-k="' + p.key + '"]');
    if (!el) return;
    const r = clamp(p.hp / p.maxHp, 0, 1);
    el.querySelector('.pbar > i').style.width = (r * 100) + '%';
    el.classList.toggle('down', p.down > 0);
    el.classList.toggle('low', r < 0.3);
  });
}

/* ---------- mission ---------- */
function updateMission(force) {
  const m = missionAt(state.mission.i);
  const [c, need] = m.prog();
  const done = c >= need;
  const el = $('#mission');
  $('#missionTxt').innerHTML = m.t.replace(/(\d[\d,]*)/g, '<em>$1</em>');
  $('#missionRew').textContent = '💎 ' + fmtFull(m.rew);
  $('#missionBar').style.width = clamp(c / need, 0, 1) * 100 + '%';
  const btn = $('#missionBtn');
  btn.disabled = !done;
  btn.textContent = done ? '보상 받기' : '진행중';
  el.classList.toggle('ready', done);
  if (force) $('#missionTxt').dataset.i = state.mission.i;
}
function claimMission() {
  const m = missionAt(state.mission.i);
  const [c, need] = m.prog();
  if (c < need) return;
  state.dia += m.rew;
  state.stats.claims = (state.stats.claims || 0) + 1;
  state.mission.i++;
  state.mission.done++;
  Audio2.play('levelup');
  toast('미션 완료! 다이아 +' + fmtFull(m.rew));
  sparkBurst();
  updateHud(); updateMission(true); save();
  renderTab();
}

/* ---------- growth ---------- */
function buyStat(key, n) {
  let bought = 0;
  const lim = key === 'crit' ? () => 5 + 0.35 * state.lv.crit < 70 : key === 'cdmg' ? () => 150 + 4 * state.lv.cdmg < 500 : () => true;
  const target = n === 'max' ? 300 : parseInt(n, 10);
  for (let i = 0; i < target; i++) {
    if (!lim()) break;
    const c = costOf(key, state.lv[key]);
    if (state.gold < c) break;
    state.gold -= c; state.lv[key]++; bought++;
  }
  if (!bought) { toast('골드가 부족합니다'); Audio2.play('fail'); return; }
  Audio2.play('buy');
  toast(STATS[key].name + ' +' + bought + ' 강화!');
  syncParty(false);
  updateHud(); renderTab(); updateMission(); save();
}

/* ---------- gacha ---------- */
const RATES = [{ g: 1, p: 44.5 }, { g: 2, p: 30 }, { g: 3, p: 17 }, { g: 4, p: 6.5 }, { g: 5, p: 1.8 }, { g: 6, p: 0.2 }];
function rollGrade(forceRare) {
  let g = 1, r = Math.random() * 100, acc = 0;
  for (const it of RATES) { acc += it.p; if (r < acc) { g = it.g; break; } }
  if (forceRare && g < 3) g = 3;
  return g;
}
function rollItem() {
  const forceLegend = state.gacha.legendPity >= 59;
  const forceRare = state.gacha.rarePity >= 9 && !forceLegend;
  let grade;
  if (forceLegend) grade = Math.random() < 0.1 ? 6 : 5;
  else grade = rollGrade(forceRare);
  const tr = Math.random();
  const type = tr < 0.45 ? 'weapon' : tr < 0.8 ? 'armor' : 'skill';
  const pool = ITEMS.filter(it => it.type === type && it.grade === grade);
  const d = pick(pool);
  state.gacha.legendPity = grade >= 5 ? 0 : state.gacha.legendPity + 1;
  state.gacha.rarePity = grade >= 3 ? 0 : state.gacha.rarePity + 1;
  state.gacha.total++;
  state.stats.pulls++;
  return obtainItem(d);
}
const SLOT_OF = type => type === 'weapon' ? 'weapon' : type === 'armor' ? 'armor' : 'skill';
function obtainItem(d) {
  const existing = state.inv.find(it => it.id === d.id);
  if (existing) {
    if ((existing.lv || 1) < 5) {
      existing.lv = (existing.lv || 1) + 1;
      return { def: d, item: existing, tag: 'up', label: '강화' };
    }
    const gain = d.grade * 25;
    state.dia += gain;
    return { def: d, item: null, tag: 'gone', label: '분해', dia: gain };
  }
  const it = { uid: state.uid++, id: d.id, lv: 1 };
  state.inv.push(it);
  autoEquipBest(d.type);
  return { def: d, item: it, tag: 'new', label: 'NEW' };
}
function autoEquipBest(type) {
  let best = null, bestScore = -1;
  state.inv.forEach(it => {
    const d = ITEM[it.id];
    if (!d || d.type !== type) return;
    const score = d.grade * 100 + (it.lv || 1) * 8;
    if (score > bestScore) { bestScore = score; best = it; }
  });
  if (best) state.equip[SLOT_OF(type)] = best.uid;
}

function pull(count) {
  if (B.mode === 'dungeon') { toast('던전 중에는 소환할 수 없습니다'); return; }
  const ticket = count === 'ticket';
  const n = ticket ? 1 : count;
  const cost = count === 11 ? 3000 : 300;
  if (ticket) {
    if (state.legendTickets <= 0) { toast('전설 확정권이 없습니다'); return; }
    state.legendTickets--;
  } else {
    if (state.dia < cost) { toast('다이아가 부족합니다'); switchTab('shop'); return; }
    state.dia -= cost;
    state.stats.spent += cost;
  }
  const results = [];
  if (ticket) {
    const pool = ITEMS.filter(it => it.grade >= 5);
    results.push(obtainItem(pick(pool)));
  } else {
    for (let i = 0; i < n; i++) results.push(rollItem());
    if (n === 11) {
      const hasRare = results.some(r => r.def.grade >= 3);
      if (!hasRare) {
        const last = results[results.length - 1];
        const pool2 = ITEMS.filter(it => it.grade === 3 && it.type === last.def.type);
        results[results.length - 1] = obtainItem(pool2[0]);
      }
    }
  }
  save(); syncParty(false); updateHud();
  showGachaResult(results, count);
  renderTab();
}

function showGachaResult(results, count) {
  let best = 0, news = 0, ups = 0, gones = 0;
  const cards = results.map((r, i) => {
    best = Math.max(best, r.def.grade);
    if (r.tag === 'new') news++;
    if (r.tag === 'up') ups++;
    if (r.tag === 'gone') gones++;
    const g = GRADES[r.def.grade];
    const cls = r.def.grade === 6 ? 'res-myth' : r.def.grade === 5 ? 'res-legend' : '';
    return '<div class="res-card ' + cls + '" style="border-color:' + hexA(g.c, .65) + ';animation-delay:' + (i * 0.05) + 's">' +
      (r.def.grade >= 5 ? '<div class="rc-rainbow"></div>' : '') +
      '<div class="rc-ico">' + r.def.icon + '</div>' +
      '<div class="rc-name" style="color:' + g.c + '">' + r.def.name + '</div>' +
      '<div class="rc-g" style="color:' + hexA(g.c, .9) + '">' + g.n + '</div>' +
      '<div class="rc-tag ' + r.tag + '">' + (r.tag === 'gone' ? '+' + r.dia + '💎' : r.label + (r.item && r.item.lv > 1 ? ' +' + (r.item.lv - 1) : '')) + '</div>' +
      '</div>';
  }).join('');
  const title = count === 11 ? '11회 소환 결과' : count === 'ticket' ? '전설 확정 소환' : '소환 결과';
  openModal({
    title: title,
    sub: (best >= 5 ? '<b style="color:#ffd98a">✨ 전설 이상 등장!</b> ' : '') + '신규 ' + news + ' · 강화 ' + ups + ' · 분해 ' + gones,
    body: '<div class="gacha-grid ' + (count === 1 || count === 'ticket' ? 'one' : '') + '">' + cards + '</div>',
    buttons: [{ label: '확인', primary: true }]
  });
  if (best >= 5) { Audio2.play('legend'); B.shake = 8; sparkBurst(); }
  else Audio2.play('gacha');
}

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

/* ---------- shop ---------- */
function openPurchase(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  openModal({
    title: p.name,
    sub: '테스트 결제 · 실제로 청구되지 않습니다',
    body: '<div style="text-align:center;font-size:38px;margin:8px 0">' + p.icon + '</div>' +
      p.lines.map(l => '<div class="rewline"><span>🎁</span><b style="font-size:11px;color:#dfe8f8">' + l + '</b></div>').join('') +
      '<div class="rewline"><span>결제 금액</span><b>₩' + p.price.toLocaleString('ko-KR') + '</b></div>',
    buttons: [{ label: '결제하기', primary: true, onClick: () => { processPayment(p); } }, { label: '취소' }]
  });
}
function openDiamondPurchase(i) {
  const d = DIAMONDS[i];
  openModal({
    title: '다이아 ' + fmtFull(d.dia + d.bonus) + '개',
    sub: '테스트 결제 · 실제로 청구되지 않습니다',
    body: '<div style="text-align:center;font-size:38px;margin:10px 0">💎</div>' +
      '<div class="rewline"><span>기본 다이아</span><b>' + fmtFull(d.dia) + '</b></div>' +
      (d.bonus ? '<div class="rewline"><span>보너스</span><b>+' + fmtFull(d.bonus) + '</b></div>' : '') +
      '<div class="rewline"><span>결제 금액</span><b>₩' + d.price.toLocaleString('ko-KR') + '</b></div>',
    buttons: [{ label: '결제하기', primary: true, onClick: () => { processPayment({ name: '다이아 ' + d.dia, price: d.price, grants: { dia: d.dia + d.bonus } }); } }, { label: '취소' }]
  });
}
function processPayment(p) {
  const m = openModal({
    title: '결제 진행 중',
    sub: '잠시만 기다려 주세요',
    body: '<div class="paybox"><div class="spin"></div><div class="pt">' + p.name + '</div><div class="ps">₩' + p.price.toLocaleString('ko-KR') + ' · 모의 결제 승인 중…</div></div>',
    buttons: []
  });
  setTimeout(() => {
    m.close();
    applyProduct(p);
  }, 1500);
}
function applyProduct(p) {
  const g = p.grants || {};
  let txt = [];
  if (g.dia) { state.dia += g.dia; txt.push('다이아 +' + fmtFull(g.dia)); }
  if (g.gold) { state.gold += g.gold; txt.push('골드 +' + fmtFull(g.gold)); }
  if (g.legend) { state.legendTickets += g.legend; txt.push('전설 확정권 +' + g.legend); }
  if (g.pass) { state.own.pass = true; state.speed = 2; txt.push('2배속 해금'); }
  if (g.monthly) { state.own.monthly = true; state.monthlyUntil = now() + 30 * 86400000; txt.push('30일 축복 시작'); }
  if (g.legendEquip) {
    const pool = ITEMS.filter(it => it.grade === 5);
    const r = obtainItem(pick(pool));
    txt.push('전설 장비: ' + r.def.name);
  }
  if (p.id === 'starter') state.own.starter = true;
  if (p.id === 'legend') state.own.legend = true;
  Audio2.play('legend');
  syncParty(false);
  updateHud(); renderTab(); save();
  openModal({
    title: '구매 완료!',
    sub: '보상이 지급되었습니다',
    body: '<div style="text-align:center;font-size:40px;margin:8px 0">🎉</div>' +
      txt.map(t => '<div class="rewline"><span>🎁</span><b style="font-size:11px;color:#dfe8f8">' + t + '</b></div>').join(''),
    buttons: [{ label: '확인', primary: true }]
  });
}

/* ---------- help ---------- */
function openHelp() {
  openModal({
    title: '아르카디아 기사단 키우기 II',
    sub: '4인 파티가 자동으로 싸우는 방치형 RPG',
    body:
      '<ul class="help-list">' +
      '<li><b>⚔️</b>기사·궁수·대마법사·성직자 4인 파티가 실시간으로 전투합니다.</li>' +
      '<li><b>💥</b>치명타가 터지면 화면이 멈추고 다단히트 데미지가 쏟아집니다.</li>' +
      '<li><b>📜</b>화면 아래 미션 바에서 보상을 받으면 다음 미션이 이어집니다.</li>' +
      '<li><b>🎁</b>뽑기로 장비를 모으고, 같은 장비는 자동 강화(+4)됩니다.</li>' +
      '<li><b>🏅</b>던전 3종으로 골드·다이아·계급을 올리세요. 매일 3회 충전.</li>' +
      '<li><b>💾</b>자동 저장되며, 접속이 끊긴 동안에도 보상이 쌓입니다.</li>' +
      '</ul>',
    buttons: [{ label: '모험 시작', primary: true }]
  });
}

/* ---------- offline ---------- */
const dayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function checkDaily() {
  const k = dayKey();
  if (state.dgn.day !== k) {
    state.dgn.day = k; state.dgn.gold = 3; state.dgn.dia = 3; state.dgn.promote = 1;
  }
  if (state.own.monthly && state.monthlyUntil > now() && state.lastMonthlyClaim !== k) {
    state.lastMonthlyClaim = k;
    state.dia += 200;
    setTimeout(() => toast('👑 월정액 축복: 다이아 200 지급'), 1400);
  }
}
function offlineReward(sec) {
  const st = heroStats();
  const killTime = Math.max(1.6, enemyHp(state.stage) / Math.max(1, st.dps));
  const rate = goldPerKill(state.stage) * KILLS_PER_STAGE / Math.max(1, killTime * KILLS_PER_STAGE);
  let gold = Math.floor(rate * sec * 0.62);
  if (state.own.monthly) gold = Math.floor(gold * 1.2);
  gold = Math.max(gold, Math.floor(12 * sec / 60));
  const dia = state.own.monthly ? Math.floor(sec / 3600 * 12) : Math.floor(sec / 3600 * 4);
  return { gold, dia };
}
function showOffline(sec, rew) {
  const hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60);
  const timeStr = (hh > 0 ? hh + '시간 ' : '') + mm + '분';
  openModal({
    title: '오프라인 보상',
    sub: timeStr + ' 동안 파티가 자동 사냥을 계속했습니다',
    body: '<div class="offline-hero"><div class="oh-ico">🌙</div>' +
      '<div class="oh-gold">+' + fmtFull(rew.gold) + ' G</div>' +
      (rew.dia ? '<div class="oh-sub">+ ' + rew.dia + ' 💎 보너스</div>' : '') +
      '<div class="oh-sub">최대 12시간까지 누적됩니다</div></div>',
    buttons: [{ label: '보상 수령', primary: true }]
  });
  state.gold += rew.gold; state.stats.gold += rew.gold; state.dia += rew.dia;
  updateHud(); save();
}
function checkOffline() {
  const elapsed = (now() - (state.lastSeen || now())) / 1000;
  state.lastSeen = now();
  if (elapsed < 60) return;
  const sec = Math.min(elapsed, 12 * 3600);
  const rew = offlineReward(sec);
  save();
  setTimeout(() => showOffline(sec, rew), 400);
}

/* ---------- tabs ---------- */
function switchTab(name) {
  uiTab = name;
  $$('.tab').forEach(t => {
    t.classList.toggle('on', t.dataset.tab === name);
    if (t.dataset.tab === name) t.classList.remove('has');
  });
  Audio2.play('click');
  renderTab();
  if (name === 'gacha' || name === 'dungeon') updateHud();
}

/* ---------- loop ---------- */
let lastT = performance.now(), accSave = 0, accHud = 0, accMis = 0, accCards = 0;
function frame(ts) {
  let raw = (ts - lastT) / 1000;
  lastT = ts;
  if (!isFinite(raw) || raw < 0) raw = 0.016;
  raw = Math.min(0.06, raw);
  const spd = (state.own.pass && state.speed === 2) ? 2 : 1;
  const dt = raw * (B.mode === 'stage' ? spd : spd);
  updateBattle(dt);
  draw();
  accSave += raw; accHud += raw; accMis += raw; accCards += raw;
  if (accSave > 4) { accSave = 0; save(); }
  if (accHud > 0.2) { accHud = 0; updateHud(); }
  if (accMis > 0.4) { accMis = 0; updateMission(); }
  if (accCards > 0.25) { accCards = 0; renderPartyCards(); }
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
function bindUI() {
  $$('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  $('#missionBtn').addEventListener('click', claimMission);
  $('#helpBtn').addEventListener('click', openHelp);
  $('#muteBtn').addEventListener('click', () => {
    Audio2.init();
    const m = !Audio2.isMuted();
    Audio2.setMuted(m);
    state.muted = m; save(); updateHud();
    if (!m) Audio2.play('click');
  });
  $('#speedBtn').addEventListener('click', () => {
    if (!state.own.pass) {
      toast('2배속은 상점 패스를 구매하면 사용할 수 있습니다');
      switchTab('shop');
      return;
    }
    state.speed = state.speed === 2 ? 1 : 2;
    save(); updateHud();
    toast(state.speed === 2 ? '⚡ 2배속 전투!' : '1배속으로 변경');
  });
  $('#sideOpen').addEventListener('click', () => $('#sideCol').classList.toggle('open'));
  document.addEventListener('pointerdown', () => Audio2.init(), { once: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) save();
    else { lastT = performance.now(); checkOffline(); }
  });
  window.addEventListener('pagehide', save);
  window.addEventListener('resize', () => { resize(); });
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(cv.parentElement);
}

function showStageClear(st) {
  const el = $('#stageClear');
  $('#scSub').textContent = 'STAGE ' + st + ' · ' + stageName(st);
  el.classList.remove('on');
  void el.offsetWidth;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 1800);
}

function boot() {
  const had = load();
  checkDaily();
  if (!state.own.pass) state.speed = 1;
  Audio2.setMuted(!!state.muted);
  resize();
  bindUI();
  syncParty(true);
  updateHud();
  updateMission(true);
  renderTab();
  spawnStageEnemy();
  requestAnimationFrame(ts => { lastT = ts; requestAnimationFrame(frame); });
  if (had) checkOffline();
  else setTimeout(() => { toast('아르카디아 기사단에 오신 것을 환영합니다!'); openHelp(); }, 700);
  setInterval(() => { checkDaily(); updateHud(); }, 30000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { });
}

window.__ARC2 = { state: () => state, B, party, stats: heroStats, addNum, spawnStageEnemy };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();

</script>
