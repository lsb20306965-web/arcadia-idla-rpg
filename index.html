<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e18">
<title>아르카디아 기사단 키우기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;max-width:none;overflow:hidden}
body{
  background:#05060a;
  display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  color:#e9edf6;-webkit-font-smoothing:antialiased;user-select:none;
}
#app{
  position:relative;display:flex;width:100%;height:100dvh;max-width:none;overflow:hidden;
  background:#0b0e18;box-shadow:0 0 0 1px rgba(130,150,210,.12),0 30px 100px rgba(0,0,0,.9);
}
.battle-col{position:relative;flex:1 1 58%;min-width:0;display:flex;flex-direction:column;background:#080a12}
.side-col{
  flex:0 0 clamp(340px, 38%, 620px);width:38%;min-width:340px;max-width:620px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0e1220,#0a0d17);border-left:1px solid #242c47;min-height:0;
}

/* ---------- HUD ---------- */
.hud{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(180deg,#161c31,#0f1322);
  border-bottom:1px solid #242c47;z-index:6;flex:0 0 auto;
}
.hud-id{display:flex;align-items:center;gap:10px;min-width:0}
.crest{
  width:38px;height:38px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(160deg,#2a3352,#161c2e);border:1px solid #3c486e;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 16px rgba(120,160,255,.12);
}
.hud-title{font-size:13px;font-weight:800;letter-spacing:.02em;color:#eef3ff;display:flex;align-items:center;gap:7px}
.tag-live{
  font-size:8px;font-weight:900;letter-spacing:.1em;color:#7ef0c0;border:1px solid rgba(80,210,150,.45);
  background:rgba(30,120,90,.22);border-radius:4px;padding:1px 4px;animation:livePulse 2s infinite;
}
@keyframes livePulse{0%,100%{opacity:.55}50%{opacity:1}}
.hud-sub{font-size:11.5px;color:#9aa8c6;margin-top:2px}
.hud-sub b{color:#f2ce8a;font-variant-numeric:tabular-nums;font-size:12.5px}
.hud-right{display:flex;align-items:center;gap:7px}
.cur{
  display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;
  background:#0d1120;border:1px solid #26304c;border-radius:20px;padding:5px 12px 5px 8px;min-width:94px;justify-content:flex-end;
}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e3a93a 60%,#a06b12);box-shadow:inset 0 0 0 1.5px rgba(120,70,0,.35);flex:0 0 auto}
.gem{width:12px;height:12px;background:linear-gradient(160deg,#9fe4ff,#3ea6ff 55%,#1d63c8);transform:rotate(45deg);border-radius:2px;box-shadow:0 0 8px rgba(90,180,255,.6);flex:0 0 auto;margin:0 2px}
#goldTxt{color:#f4d68f}
#diaTxt{color:#9fdcff}
.icon-btn{
  width:32px;height:32px;border-radius:50%;border:1px solid #33405f;background:#141a2c;color:#9aa8c6;
  font-size:14px;font-weight:800;cursor:pointer;display:grid;place-items:center;
}
.icon-btn:active{background:#1e2740}

/* ---------- stage bar ---------- */
.stagebar{
  display:flex;align-items:center;gap:12px;padding:9px 16px;flex:0 0 auto;
  background:linear-gradient(180deg,#0f1322,#0c1020);border-bottom:1px solid #1c2338;
}
.sb-name{font-size:12px;font-weight:800;letter-spacing:.05em;color:#f0d9a4;white-space:nowrap}
.sb-area{font-size:10.5px;color:#7d89a5;margin-left:5px;font-weight:600}
.sb-prog{position:relative;flex:1;height:15px;border-radius:8px;background:#080b14;overflow:hidden;border:1px solid #232c46;max-width:420px;margin-left:auto}
#killFill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,#c8992f,#f6d98f);transition:width .2s;box-shadow:0 0 10px rgba(240,200,110,.35)}
#killTxt{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#0a0c14;letter-spacing:.03em;text-shadow:0 1px 0 rgba(255,255,255,.25)}

/* ---------- battle ---------- */
.battle-wrap{position:relative;flex:1 1 auto;min-height:0;background:#070912;overflow:hidden}
#battle{display:block;width:100%;height:100%}
[hidden]{display:none!important}
.timer-pill{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:11.5px;font-weight:800;
  background:rgba(60,12,18,.86);border:1px solid #a33a44;color:#ffd4d8;backdrop-filter:blur(4px);
  box-shadow:0 4px 18px rgba(0,0,0,.5);z-index:3;
}
.timer-pill b{color:#ff8b93;font-size:14px;font-variant-numeric:tabular-nums}
.timer-pill.dungeon{background:rgba(12,32,54,.9);border-color:#2f6f9e;color:#c8e8ff}
.timer-pill.dungeon b{color:#7ed0ff}

.toasts{position:absolute;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:4}
.toast{
  font-size:11.5px;font-weight:700;color:#ffeec9;background:rgba(16,20,34,.94);border:1px solid #3d4a70;
  padding:6px 14px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.55);
  animation:tIn .22s ease-out, tOut .3s ease-in 1.7s forwards;max-width:80%;text-align:center;
}
@keyframes tIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateY(-8px)}}

/* ---------- actions ---------- */
.actions{display:flex;gap:9px;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0c1020,#0a0d16);flex:0 0 auto;border-top:1px solid #1b2136}
.btn-boss{
  flex:1 1 auto;max-width:520px;height:44px;border:1px solid #8f3a3a;border-radius:12px;font-weight:800;font-size:13.5px;color:#ffe6e0;
  background:linear-gradient(180deg,#5c1f26,#3a1119);box-shadow:inset 0 1px 0 rgba(255,180,160,.18),0 3px 10px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.02em;cursor:pointer;
}
.btn-boss:active{transform:translateY(1px);filter:brightness(1.15)}
.btn-boss.cool{opacity:.5}
.btn-speed{
  flex:0 0 128px;height:44px;border-radius:12px;border:1px solid #2c3654;font-weight:800;font-size:12.5px;color:#93a0bd;
  background:linear-gradient(180deg,#1a2033,#121727);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
}
.btn-speed .dot{width:8px;height:8px;border-radius:50%;background:#4a5677;box-shadow:0 0 6px rgba(120,140,190,.3)}
.btn-speed.on{color:#0c0f18;background:linear-gradient(180deg,#f6dd9d,#d9ad52);border-color:#f3dca2;box-shadow:0 0 16px rgba(240,200,110,.35)}
.btn-speed.on .dot{background:#7c1f2b;box-shadow:0 0 6px rgba(120,0,0,.5)}

/* ---------- tabs ---------- */
.tabbar{
  display:grid;grid-template-columns:repeat(4,1fr);flex:0 0 auto;
  background:#0e1220;border-bottom:1px solid #232b45;
}
.tab{
  position:relative;height:56px;border:none;background:none;color:#6f7b96;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:800;cursor:pointer;letter-spacing:.02em;
  padding-top:2px;
}
.tab .t-ico{font-size:18px;line-height:1;filter:grayscale(.7) brightness(.85);transition:.15s}
.tab.on{color:#f4d68f;background:linear-gradient(180deg,rgba(244,214,143,.08),rgba(244,214,143,0))}
.tab.on .t-ico{filter:none;transform:translateY(-1px)}
.tab.on:after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:34px;height:2px;background:linear-gradient(90deg,transparent,#f4d68f,transparent)}

/* ---------- panel ---------- */
.panel{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;scrollbar-width:thin;min-height:0}
.panel::-webkit-scrollbar{width:5px}
.panel::-webkit-scrollbar-thumb{background:#2a3350;border-radius:3px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.sec-title span{font-size:12.5px;font-weight:800;letter-spacing:.05em;color:#c8d2e8}
.sec-title small{font-size:10.5px;color:#6f7b96;font-weight:600}

.power-card{
  border-radius:16px;padding:14px 16px;margin-bottom:13px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#1e2743,#141a2c 55%,#181c2e);
  border:1px solid #33405f;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 22px rgba(0,0,0,.35);
}
.power-card:after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(120,160,255,.18),transparent 65%)}
.pc-label{font-size:10px;letter-spacing:.18em;color:#8ea0c4;font-weight:800}
.pc-power{font-size:32px;font-weight:900;letter-spacing:-.01em;color:#f7e3b0;margin:2px 0 11px;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(250,215,140,.28)}
.pc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pc-grid div{background:rgba(8,11,20,.55);border:1px solid #263052;border-radius:9px;padding:7px 4px;text-align:center}
.pc-grid i{display:block;font-size:9.5px;font-style:normal;color:#8593b1;margin-bottom:2px}
.pc-grid b{font-size:12.5px;font-variant-numeric:tabular-nums;color:#e8eefc}

.gcard{
  border-radius:14px;padding:12px 13px;margin-bottom:9px;
  background:linear-gradient(160deg,#171d31,#111524);border:1px solid #262f4b;
}
.ghead{display:flex;align-items:center;gap:10px}
.gico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:#0d1220;border:1px solid #2a3352;flex:0 0 auto}
.gname{font-size:13px;font-weight:800;color:#eaf0fc}
.gsub{font-size:10.5px;color:#7f8caa;margin-top:2px;font-variant-numeric:tabular-nums}
.gval{margin-left:auto;text-align:right;font-size:15px;font-weight:900;color:#f0d79c;font-variant-numeric:tabular-nums}
.gval small{display:block;font-size:9.5px;color:#6d7a96;font-weight:700}
.gbtns{display:flex;gap:6px;margin-top:10px}
.gbtns button{
  flex:1;height:42px;border-radius:10px;border:1px solid #34405f;background:linear-gradient(180deg,#232c46,#171d2e);
  color:#dfe7f8;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;cursor:pointer;
}
.gbtns button small{font-size:9.5px;color:#f0cd8c;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.gbtns button.max{border-color:#6b5a33;background:linear-gradient(180deg,#332a1b,#221c12)}
.gbtns button.max small{color:#e8c57f}
.gbtns button.off{opacity:.42}
.gbtns button:active{filter:brightness(1.2)}
.gbtns button:disabled{opacity:.28}

/* ---------- gacha ---------- */
.gacha-top{
  border-radius:16px;padding:14px;margin-bottom:11px;text-align:center;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 0%,#3b2a56,#181325 70%);border:1px solid #4b3a6b;
}
.gacha-top h3{margin:0 0 3px;font-size:15px;letter-spacing:.03em;color:#f0e3ff}
.gacha-top p{margin:0;font-size:10.5px;color:#a99bc4;line-height:1.55}
.pity{margin-top:11px;text-align:left}
.pity-row{display:flex;align-items:center;gap:8px;font-size:10px;color:#b7aacd;margin-top:6px}
.pity-row b{margin-left:auto;color:#ffd79a;font-variant-numeric:tabular-nums;font-size:10.5px}
.pity-bar{flex:1;height:5px;border-radius:4px;background:#0d0a16;overflow:hidden;border:1px solid #3a2e52}
.pity-bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5cff,#ffb64d)}
.summon-btns{display:flex;gap:8px;margin:11px 0}
.sbtn{
  flex:1;height:54px;border-radius:13px;border:1px solid #7a5c2c;font-weight:900;font-size:13px;cursor:pointer;
  background:linear-gradient(180deg,#f3d78f,#c99a3c);color:#241a06;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 5px 14px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;
}
.sbtn.p11{background:linear-gradient(180deg,#b48cff,#7c4ed6);border-color:#c9aaff;color:#120a24;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 16px rgba(120,70,255,.3)}
.sbtn span{font-size:10px;font-weight:700;opacity:.82;margin-top:2px}
.sbtn:active{filter:brightness(1.1)}
.sbtn.off{filter:grayscale(.65) brightness(.8);opacity:.75}
.ticket-row{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;margin-bottom:11px;
  background:#151222;border:1px dashed #57406f;font-size:11px;color:#cbb9e6;
}
.ticket-row button{margin-left:auto;padding:7px 12px;border-radius:9px;border:1px solid #7c5cae;background:#2b1f42;color:#e6d6ff;font-weight:800;font-size:10.5px;cursor:pointer}
.ticket-row button.off{opacity:.4}

.rate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.rate{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:9px;background:#10141f;border:1px solid #242d47;font-size:10.5px;font-weight:800}
.rate .rd{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.rate b{margin-left:auto;font-size:10.5px;color:#c9d6ea;font-variant-numeric:tabular-nums}
.gacha-note{font-size:10px;color:#6f7b96;line-height:1.65;text-align:center;padding:2px 4px 4px}
.eq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px}
.eq-slot{
  border-radius:12px;padding:9px 6px;text-align:center;background:#10141f;border:1px solid #262f4b;min-height:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
.eq-slot .slot-label{font-size:9px;color:#6f7b96;font-weight:800;letter-spacing:.04em}
.eq-slot .slot-ico{font-size:23px;filter:grayscale(.2)}
.eq-slot .slot-name{font-size:10px;font-weight:800;line-height:1.2}
.eq-slot .slot-stat{font-size:9px;color:#94a1bd}
.eq-slot.empty .slot-name{color:#5d6883;font-weight:600}

.inv-item{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;margin-bottom:6px;
  background:#121728;border:1px solid #242d47;
}
.inv-item .ii-ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:#0c101c;border:1px solid #2a3450;flex:0 0 auto}
.inv-item .ii-mid{min-width:0;flex:1}
.inv-item .ii-name{font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-item .ii-sub{font-size:9.5px;color:#7f8caa;margin-top:1px}
.inv-item button{padding:7px 11px;border-radius:8px;border:1px solid #3a4664;background:#1d2438;color:#dbe4f6;font-size:10px;font-weight:800;cursor:pointer}
.inv-item button.on{border-color:#6b5a33;background:#2b2313;color:#f0cd8c}
.empty-note{font-size:11px;color:#69748f;text-align:center;padding:18px 0}

/* ---------- dungeon ---------- */
.dgn{
  border-radius:15px;padding:13px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;
  background:linear-gradient(150deg,#1a2036,#121624);border:1px solid #28324e;position:relative;overflow:hidden;
}
.dgn:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#c9a04a,#6a4b18)}
.dgn.gold:before{background:linear-gradient(180deg,#f0c667,#8a6114)}
.dgn.dia:before{background:linear-gradient(180deg,#78d4ff,#1f5f96)}
.dgn.promote:before{background:linear-gradient(180deg,#b58cff,#4f2d8f)}
.dgn-ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#0b0f1a;border:1px solid #2c3654;flex:0 0 auto}
.dgn-mid{flex:1;min-width:0}
.dgn-name{font-size:13px;font-weight:800;color:#eef3ff}
.dgn-desc{font-size:10px;color:#8593b1;margin:2px 0 6px;line-height:1.45}
.tickets{display:flex;gap:3px;align-items:center}
.tickets i{width:13px;height:13px;border-radius:3px;background:#2a3450;border:1px solid #3d4a6d;display:block}
.tickets i.on{background:linear-gradient(160deg,#f6dfa4,#cf9f3d);border-color:#f3dda8;box-shadow:0 0 6px rgba(240,200,110,.4)}
.tickets span{font-size:9.5px;color:#78849f;margin-left:4px}
.dgn button{
  padding:10px 13px;border-radius:10px;border:1px solid #7a5c2c;background:linear-gradient(180deg,#f0d493,#c69a3c);
  color:#241a06;font-weight:900;font-size:11.5px;cursor:pointer;flex:0 0 auto;min-width:66px;
}
.dgn button:disabled{filter:grayscale(.7) brightness(.75);color:#5c5647}
.dgn-tip{font-size:10px;color:#6d7994;padding:2px 4px 12px;line-height:1.6}

/* ---------- shop ---------- */
.shop-banner{
  border-radius:15px;padding:14px;margin-bottom:11px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#3a2140,#1b1226 60%,#241335);border:1px solid #5e3a68;
}
.shop-banner h3{margin:0;font-size:14px;color:#ffe4f3}
.shop-banner p{margin:4px 0 0;font-size:10.5px;color:#c2a9ce;line-height:1.5}
.shop-banner:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,120,200,.22),transparent 65%)}
.shop-sec{font-size:11px;font-weight:800;color:#9fadc9;letter-spacing:.08em;margin:16px 2px 8px}
.prod{
  display:flex;gap:11px;align-items:center;padding:12px 13px;border-radius:14px;margin-bottom:8px;
  background:linear-gradient(150deg,#1a2036,#121624);border:1px solid #2a3450;position:relative;
}
.prod.hot{border-color:#7a5c2c;background:linear-gradient(150deg,#2a2416,#181410)}
.prod.highlight{animation:hilite 1.4s ease-in-out 2;border-color:#f0cd8c}
@keyframes hilite{0%,100%{box-shadow:0 0 0 rgba(240,205,140,0)}50%{box-shadow:0 0 22px rgba(240,205,140,.55)}}
.prod-ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:23px;background:#0b0f1a;border:1px solid #2d3757;flex:0 0 auto}
.prod-mid{flex:1;min-width:0}
.prod-badge{display:inline-block;font-size:8.5px;font-weight:900;letter-spacing:.03em;color:#1a1204;background:linear-gradient(90deg,#f6d98f,#d8a748);border-radius:4px;padding:1.5px 5px;margin-bottom:3px}
.prod-badge.purple{background:linear-gradient(90deg,#c9a6ff,#8b5cf6);color:#160c26}
.prod-badge.red{background:linear-gradient(90deg,#ff9aa2,#e0434f);color:#2a0a0d}
.prod-name{font-size:12.5px;font-weight:800;color:#f0f4ff}
.prod-lines{font-size:9.5px;color:#8694b1;margin-top:2px;line-height:1.5}
.prod-buy{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto}
.prod-buy button{
  padding:10px 12px;border-radius:10px;border:1px solid #7a5c2c;background:linear-gradient(180deg,#f3d78f,#c99a3c);
  color:#241a06;font-weight:900;font-size:11px;cursor:pointer;min-width:82px;
}
.prod-buy button.owned{background:#1d2438;border-color:#33405f;color:#7d89a5}
.prod-buy small{font-size:8.5px;color:#6f7b96}

.dia-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.dia-card{
  border-radius:13px;padding:12px 10px;background:linear-gradient(160deg,#17223a,#101522);border:1px solid #2b3a5c;text-align:center;position:relative;
}
.dia-card .dc-dot{width:22px;height:22px;margin:0 auto 6px;background:linear-gradient(160deg,#a8e7ff,#3ea6ff 55%,#1d63c8);transform:rotate(45deg);border-radius:4px;box-shadow:0 0 12px rgba(90,180,255,.5)}
.dia-card b{display:block;font-size:13px;color:#dff2ff;font-variant-numeric:tabular-nums}

    var base = defaultState();

  var cdmg = Math.min(500, 150 + 4 * state.lv.cdmg);

  return {

    level: st, boss:isBoss, challenge: !!opt.challenge,
    flash:0, knock:0, atkCd: 0.9, lunge:0,
    scale: isBoss ? 1.32 : 1,
    hgt: 50
  };
  B.enemy.hgt = HEIGHTS[kind] || 60;
  if(isBoss) B.bossTimer = opt.challenge ? 30 : 0;
  if(isBoss) addBanner('BOSS', name);
}

function addPopup(x, y, text, kind){
  B.popups.push({x:x, y:y, text:text, kind:kind||'norm', life:0.9, max:0.9, vy:-42, vx:rnd(-10,10)});
}
function burst(x, y, n, colors, spd){
  for(var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2, s = rnd(30, spd||140);
    B.parts.push({
      x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 30,
      life:rnd(0.3,0.7), max:0.7, r:rnd(1.2,3), c:pick(colors)
    });
  }
}

function hitEnemy(dmg, crit, isSkill){
  var e = B.enemy;
  if(!e) return;
  dmg = Math.max(1, Math.round(dmg));
  e.hp -= dmg;
  e.flash = 1;
  e.knock = 1;
  var px = enemyX() - W*0.02;
  var py = groundY() - (HEIGHTS[e.kind]||60) * enemyScale(e) * 0.58 - 10*VS;
  addPopup(px + rnd(-8,8), py, (crit?'':'') + comma(dmg), crit ? 'crit' : (isSkill ? 'skill' : 'norm'));
  if(crit){
    B.shake = Math.max(B.shake, 5);
    burst(px, py + 14, 8, ['#ffe9a8','#ffc247','#fff'], 170);
  } else {
    burst(px, py + 14, 4, ['#dfe9ff','#9fc4ff'], 110);
  }
  if(e.hp <= 0) onEnemyDeath();
}

function castSkill(st){
  var e = B.enemy;
  if(!e) return;
  var crit = Math.random()*100 < st.crit;
  var dmg = st.atk * st.skill.mult * rnd(0.95,1.06);
  if(crit) dmg *= st.cdmg/100;
  var fxType = st.skill.fx || 'slash';
  var sx = heroX() + 26*VS, sy = groundY() - 52*VS, ex = enemyX(), ey = groundY() - 44*VS;
  B.fx.push({type:fxType, x:ex, y:ey, sx:sx, sy:sy, life:0.55, max:0.55, seed:Math.random()*10});
  addPopup(heroX()+10, groundY()-104*VS, st.skill.name, 'cast');
  if(fxType === 'holy') B.shake = Math.max(B.shake, 4);
  setTimeout(function(){ if(B.enemy === e) hitEnemy(dmg, crit, true); }, 130);
}

function heroAttack(st){
  B.hero.attacks++;
  B.hero.lunge = 1;
  if(B.hero.attacks % 6 === 0){ castSkill(st); return; }
  var crit = Math.random()*100 < st.crit;
  var dmg = st.atk * rnd(0.92,1.08);
  if(crit) dmg *= st.cdmg/100;
  hitEnemy(dmg, crit, false);
}

function enemyAttack(){
  var e = B.enemy;
  if(!e || B.hero.dead) return;
  var st = heroStats();
  var dmg = e.atk * rnd(0.9,1.12);
  B.hero.hp -= dmg;
  B.hero.flash = 1;
  e.lunge = 1;
  B.shake = Math.max(B.shake, 2.5);
  addPopup(heroX(), groundY()-92*VS, '-' + comma(dmg), 'hurt');
  burst(heroX()+6, groundY()-46*VS, 4, ['#ff9aa2','#ff5d6b'], 100);
  if(B.hero.hp <= 0){
    B.hero.hp = 0;
    B.hero.dead = true;
    B.hero.respawn = 3.6;
    addBanner('전투 불능', '3초 후 부활합니다');
    B.shake = 8;
  }
}

function onEnemyDeath(){
  var e = B.enemy;
  if(!e) return;
  var px = enemyX(), py = groundY() - e.hgt*e.scale*0.5;
  burst(px, py, e.boss?26:12, ['#ffe9a8','#ffd166','#fff3cf','#b9d4ff'], e.boss?240:150);
  if(B.mode === 'dungeon'){ dungeonKill(e); return; }

  if(e.boss){
    state.stage += 1;
    state.kills = 0;
    state.best = Math.max(state.best, state.stage);
    var bonus = Math.round(goldPerKill(state.stage) * 8);
    state.gold += bonus;
    state.stats.goldEarned += bonus;
    addPopup(px, py-30, '+' + comma(bonus) + ' G', 'gold');
    B.bossTimer = 0;
    B.enemy = null;
    B.spawnT = 1.15;
    addBanner('STAGE ' + state.stage, stageName(state.stage));
    B.hero.hp = Math.min(heroStats().hp, B.hero.hp + heroStats().hp*0.25);
    save();
  } else {
    state.kills = Math.min(10, state.kills + 1);
    var g = Math.round(goldPerKill(state.stage) * rnd(0.9,1.15));
    state.gold += g;
    state.stats.goldEarned += g;
    state.stats.kills += 1;
    state.best = Math.max(state.best, state.stage);
    addPopup(px, py-26, '+' + comma(g), 'gold');
    B.hero.hp = Math.min(heroStats().hp, B.hero.hp + heroStats().hp*0.02);
    B.enemy = null;
    B.spawnT = 0.5;
    if(state.kills >= 10){ toast('보스가 등장했습니다!'); }
  }
}

function addBanner(t, s){
  B.banner = {t:t, s:s||'', life:1.8, max:1.8};
}

function challengeBoss(){
  if(B.mode !== 'stage' || B.bossCd > 0) return;
  if(B.enemy && B.enemy.boss) return;
  B.enemy = null;
  B.spawnT = 0;
  spawnEnemy({boss:true, challenge:true});
  toast('보스 도전! 30초 안에 처치하세요');
}

function bossFail(){
  B.bossTimer = 0;
  if(B.enemy && B.enemy.boss){
    B.enemy = null;
    B.spawnT = 1.0;
    B.bossCd = 6;
    addBanner('도전 실패', '자동 사냥을 계속합니다');
    toast('보스를 처치하지 못했습니다. 계속 사냥합니다.');
  }
}

/* ------------- dungeons ------------- */
function startDungeon(type){
  if(B.mode === 'dungeon') return;
  if(type === 'promote' && state.rank >= RANKS.length-1){
    toast('이미 최고 계급입니다');
    return;
  }
  if(state.dgn[type] <= 0){ toast('입장권이 없습니다. 내일 다시 도전하세요.'); return; }
  state.dgn[type] -= 1;
  B.mode = 'dungeon';
  B.bossTimer = 0;
  B.bossCd = 0;
  B.enemy = null;
  B.spawnT = 0;
  B.dungeon = {type:type, left: DUNGEONS[type].time, total: DUNGEONS[type].time,
               gold:0, dia:0, kills:0, done:false, boss:null};
  var st = heroStats();
  B.hero.hp = st.hp;
  B.hero.dead = false;
  if(type === 'promote'){
    var hp = Math.max(enemyHp(state.stage)*6, st.dps * 21);
    B.enemy = {
      kind:'trial', name:'시련의 기사', hp:hp, maxHp:hp, atk: enemyAtk(state.stage)*1.2,
      level: state.stage, boss:true, challenge:false, flash:0, knock:0, atkCd:1.0, lunge:0,
      scale:1.25, hgt:HEIGHTS.trial
    };
    B.dungeon.boss = B.enemy;
    addBanner('승급 시련', '25초 안에 처치하라');
  } else {
    spawnDungeonEnemy();
    addBanner(DUNGEONS[type].name, '제한 시간 동안 최대한 사냥하세요');
  }
  switchTab('grow', true);
  toast(DUNGEONS[type].name + ' 입장!');
  updateHud();
}

function spawnDungeonEnemy(){
  if(!B.dungeon) return;
  var st = heroStats();
  var type = B.dungeon.type;
  var hp = st.dps * rnd(1.5, 2.3);
  var kind = type === 'gold' ? 'gold' : (type === 'dia' ? 'golem' : 'trial');
  B.enemy = {
    kind:kind,
    name: type === 'gold' ? '황금 슬라임' : (type === 'dia' ? '수정 골렘' : '수련용 허수아비'),
    hp:hp, maxHp:hp, atk:0, level:state.stage, boss:false, challenge:false,
    flash:0, knock:0, atkCd:99, lunge:0, scale: type==='golem'?1.0:0.95, hgt:HEIGHTS[kind]
  };
}

function dungeonKill(e){
  var d = B.dungeon;
  if(!d) return;
  d.kills++;
  if(d.type === 'gold'){
    var g = Math.round(goldPerKill(state.stage) * 5.5 + 120);
    d.gold += g;
    state.gold += g;
    state.stats.goldEarned += g;
    addPopup(enemyX(), groundY()-70*VS, '+' + comma(g) + ' G', 'gold');
  } else if(d.type === 'dia'){
    var n = rndi(3,6);
    d.dia += n;
    state.dia += n;
    addPopup(enemyX(), groundY()-70*VS, '+' + n + ' 💎', 'dia');
  }
  B.enemy = null;
  if(d.type === 'promote'){
    endDungeon(true);
    return;
  }
  B.spawnT = 0.35;
}

function endDungeon(success){
  var d = B.dungeon;
  if(!d || d.done) return;
  d.done = true;
  var type = d.type;
  var st = heroStats();
  B.hero.hp = st.hp;
  B.hero.dead = false;
  if(type === 'promote'){
    if(success && state.rank < RANKS.length-1){
      state.rank += 1;
    } else if(success){
      state.dia += 500;
    }
  }
  var box = document.createElement('div');
  var title = type === 'promote' ? (success ? '승급 성공!' : '승급 실패') : '던전 완료';
  var rows = '';
  if(type === 'gold') rows = '<div class="m-row"><span>획득 골드</span><b>' + comma(d.gold) + ' G</b></div>';
  if(type === 'dia')  rows = '<div class="m-row"><span>획득 다이아</span><b>' + d.dia + ' 💎</b></div>';
  if(type === 'promote'){
    rows = success
      ? '<div class="m-row"><span>새 계급</span><b>' + RANKS[state.rank] + '</b></div><div class="m-row"><span>전 능력치</span><b>+12%</b></div>'
      : '<div class="m-row"><span>결과</span><b>시간 초과</b></div>';
  }
  rows += '<div class="m-row"><span>처치 수</span><b>' + d.kills + '</b></div>';
  box.className = 'modal-back';
  box.innerHTML =
    '<div class="modal">' +
      '<div class="m-title">' + title + '</div>' +
      '<div class="m-sub">' + DUNGEONS[type].name + '</div>' +
      (type === 'promote'
        ? '<div class="offline-hero"><div class="oh-ico">' + (success?'🏅':'💤') + '</div><div class="oh-t">' + (success?'기사단의 계급이 상승했습니다':'아쉽게도 시련을 통과하지 못했습니다') + '</div></div>'
        : '') +
      '<div class="m-body">' + rows + '</div>' +
      '<div class="m-btns"><button class="primary" data-close>확인</button></div>' +
    '</div>';
  $('#app').appendChild(box);
  requestAnimationFrame(function(){ box.classList.add('show'); });
  box.querySelector('[data-close]').addEventListener('click', function(){ closeModal(box); });

  B.dungeon = null;
  B.enemy = null;
  B.mode = 'stage';
  B.spawnT = 1.0;
  B.bossCd = 0;
  updateHud();
  save();
}

/* =========================================================
   5. Canvas rendering
   ========================================================= */
var cv = $('#battle');
var ctx = cv.getContext('2d');
var W = 380, H = 230, DPR = 1, VS = 1;
var stars = [], motes = [];

var HEIGHTS = {slime:34, goblin:60, orc:84, dark:92, wraith:78, dragon:118, gold:34, golem:84, trial:78};
var CROWN = {slime:40, goblin:58, orc:80, dark:86, wraith:74, gold:40, golem:80};

function resize(){
  var r = cv.getBoundingClientRect();
  if(!r.width || !r.height) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR);
  cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  VS = clamp(H/190, 0.95, 4.0);
  stars = [];
  for(var i=0;i<46;i++){
    stars.push({x:Math.random()*W, y:Math.random()*H*0.6, r:rnd(0.4,1.3), a:rnd(0.25,0.9), ph:rnd(0,6.3)});
  }
  motes = [];
  for(var j=0;j<16;j++){
    motes.push({x:Math.random()*W, y:Math.random()*H, sp:rnd(6,18), r:rnd(0.6,1.8), ph:rnd(0,6.3), a:rnd(.15,.5)});
  }
}

var T = 0;

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(B.shake > 0.2){
    ctx.translate(rnd(-B.shake,B.shake), rnd(-B.shake,B.shake));
  }
  drawSky();
  drawGround();
  drawUnits();
  drawFx();
  drawPopups();
  drawOverlayText();
  ctx.restore();
  drawVignette();
}

function drawSky(){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#131a33');
  g.addColorStop(0.48,'#1c2142');
  g.addColorStop(0.72,'#171a30');
  g.addColorStop(1,'#0a0c16');
  ctx.fillStyle = g;
  ctx.fillRect(-20,-20,W+40,H+40);

  // moon
  var mx = W*0.79, my = H*0.23, mr = Math.min(26, W*0.07);
  var mg = ctx.createRadialGradient(mx,my,mr*0.2,mx,my,mr*4.2);
  mg.addColorStop(0,'rgba(255,248,222,.95)');
  mg.addColorStop(0.14,'rgba(250,240,205,.55)');
  mg.addColorStop(0.4,'rgba(220,215,190,.10)');
  mg.addColorStop(1,'rgba(200,200,180,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx,my,mr*4.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f5efd6';
  ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(210,200,170,.35)';
  ctx.beginPath(); ctx.arc(mx-mr*0.3,my-mr*0.2,mr*0.16,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+mr*0.25,my+mr*0.3,mr*0.1,0,Math.PI*2); ctx.fill();

  // stars
  for(var i=0;i<stars.length;i++){
    var s = stars[i];
    var tw = 0.55 + 0.45*Math.sin(T*1.4 + s.ph);
    ctx.globalAlpha = s.a * tw * 0.8;
    ctx.fillStyle = '#cfe0ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // far mountains
  ctx.fillStyle = '#191d33';
  ctx.beginPath();
  ctx.moveTo(-10, H*0.82);
  var pts = [[0.06,0.56],[0.16,0.66],[0.26,0.52],[0.38,0.68],[0.5,0.58],[0.62,0.7],[0.76,0.56],[0.9,0.68],[1.02,0.6]];
  for(var p=0;p<pts.length;p++){
    ctx.lineTo(W*pts[p][0], H*pts[p][1] + 40);
  }
  ctx.lineTo(W+10,H*0.9); ctx.lineTo(-10,H*0.9); ctx.closePath(); ctx.fill();

  // castle silhouette
  var cx = W*0.13, cy = H*0.72;
  ctx.fillStyle = '#10131f';
  ctx.fillRect(cx-30, cy-34, 12, 40);
  ctx.fillRect(cx-34, cy-40, 20, 8);
  ctx.fillRect(cx-2, cy-52, 15, 58);
  ctx.fillRect(cx-6, cy-58, 23, 8);
  ctx.beginPath(); ctx.moveTo(cx-6,cy-58); ctx.lineTo(cx+5,cy-70); ctx.lineTo(cx+17,cy-58); ctx.closePath(); ctx.fill();
  ctx.fillRect(cx+22, cy-28, 10, 34);
  ctx.fillRect(cx+19, cy-34, 16, 7);
  // windows
  var flick = 0.5 + 0.5*Math.sin(T*2.2);
  ctx.fillStyle = 'rgba(255,190,90,' + (0.3 + flick*0.4) + ')';
  ctx.fillRect(cx+3, cy-44, 2.5, 3.5);
  ctx.fillRect(cx+9, cy-30, 2.5, 3.5);
  ctx.fillRect(cx-26, cy-26, 2, 3);
  ctx.fillStyle = 'rgba(160,200,255,.25)';
  ctx.fillRect(cx-26, cy-14, 2, 3);
  ctx.fillRect(cx+26, cy-20, 2, 3);
}

function drawGround(){
  var gy = groundY();
  var g = ctx.createLinearGradient(0, gy-18, 0, H);
  g.addColorStop(0,'#1b2237');
  g.addColorStop(0.35,'#141927');
  g.addColorStop(1,'#080a12');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-10, gy);
  ctx.quadraticCurveTo(W*0.3, gy-10, W*0.55, gy-3);
  ctx.quadraticCurveTo(W*0.8, gy+6, W+10, gy-6);
  ctx.lineTo(W+10, H+10); ctx.lineTo(-10, H+10); ctx.closePath(); ctx.fill();

  // rim light
  ctx.strokeStyle = 'rgba(130,160,220,.18)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-10, gy);
  ctx.quadraticCurveTo(W*0.3, gy-10, W*0.55, gy-3);
  ctx.quadraticCurveTo(W*0.8, gy+6, W+10, gy-6);
  ctx.stroke();

  // rocks
  ctx.fillStyle = '#0e1320';
  var rocks = [[0.08,6],[0.19,4],[0.44,5],[0.58,3.5],[0.88,5],[0.93,3]];
  for(var i=0;i<rocks.length;i++){
    ctx.beginPath();
    ctx.ellipse(W*rocks[i][0], gy+12+((i%3)*4), rocks[i][1]*2.4, rocks[i][1], 0, 0, Math.PI*2);
    ctx.fill();
  }

  // fog
  var fg = ctx.createLinearGradient(0, gy-46, 0, gy+16);
  fg.addColorStop(0,'rgba(120,150,200,0)');
  fg.addColorStop(0.6,'rgba(110,140,190,.07)');
  fg.addColorStop(1,'rgba(90,120,170,0)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, gy-46, W, 64);

  // rising motes
  for(var m=0;m<motes.length;m++){
    var mo = motes[m];
    var yy = gy + 10 - ((T*mo.sp + mo.ph*40) % (gy+20));
    ctx.globalAlpha = mo.a * (0.4 + 0.6*Math.sin(T*2 + mo.ph));
    ctx.fillStyle = '#ffd79a';
    ctx.beginPath(); ctx.arc(mo.x, yy, mo.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawUnits(){
  var gy = groundY();
  var st = heroStats();
  var vs = VS;
  var hx = heroX();

  ctx.save();
  ctx.globalAlpha = 0.32;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(hx, gy+2, 28*vs, 7*vs, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  drawKnight(hx + B.hero.lunge*30*vs, gy, vs, T, B.hero.lunge, B.hero.flash, false, null);

  // hero hp bar above head
  drawBar(hx-36*vs, gy-92*vs, 72*vs, 7*vs, clamp(B.hero.hp/st.hp,0,1), '#4fd08a', '#0d1a14');
  ctx.font = '700 ' + (8*vs) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(200,220,240,.8)';
  ctx.fillText('HP ' + comma(Math.max(0,B.hero.hp)) + ' / ' + comma(st.hp), hx, gy-98*vs);

  var e = B.enemy;
  if(e){
    var ex = enemyX() + (e.knock>0 ? e.knock*10*vs : 0) - (e.lunge>0 ? e.lunge*8*vs : 0);
    ctx.save();
    ctx.globalAlpha = 0.32;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(enemyX(), gy+2, 26*vs*(e.scale||1), 7*vs, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    drawEnemy(e, ex, gy, T);
    var top = gy - (HEIGHTS[e.kind]||60)*enemyScale(e);
    drawBar(ex-44*vs, top-20*vs, 88*vs, 8*vs, clamp(e.hp/e.maxHp,0,1), e.boss ? '#ff6b6b' : '#ff9a52', '#1a0d10');
    ctx.font = '800 ' + (9.5*vs) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = e.boss ? '#ffb3b3' : '#dbe6fb';
    ctx.fillText((e.boss ? '👑 ' : '') + e.name + '  Lv.' + e.level, ex, top-30*vs);
  }
}

function drawBar(x,y,w,h,ratio,color,bg){
  ctx.fillStyle = bg || 'rgba(0,0,0,.55)';
  rr(x-1.5,y-1.5,w+3,h+3,4); ctx.fill();
  ctx.fillStyle = '#080b12';
  rr(x,y,w,h,3); ctx.fill();
  if(ratio > 0){
    var g = ctx.createLinearGradient(x,0,x+w,0);
    g.addColorStop(0,color);
    g.addColorStop(1,'#ffffff');
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = g;
    rr(x,y,Math.max(3,w*ratio),h,3); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawKnight(x, y, s, t, lunge, flash, trial, palette){

function enemyScale(e){
  var base = (e.scale || 1) * VS;
  return Math.min(base, (H*0.66) / (HEIGHTS[e.kind] || 60));
}
function drawEnemy(e, x, gy, t){
  ctx.save();
  ctx.translate(x, gy);
  var sc = enemyScale(e);
  ctx.scale(sc, sc);
  if(e.knock > 0){
    ctx.translate(0, 0);
  }
  var f = e.flash || 0;

  var palette = {};
  if(e.kind === 'slime') drawSlime(t, f);
  else if(e.kind === 'goblin') drawGoblin(t, f);
  else if(e.kind === 'orc') drawOrc(t, f);
  else if(e.kind === 'dark') drawDarkKnight(t, f);
  else if(e.kind === 'wraith') drawWraith(t, f);
  else if(e.kind === 'dragon') drawDragon(t, f);
  else if(e.kind === 'gold') drawSlime(t, f, true);
  else if(e.kind === 'golem') drawGolem(t, f);
  else if(e.kind === 'trial') drawKnight(0,0,1,t,0,f,true);

  if(e.boss && e.kind !== 'dragon' && e.kind !== 'trial'){
    // crown
    ctx.save();
    ctx.translate(0, -(CROWN[e.kind] || (HEIGHTS[e.kind]||60) + 2) - 2);
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.moveTo(-10,0); ctx.lineTo(-10,-8); ctx.lineTo(-5,-3); ctx.lineTo(0,-10); ctx.lineTo(5,-3); ctx.lineTo(10,-8); ctx.lineTo(10,0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff5f6d';
    ctx.beginPath(); ctx.arc(0,-4,1.8,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function flashOverlay(f, h, w){
  if(f <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = f * 0.45;
  var g = ctx.createRadialGradient(0,-h*0.5,2,0,-h*0.5,w*0.8);
  g.addColorStop(0,'rgba(255,255,255,.9)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,-h*0.5,w*0.8,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawSlime(t, f, golden){
  var sq = 1 + Math.sin(t*4)*0.06;
  var body = golden

    : ['#7ef0c0','#37c48f','#177a58'];
  var w = 30, h = 30*sq;
  ctx.save();
  ctx.translate(0, -h*0.5);
  var g = ctx.createLinearGradient(-w,-h,w,h);
  g.addColorStop(0,body[0]); g.addColorStop(0.55,body[1]); g.addColorStop(1,body[2]);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-w, h*0.5);
  ctx.bezierCurveTo(-w*1.05,-h*0.9, -w*0.35,-h*1.15, 0,-h*1.0);
  ctx.bezierCurveTo(w*0.4,-h*1.12, w*1.05,-h*0.9, w, h*0.5);
  ctx.quadraticCurveTo(0,h*0.9,-w,h*0.5);

function drawFx(){
  for(var i=B.fx.length-1;i>=0;i--){
    var fx = B.fx[i];
    var k = 1 - fx.life/fx.max;
    ctx.save();
    if(fx.type === 'slash'){
      ctx.globalAlpha = (1-k)*0.95;
      ctx.translate(fx.x, fx.y);
      ctx.rotate(-0.7 + k*0.9);
      var r = (26 + k*30) * VS;
      ctx.strokeStyle = '#fff6d8';
      ctx.lineWidth = (5*(1-k)+1) * VS;
      ctx.shadowColor = '#ffce6a'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(0,0,r,-1.1,0.9); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,190,90,.8)';
      ctx.lineWidth = 2*VS;
      ctx.beginPath(); ctx.arc(0,0,r-5*VS,-1.0,0.8); ctx.stroke();
    } else if(fx.type === 'fire'){
      var px = fx.sx + (fx.x - fx.sx) * clamp(k*1.8,0,1);
      var py = fx.sy + (fx.y - fx.sy) * clamp(k*1.8,0,1) - Math.sin(k*Math.PI)*16*VS;
      ctx.globalAlpha = k>0.8 ? (1-k)*5 : 1;
      var rr2 = 16*VS;
      var fg = ctx.createRadialGradient(px,py,2,px,py,rr2);
      fg.addColorStop(0,'#fff3c4'); fg.addColorStop(0.35,'#ffb03a'); fg.addColorStop(1,'rgba(255,60,0,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(px,py,rr2,0,Math.PI*2); ctx.fill();
      if(k > 0.7){
        burst(fx.x, fx.y, 3, ['#ffb03a','#ff6a2a','#ffe9a8'], 120);
      }
    } else if(fx.type === 'bolt'){
      ctx.globalAlpha = (1-k)*0.95;
      ctx.strokeStyle = '#cfe8ff';
      ctx.lineWidth = (3.4*(1-k)+1) * VS;
      ctx.shadowColor = '#7fd8ff'; ctx.shadowBlur = 18;
      ctx.beginPath();
      var bx = fx.x, by = 0;
      ctx.moveTo(bx, by);
      var segs = 7;
      for(var s=1;s<=segs;s++){
        var yy = (H*0.02) + (fx.y - H*0.02) * (s/segs);
        var off = Math.sin(fx.seed + s*2.3 + k*4) * (10 - s*8/segs) * VS;
        ctx.lineTo(bx + off, yy);
      }
      ctx.stroke();
    } else if(fx.type === 'holy'){
      ctx.globalAlpha = (1-k)*0.9;
      var w = (24 + k*18) * VS;
      var hg = ctx.createLinearGradient(fx.x-w,0,fx.x+w,0);
      hg.addColorStop(0,'rgba(255,240,180,0)');
      hg.addColorStop(0.5,'rgba(255,250,220,.85)');
      hg.addColorStop(1,'rgba(255,240,180,0)');
      ctx.fillStyle = hg;
      ctx.fillRect(fx.x-w, 0, w*2, fx.y+8*VS);
      ctx.fillStyle = 'rgba(255,255,255,' + (1-k)*0.35 + ')';
      ctx.beginPath(); ctx.ellipse(fx.x, fx.y, (30+k*24)*VS, (8+k*6)*VS, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  for(var p2=B.parts.length-1;p2>=0;p2--){
    var pt = B.parts[p2];
    ctx.globalAlpha = clamp(pt.life/pt.max,0,1);
    ctx.fillStyle = pt.c;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPopups(){
  ctx.textAlign = 'center';
  for(var i=0;i<B.popups.length;i++){
    var p = B.popups[i];
    var k = 1 - p.life/p.max;
    var alpha = p.life > p.max*0.55 ? 1 : clamp(p.life/(p.max*0.55),0,1);
    ctx.save();
    ctx.globalAlpha = alpha;
    var size = (p.kind==='crit' ? 21 : (p.kind==='skill' ? 17 : (p.kind==='cast'?11:14))) * Math.min(VS, 2.0);
    var scale = 1;
    if(k < 0.12) scale = 0.6 + k*3.3;
    ctx.translate(p.x, p.y);
    ctx.scale(scale, scale);
    ctx.font = '900 ' + size + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
    if(p.kind === 'crit'){
      ctx.fillStyle = '#ffd24d';
      ctx.shadowColor = 'rgba(255,120,0,.9)'; ctx.shadowBlur = 14;
      ctx.strokeStyle = 'rgba(60,20,0,.85)'; ctx.lineWidth = 3.5;
      ctx.strokeText(p.text, 0, 0);
      ctx.fillText(p.text, 0, 0);
    } else if(p.kind === 'skill'){
      ctx.fillStyle = '#c9e8ff';
      ctx.shadowColor = 'rgba(90,180,255,.9)'; ctx.shadowBlur = 12;
      ctx.strokeStyle = 'rgba(0,20,50,.8)'; ctx.lineWidth = 3;
      ctx.strokeText(p.text, 0, 0);
      ctx.fillText(p.text, 0, 0);
    } else if(p.kind === 'gold'){
      ctx.font = '800 ' + (12*Math.min(VS,1.5)) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
      ctx.fillStyle = '#ffd166'; ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 6;
      ctx.fillText(p.text, 0, 0);
    } else if(p.kind === 'dia'){
      ctx.font = '800 ' + (12*Math.min(VS,1.5)) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
      ctx.fillStyle = '#9fdcff'; ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 6;
      ctx.fillText(p.text, 0, 0);
    } else if(p.kind === 'hurt'){
      ctx.font = '900 ' + (13*Math.min(VS,1.5)) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
      ctx.fillStyle = '#ff7f8a'; ctx.strokeStyle = 'rgba(40,0,6,.8)'; ctx.lineWidth = 3;
      ctx.strokeText(p.text, 0, 0); ctx.fillText(p.text, 0, 0);
    } else if(p.kind === 'cast'){
      ctx.font = '900 ' + (10*Math.min(VS,1.6)) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
      ctx.fillStyle = '#ffe9a8'; ctx.shadowColor = 'rgba(255,200,80,.9)'; ctx.shadowBlur = 10;
      ctx.fillText(p.text, 0, 0);
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = 3;
      ctx.strokeText(p.text, 0, 0);
      ctx.fillText(p.text, 0, 0);
    }
    ctx.restore();
  }
}

/* =========================================================
   6. Battle tick
   ========================================================= */
function updateBattle(dt){
  B.t += dt;
  T += dt;

  if(B.bossCd > 0) B.bossCd = Math.max(0, B.bossCd - dt);

  // hero
  var st = heroStats();
  if(B.hero.dead){
    B.hero.respawn -= dt;
    if(B.hero.respawn <= 0){
      B.hero.dead = false;
      B.hero.hp = st.hp;
      B.hero.atkCd = 0.3;
      toast('기사가 부활했습니다');
    }
  } else {
    if(!B.enemy){
      B.hero.hp = Math.min(st.hp, B.hero.hp + st.hp*0.02*dt);
    } else {
      B.hero.hp = Math.min(st.hp, B.hero.hp + st.hp*0.006*dt);
    }
    if(B.enemy && B.enemy.hp > 0){
      B.hero.atkCd -= dt;
      if(B.hero.atkCd <= 0){
        B.hero.atkCd = 0.85;
        heroAttack(st);
      }
    }
  }
  B.hero.lunge = Math.max(0, B.hero.lunge - dt*4.2);
  B.hero.flash = Math.max(0, B.hero.flash - dt*3);

  // enemy
  var e = B.enemy;
  if(e){
    e.flash = Math.max(0, e.flash - dt*3.2);
    e.knock = Math.max(0, e.knock - dt*5);
    e.lunge = Math.max(0, e.lunge - dt*4);
    if(e.hp > 0 && !B.hero.dead && e.atk > 0){
      e.atkCd -= dt;
      if(e.atkCd <= 0){
        e.atkCd = 1.45;
        enemyAttack();
      }
    }
  }

  // spawn
  if(!B.enemy){
    B.spawnT -= dt;
    if(B.spawnT <= 0){
      if(B.mode === 'dungeon' && B.dungeon){
        spawnDungeonEnemy();
      } else {
        spawnEnemy();
      }
    }
  }

  // boss timer
  if(B.bossTimer > 0){
    B.bossTimer -= dt;
    if(B.bossTimer <= 0) bossFail();
  }

  // dungeon timer
  if(B.dungeon){
    B.dungeon.left -= dt;
    if(B.dungeon.left <= 0) endDungeon(false);
  }

  // popups
  for(var i=B.popups.length-1;i>=0;i--){
    var p = B.popups[i];
    p.life -= dt;
    p.y += p.vy*dt;
    p.x += p.vx*dt;
    p.vy += 42*dt;
    if(p.life <= 0) B.popups.splice(i,1);
  }
  // particles
  for(var j=B.parts.length-1;j>=0;j--){
    var pt = B.parts[j];
    pt.life -= dt;
    pt.x += pt.vx*dt;
    pt.y += pt.vy*dt;
    pt.vy += 200*dt;
    pt.vx *= 0.98;
    if(pt.life <= 0) B.parts.splice(j,1);
  }
  // fx
  for(var k2=B.fx.length-1;k2>=0;k2--){
    B.fx[k2].life -= dt;
    if(B.fx[k2].life <= 0) B.fx.splice(k2,1);
  }
  if(B.banner){
    B.banner.life -= dt;
    if(B.banner.life <= 0) B.banner = null;
  }
  B.shake = Math.max(0, B.shake - dt*22);
}

var ui = {tab:'grow', lastHud:0, lastAfford:0};

function updateHud(){
  var st = heroStats();

  } else {

  }
  $('#killFill').style.width = pct + '%';
  $('#killTxt').textContent = label;

  var sp = $('#speedBtn');

    $('#speedTxt').textContent = '2배속 OFF';
  }

  if(B.bossCd > 0){
    bb.classList.add('cool');

  } else {
    bb.classList.remove('cool');

function toast(msg){
  var layer = $('#toasts');
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  layer.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 2100);
  while(layer.children.length > 3) layer.removeChild(layer.firstChild);
}

function switchTab(name, silent){
  ui.tab = name;
  $$('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === name); });
  $('#panel').scrollTop = 0;
  renderTab();
  if(!silent) {}
}

function renderTab(){
  if(ui.tab === 'grow') renderGrow();
  else if(ui.tab === 'gacha') renderGacha();
  else if(ui.tab === 'dgn') renderDungeon();
  else renderShop();
  updateAfford();
}

function updateAfford(){
  var gold = state.gold, dia = state.dia;
  $$('#panel button[data-cost]').forEach(function(b){
    var c = parseInt(b.dataset.cost,10);
    var cur = b.dataset.cur === 'dia' ? dia : gold;
    b.classList.toggle('off', cur < c);
  });
  $$('#panel button[data-dia]').forEach(function(b){
    b.classList.toggle('off', dia < parseInt(b.dataset.dia,10));
  });
}

function eqSlot(slot, it, label, statName){
  if(!it){
    return '<div class="eq-slot empty"><div class="slot-label">' + label + '</div><div class="slot-ico">➕</div><div class="slot-name">비어 있음</div></div>';
  }
  var d = defOf(it);
  var stat = itemStat(it);
  var val = d.type === 'skill' ? ('피해 ' + stat + '%') : (statName + ' +' + stat + '%');
  return '<div class="eq-slot" style="border-color:' + hexA(GRADES[d.grade].c,.45) + '">' +
    '<div class="slot-label">' + label + '</div>' +
    '<div class="slot-ico">' + d.icon + '</div>' +
    '<div class="slot-name" style="color:' + GRADES[d.grade].c + '">' + d.name + '</div>' +
    '<div class="slot-stat">' + val + (it.lv>1?(' · +' + (it.lv-1)):'') + '</div>' +
  '</div>';
}
function hexA(hex, a){
  var h = hex.replace('#','');
  var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function buyStat(key, n){
  var maxed = (key==='crit' && 5+0.35*state.lv[key] >= 70) || (key==='cdmg' && 150+4*state.lv[key] >= 500);
  if(maxed) return;
  var bought = 0;
  if(n === 'max'){
    while(bought < 500){
      if(key==='crit' && 5+0.35*state.lv[key] >= 70) break;
      if(key==='cdmg' && 150+4*state.lv[key] >= 500) break;
      var c = costOf(key, state.lv[key]);
      if(state.gold < c) break;
      state.gold -= c; state.lv[key]++; bought++;
    }
    if(bought === 0){ toast('골드가 부족합니다'); return; }
    toast(STATS[key].name + ' +' + bought + ' 강화!');
  } else {
    var cnt = parseInt(n,10);
    for(var i=0;i<cnt;i++){
      if(key==='crit' && 5+0.35*state.lv[key] >= 70) break;
      if(key==='cdmg' && 150+4*state.lv[key] >= 500) break;
      var cc = costOf(key, state.lv[key]);
      if(state.gold < cc){ if(bought===0){ toast('골드가 부족합니다'); return; } break; }
      state.gold -= cc; state.lv[key]++; bought++;
    }
    if(bought > 0) toast(STATS[key].name + ' +' + bought + ' 강화!');
  }
  state.lastSeen = now();
  save();
  renderGrow();
  updateHud();
}

/* ---------- gacha ---------- */
var RATES = [
  {g:1, p:44.5}, {g:2, p:30}, {g:3, p:17}, {g:4, p:6.5}, {g:5, p:1.8}, {g:6, p:0.2}
];

function rollGrade(forceRare){
  var g = 1, r = Math.random()*100, acc = 0;
  for(var i=0;i<RATES.length;i++){
    acc += RATES[i].p;
    if(r < acc){ g = RATES[i].g; break; }
  }
  if(forceRare && g < 3) g = 3;
  return g;
}

function rollItem(){
  var forceLegend = state.gacha.legendPity >= 59;
  var forceRare = state.gacha.rarePity >= 9 && !forceLegend;
  var grade;
  if(forceLegend){
    grade = Math.random() < 0.1 ? 6 : 5;
  } else {
    grade = rollGrade(forceRare);
  }
  // type
  var tr = Math.random();
  var type = tr < 0.45 ? 'weapon' : (tr < 0.8 ? 'armor' : 'skill');
  var pool = ITEMS.filter(function(it){ return it.type === type && it.grade === grade; });
  var d = pick(pool);

  // pity counters
  state.gacha.legendPity = grade >= 5 ? 0 : state.gacha.legendPity + 1;
  state.gacha.rarePity = grade >= 3 ? 0 : state.gacha.rarePity + 1;
  state.gacha.total++;
  state.stats.pulls++;

  return obtainItem(d);
}

function obtainItem(d){
  // duplicate?
  var existing = null;
  for(var i=0;i<state.inv.length;i++){
    if(state.inv[i].id === d.id){ existing = state.inv[i]; break; }
  }
  if(existing){
    if((existing.lv||1) < 5){
      existing.lv = (existing.lv||1) + 1;
      return {def:d, item:existing, tag:'up', label:'승급'};
    }
    var gain = d.grade * 25;
    state.dia += gain;
    return {def:d, item:null, tag:'gone', label:'분해', dia:gain};
  }
  var it = {uid: state.uid++, id: d.id, lv:1};
  state.inv.push(it);
  // auto equip if better
  autoEquipBest(d.type);
  return {def:d, item:it, tag:'new', label:'NEW'};
}

function autoEquipBest(type){
  var slot = type === 'weapon' ? 'weapon' : type === 'armor' ? 'armor' : 'skill';
  var best = null, bestScore = -1;
  state.inv.forEach(function(it){
    var d = ITEM[it.id];
    if(!d || d.type !== type) return;
    var score = d.grade * 100 + (it.lv||1) * 8;
    if(score > bestScore){ bestScore = score; best = it; }
  });
  if(best) state.equip[slot] = best.uid;
}

function pull(count, useTicket){
  var cost = count === 11 ? 3000 : 300;
  if(useTicket){
    if(state.legendTickets <= 0){ toast('전설 확정권이 없습니다'); return; }
    state.legendTickets--;
  } else {
    if(state.dia < cost){ toast('다이아가 부족합니다'); switchTab('shop'); return; }
    state.dia -= cost;
    state.stats.spent += cost;
  }
  var results = [];
  if(useTicket){
    var pool = ITEMS.filter(function(it){ return it.grade === 5; });
    results.push(obtainItem(pick(pool)));
  } else {
    for(var i=0;i<count;i++){
      results.push(rollItem());
    }
    if(count === 11){
      var hasRare = results.some(function(r){ return r.def.grade >= 3; });
      if(!hasRare){
        // guarantee: upgrade last result to rare
        var last = results[results.length-1];
        var pool2 = ITEMS.filter(function(it){ return it.grade === 3 && it.type === last.def.type; });
        var rep = obtainItem(pool2[0]);
        results[results.length-1] = rep;
      }
    }
  }
  save();
  updateHud();
  showGachaResult(results, count);
  if(ui.tab === 'gacha') renderGacha();
}

function showGachaResult(results, count){
  var box = document.createElement('div');
  box.className = 'modal-back';
  var cards = '';
  var bestGrade = 0;
  var news = 0, ups = 0, gones = 0;
  results.forEach(function(r, i){
    bestGrade = Math.max(bestGrade, r.def.grade);
    if(r.tag === 'new') news++;
    if(r.tag === 'up') ups++;
    if(r.tag === 'gone') gones++;
    var g = GRADES[r.def.grade];
    var cls = r.def.grade === 6 ? 'res-myth' : (r.def.grade === 5 ? 'res-legend' : '');
    cards += '<div class="res-card ' + cls + '" style="border-color:' + hexA(g.c, .6) + ';animation-delay:' + (i*0.045) + 's">' +
      '<div class="rc-ico">' + r.def.icon + '</div>' +
      '<div class="rc-name" style="color:' + g.c + '">' + r.def.name + '</div>' +
      '<div style="font-size:8px;color:' + hexA(g.c,.85) + '">' + g.n + '</div>' +
      '<div class="rc-tag ' + r.tag + '">' + (r.tag==='gone' ? '+'+r.dia+'💎' : r.label + (r.item && r.item.lv>1 ? ' +'+(r.item.lv-1) : '')) + '</div>' +
    '</div>';
  });
  var title = count === 11 ? '11회 소환 결과' : (count === 'ticket' ? '전설 확정 소환' : '소환 결과');
  box.innerHTML =
    '<div class="modal">' +
      '<div class="m-title">' + title + '</div>' +
      '<div class="m-sub">' + (bestGrade >= 5 ? '✨ 전설 이상 등장! ' : '') + '신규 ' + news + ' · 승급 ' + ups + ' · 분해 ' + gones + '</div>' +
      '<div class="gacha-grid">' + cards + '</div>' +
      '<div class="m-btns"><button class="primary" data-close>확인</button></div>' +
    '</div>';
  $('#app').appendChild(box);
  requestAnimationFrame(function(){ box.classList.add('show'); });
  box.querySelector('[data-close]').addEventListener('click', function(){ closeModal(box); });
  if(bestGrade >= 5) setTimeout(function(){ burstSimple(); }, 60);
}

      '<div class="m-title">' + p.name + '</div>' +
      '<div class="m-sub">' + p.lines.join('\n') + '</div>' +
      '<div class="m-row"><span>결제 금액</span><b>₩' + comma(p.price) + '</b></div>' +
      '<div class="m-row"><span>결제 방식</span><b>테스트 결제 (시뮬레이션)</b></div>' +
      '<div class="m-sub" style="margin-top:10px;color:#8d9ab6">실제 결제는 발생하지 않습니다. 프로토타입 체험용 구매입니다.</div>' +
      '<div class="m-btns"><button class="ghost" data-cancel>취소</button><button class="primary" data-ok>결제하기</button></div>' +
    '</div>';
  $('#app').appendChild(box);
  requestAnimationFrame(function(){ box.classList.add('show'); });
  box.querySelector('[data-cancel]').addEventListener('click', function(){ closeModal(box); });
  box.querySelector('[data-ok]').addEventListener('click', function(){
    closeModal(box);
    processPayment(p.name, p.price, function(){ applyProduct(p); });
  });
}

function openDiamondPurchase(i){
  var d = DIAMONDS[i];
  if(!d) return;
  var fc = !state.own.firstCharge;
  var total = d.dia + d.bonus;
  var box = document.createElement('div');
  box.className = 'modal-back';
  box.innerHTML =
    '<div class="modal">' +
      '<div class="m-title">다이아 ' + comma(total) + ' 충전</div>' +
      '<div class="m-sub">' + (fc ? '첫 충전 2배가 적용됩니다!' : '테스트 결제로 즉시 지급됩니다.') + '</div>' +
      '<div class="m-row"><span>기본 다이아</span><b>' + comma(d.dia) + '</b></div>' +
      (d.bonus ? '<div class="m-row"><span>보너스</span><b>+' + comma(d.bonus) + '</b></div>' : '') +
      (fc ? '<div class="m-row"><span>첫 충전 2배</span><b style="color:#ff9aa2">+' + comma(d.dia) + '</b></div>' : '') +
      '<div class="m-row"><span>총 지급</span><b>' + comma(fc ? d.dia*2 + d.bonus : total) + ' 💎</b></div>' +
      '<div class="m-row"><span>결제 금액</span><b>₩' + comma(d.price) + '</b></div>' +
      '<div class="m-sub" style="margin-top:10px">실제 결제는 발생하지 않는 테스트 구매입니다.</div>' +
      '<div class="m-btns"><button class="ghost" data-cancel>취소</button><button class="primary" data-ok>결제하기</button></div>' +
    '</div>';
  $('#app').appendChild(box);
  requestAnimationFrame(function(){ box.classList.add('show'); });
  box.querySelector('[data-cancel]').addEventListener('click', function(){ closeModal(box); });
  box.querySelector('[data-ok]').addEventListener('click', function(){
    closeModal(box);
    processPayment('다이아 ' + comma(total), d.price, function(){
      var gain = d.dia + d.bonus;
      if(!state.own.firstCharge){ gain += d.dia; state.own.firstCharge = true; }
      state.dia += gain;
      save(); updateHud(); if(ui.tab==='shop') renderShop();
      toast('💎 다이아 ' + comma(gain) + ' 지급 완료');
    });
  });
}

function processPayment(name, price, done){
  var box = document.createElement('div');
  box.className = 'modal-back';
  box.innerHTML =
    '<div class="modal"><div class="paybox"><div class="spinner"></div><p>' + name + ' 결제 처리 중...</p></div></div>';
  $('#app').appendChild(box);
  requestAnimationFrame(function(){ box.classList.add('show'); });
  setTimeout(function(){
    closeModal(box);
    done();
    var doneBox = document.createElement('div');
    doneBox.className = 'modal-back';
    doneBox.innerHTML =
      '<div class="modal" style="text-align:center">' +
        '<div style="font-size:34px">✅</div>' +
        '<div class="m-title" style="margin-top:6px">구매 완료</div>' +
        '<div class="m-sub">' + name + ' · ₩' + comma(price) + '<br>테스트 구매가 정상 처리되었습니다.</div>' +
        '<div class="m-btns"><button class="primary" data-close>확인</button></div>' +
      '</div>';
    $('#app').appendChild(doneBox);
    requestAnimationFrame(function(){ doneBox.classList.add('show'); });
    doneBox.querySelector('[data-close]').addEventListener('click', function(){ closeModal(doneBox); });
    save();
  }, 950);
}

function applyProduct(p){
  var g = p.grants || {};
  if(g.dia) state.dia += g.dia;
  if(g.gold) state.gold += g.gold;
  if(g.legend) state.legendTickets += g.legend;
  if(g.pass) state.own.pass = true;
  if(g.monthly){
    state.own.monthly = true;
    state.monthlyUntil = now() + 30*86400000;
    state.lastMonthlyClaim = dayKey();
  }
  state.own[p.id] = true;
  if(g.legendEquip){
    var pool = ITEMS.filter(function(it){ return it.grade === 5 && it.type !== 'skill'; });
    var r = obtainItem(pick(pool));
    showGachaResult([r], 'ticket');
  }
  save(); updateHud();
  if(ui.tab === 'shop') renderShop();
  toast(p.name + ' 구매 완료');
}

function confirmReset(){
  var box = document.createElement('div');
  box.className = 'modal-back';
  box.innerHTML =
    '<div class="modal">' +
      '<div class="m-title">게임 데이터 초기화</div>' +
      '<div class="m-sub">모든 성장, 장비, 구매 내역이 삭제됩니다. 되돌릴 수 없습니다.</div>' +
      '<div class="m-btns"><button class="ghost" data-cancel>취소</button><button data-ok>초기화</button></div>' +
    '</div>';
  $('#app').appendChild(box);
  requestAnimationFrame(function(){ box.classList.add('show'); });
  box.querySelector('[data-cancel]').addEventListener('click', function(){ closeModal(box); });
  box.querySelector('[data-ok]').addEventListener('click', function(){
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    location.reload();
  });
}

function closeModal(box){
  box.classList.remove('show');
  setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); }, 190);
}

/* ---------- help ---------- */

  box.innerHTML =
    '<div class="modal">' +
      '<div class="m-title">게임 안내</div>' +
      '<div class="m-body" style="font-size:11.5px;line-height:1.75">' +
      '· <b>자동 전투</b>: 기사가 스스로 몬스터를 사냥하고 골드를 획득합니다.<br>' +

      '· <b>보스 도전</b>: 30초 제한. 실패해도 자동 사냥은 계속됩니다.<br>' +

      '· 진행 상황은 자동 저장됩니다.' +

      '<div class="m-btns"><button class="primary" data-close>확인</button></div>' +

/* =========================================================
   8. Offline & daily
   ========================================================= */
function dayKey(){
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function checkDaily(){
  var k = dayKey();
  if(state.dgn.day !== k){
    state.dgn.day = k;
    state.dgn.gold = 3;
    state.dgn.dia = 3;
    state.dgn.promote = 1;
  }
  // monthly daily diamonds
  if(state.own.monthly && state.monthlyUntil > now() && state.lastMonthlyClaim !== k){
    state.lastMonthlyClaim = k;
    state.dia += 200;
    setTimeout(function(){ toast('👑 월정액 축복: 다이아 200 지급'); }, 1200);
  }
}

function offlineReward(sec){
  var st = heroStats();
  var killTime = Math.max(2.0, enemyHp(state.stage) / Math.max(1, st.dps));
  var rate = goldPerKill(state.stage) / killTime;
  var gold = Math.floor(rate * sec * 0.65);
  if(state.own.monthly) gold = Math.floor(gold * 1.2);
  gold = Math.max(gold, Math.floor(10 * sec/60));
  var dia = state.own.monthly ? Math.floor(sec/3600*12) : 0;
  return {gold:gold, dia:dia};
}

function showOffline(sec, rew){
  var box = document.createElement('div');
  box.className = 'modal-back';
  var hh = Math.floor(sec/3600), mm = Math.floor((sec%3600)/60);
  var timeStr = (hh>0 ? hh + '시간 ' : '') + mm + '분';
  box.innerHTML =
    '<div class="modal">' +
      '<div class="offline-hero">' +
        '<div class="oh-ico">🌙</div>' +
        '<div class="oh-t">' + timeStr + ' 동안 기사단이 자동 사냥을 계속했습니다</div>' +
        '<div class="oh-gold">+' + fmtFull(rew.gold) + ' G</div>' +
        (rew.dia ? '<div class="oh-sub">+ ' + rew.dia + ' 💎 (월정액 보너스)</div>' : '') +
        '<div class="oh-sub">최대 12시간까지 보상이 누적됩니다</div>' +
      '</div>' +
      '<div class="m-btns"><button class="primary" data-claim>보상 수령</button></div>' +
    '</div>';
  $('#app').appendChild(box);
  requestAnimationFrame(function(){ box.classList.add('show'); });
  box.querySelector('[data-claim]').addEventListener('click', function(){
    state.gold += rew.gold;
    state.stats.goldEarned += rew.gold;
    if(rew.dia) state.dia += rew.dia;
    state.lastSeen = now();
    save(); updateHud();
    closeModal(box);
    toast('오프라인 보상 수령 완료');
  });
}

function checkOffline(isResume){
  var elapsed = (now() - (state.lastSeen || now())) / 1000;
  if(elapsed < 60){
    state.lastSeen = now();
    return;
  }
  var sec = Math.min(elapsed, 12*3600);
  var rew = offlineReward(sec);
  state.lastSeen = now();
  save();
  setTimeout(function(){ showOffline(sec, rew); }, 320);
}

/* =========================================================
   9. Init
   ========================================================= */
function initTabs(){
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){
      switchTab(b.dataset.tab);
      if(b.dataset.tab === 'gacha' || b.dataset.tab === 'shop'){
        b.classList.remove('badge');
      }
    });
  });
}

function bindActions(){
  $('#bossBtn').addEventListener('click', challengeBoss);
  var hb = $('#helpBtn');
  if(hb) hb.addEventListener('click', openHelp);
  $('#speedBtn').addEventListener('click', function(){
    if(!state.own.pass){
      toast('2배속은 상점의 패스를 구매하면 사용할 수 있습니다');
      switchTab('shop');
      var card = $('#prod-pass');
      if(card){
        card.classList.remove('highlight');
        void card.offsetWidth;
        card.classList.add('highlight');
        card.scrollIntoView({behavior:'smooth', block:'center'});
      }
      return;
    }
    state.speed = state.speed === 2 ? 1 : 2;
    updateHud(); save();
    toast(state.speed === 2 ? '2배속 전투 시작!' : '2배속 해제');
  });
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      save();
    } else {
      lastT = performance.now();
      checkOffline(true);
    }
  });
  window.addEventListener('pagehide', save);
  window.addEventListener('resize', function(){ resize(); });
}

var lastT = performance.now();
var accSave = 0;
var accHud = 0;
var accAfford = 0;

function frame(ts){
  var raw = Math.min(0.06, (ts - lastT)/1000);
  if(raw < 0) raw = 0.016;
  lastT = ts;

  var speed = (state.own.pass && state.speed === 2) ? 2 : 1;
  var dt = raw * speed;

  updateBattle(dt);
  draw();

  accSave += raw;
  accHud += raw;
  accAfford += raw;
  if(accSave > 3){ accSave = 0; save(); }
  if(accHud > 0.18){ accHud = 0; updateHud(); }
  if(accAfford > 0.7){ accAfford = 0; updateAfford(); }

  requestAnimationFrame(frame);
}

function boot(){
  var hadSave = load();
  checkDaily();
  if(state.own.pass === false) state.speed = 1;
  resize();
  initTabs();
  bindActions();
  switchTab('grow');

  var st = heroStats();
  B.hero.hp = st.hp;
  updateHud();
  updateAfford();
  requestAnimationFrame(function(ts){ lastT = ts; requestAnimationFrame(frame); });

  // offline check after layout
  if(hadSave){
    setTimeout(function(){ checkOffline(false); }, 500);
  } else {
    setTimeout(function(){ toast('아르카디아 기사단에 오신 것을 환영합니다!'); }, 600);
  }
  // first-run help
  if(!hadSave){
    setTimeout(openHelp, 1200);
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

// expose minimal debug handle
window.__ARC = {state:function(){return state;}, B:B, stats:heroStats};
})();
</script>
